# 로컬 개발 전용 설정 (2026-10-06, 코드 리뷰 #7 — J46 대응으로 분리).
# application.properties의 spring.profiles.active=dev로 기본 활성화된다 — 지금까지 모든 팀원이
# 로컬에서 쓰던 값과 동일해서, 이 분리 자체로는 아무 동작도 안 바뀐다. 나중에 실제로 배포할 일이
# 생기면 그때는 spring.profiles.active를 안 주거나 dev가 아닌 값으로 띄우면 이 파일이 안 읽혀서
# 아래 설정들이 전부 더 안전한 기본값(ddl-auto=none, show-sql=false, 템플릿 캐시 on)으로 바뀐다.

# 소스 코드(HTML, JS, CSS 등 정적 리소스)가 바뀌면 브라우저를 자동으로 새로고침
spring.devtools.livereload.enabled=true

# cache=false로 하면 매 요청마다 템플릿 파일을 다시 읽어들임 (개발 중에는 서버 재시작 없이 반영됨)
spring.thymeleaf.cache=false

spring.jpa.show-sql=true
# none / validate / update / create / create-drop
# update는 엔티티 변경사항으로 테이블 스키마를 조용히 바꾼다 — 로컬 개발 중엔 편하지만, 운영 DB에
# 쓰면 의도치 않은 스키마 변경이 생길 수 있어 개발 프로필에만 둔다.
spring.jpa.hibernate.ddl-auto=update
