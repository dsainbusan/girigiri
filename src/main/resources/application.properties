spring.application.name=girigiri

# 소스 코드(HTML, JS, CSS 등 정적 리소스)가 바뀌면 브라우저를 자동으로 새로고침
spring.devtools.livereload.enabled=true

# cache=false로 하면 매 요청마다 템플릿 파일을 다시 읽어들임 (개발 중에는 서버 재시작 없이 반영됨)
spring.thymeleaf.cache=false


## 경로 ######################################################
server.port=8080
server.servlet.context-path=/


## 로그 ######################################################
# error > warn > info > debug > trace
logging.level.root=info
logging.level.net.dsa.girigiri=debug


## 세션 ######################################################
# 단위 : s (seconds), m (minutes), h (hours), d (days)
server.servlet.session.timeout=60m


## MySQL ####################################################
# 프로젝트 루트(build.gradle, .gitignore와 동일 위치)에 .env 파일을 생성하고 아래 값을 채운다.
# 필요한 키 목록은 README.md의 "로컬 실행" 섹션 참고. .env는 .gitignore에 등록되어 있어 커밋되지 않는다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


## JPA ######################################################
spring.jpa.show-sql=true
# none / validate / update / create / create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


## FILE #####################################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB


## 카카오맵 ###################################################
# JavaScript 키 (브라우저에 노출되는 값 — 카카오 디벨로퍼스에서 플랫폼 도메인 등록 필수)
kakao.map.js-key=${KAKAO_MAP_API_KEY}
