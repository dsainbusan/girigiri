spring.application.name=girigiri

# 소스 코드(HTML, JS, CSS 등 정적 리소스)가 바뀌면 브라우저를 자동으로 새로고침
spring.devtools.livereload.enabled=true

# cache=false로 하면 매 요청마다 템플릿 파일을 다시 읽어들임 (개발 중에는 서버 재시작 없이 반영됨)
spring.thymeleaf.cache=false


## 경로 ######################################################
server.port=8080
server.servlet.context-path=/


## 로그 ######################################################
# error > warn > info > debug > trace
logging.level.root=info
logging.level.net.dsa.girigiri=debug


## 세션 ######################################################
# 단위 : s (seconds), m (minutes), h (hours), d (days)
server.servlet.session.timeout=60m


## MySQL ####################################################
# 프로젝트 루트(build.gradle, .gitignore와 동일 위치)에 .env 파일을 생성하고 아래 값을 채운다.
# 필요한 키 목록은 README.md의 "로컬 실행" 섹션 참고. .env는 .gitignore에 등록되어 있어 커밋되지 않는다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


## JPA ######################################################
spring.jpa.show-sql=true
# none / validate / update / create / create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


## FILE #####################################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB


## Supabase Storage (영수증 PDF 저장) 채현 ##########################
# 필요한 키 목록/발급 방법은 README.md의 "로컬 실행" 섹션 참고. 마찬가지로 .env에만 채운다.
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:receipts}

## PortOne 결제 (채현) ###############################################
# 필요한 키 목록/발급 방법은 README.md의 "로컬 실행" 섹션 참고. .env에만 채운다.
# 작성 시점(2026-08-24)엔 팀에 PortOne 테스트 계정이 아직 없어서 전부 빈 값 — 계정 만들고 .env를
# 채우기 전까지는 체크아웃 화면에 "결제 준비중" 안내만 뜨고 실제 결제창은 안 뜬다
# (PortOneClient.isConfigured() 참고). 계정 생기면 .env만 채우면 코드 수정 없이 바로 동작한다.
portone.store-id=${PORTONE_STORE_ID:}
portone.channel-key=${PORTONE_CHANNEL_KEY:}
portone.api-secret=${PORTONE_API_SECRET:}

## Claude API 고객 지원 챗봇 (채현) ###################################
# 필요한 키 목록/발급 방법은 README.md의 "로컬 실행" 섹션 참고. .env에만 채운다.
# 작성 시점(2026-08-25)엔 팀에 Claude API 키가 아직 없어서 빈 값 — 키 발급받아 .env를 채우기
# 전까지는 마이페이지 챗봇에 메시지를 보내면 "챗봇이 아직 준비중이에요" 안내만 뜬다
# (ClaudeClient.isConfigured() 참고). 키만 채우면 코드 수정 없이 바로 동작한다.
claude.api-key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
claude.max-tokens=${CLAUDE_MAX_TOKENS:1024}

## 카카오맵 ###################################################
# JavaScript 키 (브라우저에 노출되는 값 — 카카오 디벨로퍼스에서 플랫폼 도메인 등록 필수)
kakao.map.js-key=${KAKAO_MAP_API_KEY}


## OAuth2 소셜 로그인 (구글/카카오/라인) #############################
# 추가됨 (2026-08-21) — 왜: dev 브랜치에는 이 블록이 merge된 적이 없어(WebSecurityConfig가 여전히
# form-login 스텁이었음) master 브랜치의 완성된 설정을 그대로 포팅했다.
# 자체 회원가입은 없음 — 소셜 로그인이 곧 회원가입(최초 로그인 시 자동 계정 생성).
# client-id/secret은 각 개발자 콘솔에서 발급받아 .env에 채운다 (README.md 참고).
# 리다이렉트 URI는 기본값({baseUrl}/login/oauth2/code/{registrationId})을 각 콘솔에 등록한다.
#   예) http://localhost:8080/login/oauth2/code/google
#
# google은 Spring Security가 미리 알고 있는 "common provider"라 redirect-uri를 안 적어도
# 기본값이 자동으로 채워지지만, kakao/line처럼 authorization-uri 등을 직접 지정한 커스텀
# provider는 이 자동 채움 대상이 아니라서 redirect-uri가 비어있으면 "redirectUri cannot be
# empty" 예외로 서버 기동 자체가 실패한다 → kakao/line 등록 블록에 redirect-uri를 명시적으로 추가함.

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# 구글은 브라우저에 이미 로그인된 세션이 있으면 계정 선택 화면 없이 바로 그 계정으로 로그인시켜버린다
# (우리 앱과 무관한 구글 자체 세션). authorization-uri 뒤에 prompt=select_account를 붙이면 매번
# 계정 선택 화면을 강제로 띄운다. google은 common provider라 authorization-uri 기본값이 코드에
# 내장돼 있어서, 커스터마이징하려면 여기서 전체 URL을 명시해야 한다.
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
# account_email 스코프는 카카오 "비즈 앱 전환 + 채널 연결" 심사가 있어야 정식으로 열리는데, 개발
# 단계 앱에서 요청하면 KOE205(설정하지 않은 동의항목) 에러로 로그인 자체가 막힌다. 그래서 scope에서
# 빼뒀다 — UserEntity.email은 구글 로그인 때만 채워지고 카카오/라인은 null로 남는다(정상 동작).
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
# kakao는 common provider가 아니라 기본 redirect-uri가 자동 적용되지 않아 명시적으로 추가.
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# 구글과 동일한 이유. 카카오는 계정 선택창 대신 prompt=login으로 매번 재로그인(비밀번호 재입력 등)을
# 강제해서, 이미 로그인된 카카오 세션을 그냥 넘겨받지 않게 한다.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize?prompt=login
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.line.client-id=${LINE_CLIENT_ID}
spring.security.oauth2.client.registration.line.client-secret=${LINE_CLIENT_SECRET}
# 카카오와 동일한 이유. 이 값을 안 적으면 Spring 기본값(client_secret_basic, HTTP Basic 헤더로 인증)이
# 쓰이는데, LINE의 토큰 엔드포인트는 client_id/secret을 POST 바디로 받는 client_secret_post 방식만 지원한다.
spring.security.oauth2.client.registration.line.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.line.authorization-grant-type=authorization_code
# 카카오의 account_email과 마찬가지로 LINE도 email 스코프는 채널에서 별도로 "이메일 주소 권한" 신청
# (승인 필요)을 해야 열린다. 신청 안 된 상태로 요청하면 로그인이 막힐 수 있어 미리 빼둔다.
spring.security.oauth2.client.registration.line.scope=openid,profile
spring.security.oauth2.client.registration.line.client-name=Line
# line도 kakao와 동일한 이유로 common provider가 아니라서 명시적으로 추가.
spring.security.oauth2.client.registration.line.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# LINE은 OpenID Connect 표준 userinfo 엔드포인트 사용 (sub가 고유 식별자)
# prompt=login으로 "계정 다시 선택(로그인)"만 강제하고, 이미 동의한 사용자에게는 동의 화면을 다시
# 안 띄운다 — 회원가입 때만 동의 화면, 로그인 때는 계정 선택 후 바로 로그인.
spring.security.oauth2.client.provider.line.authorization-uri=https://access.line.me/oauth2/v2.1/authorize?prompt=login
spring.security.oauth2.client.provider.line.token-uri=https://api.line.me/oauth2/v2.1/token
spring.security.oauth2.client.provider.line.user-info-uri=https://api.line.me/oauth2/v2.1/userinfo
spring.security.oauth2.client.provider.line.user-name-attribute=sub
# scope에 openid가 있어서 Spring Security가 ID 토큰(JWT) 서명을 검증하려 하는데, 검증에 쓸 공개키
# (JWK) 목록을 가져올 주소가 없으면 "로그인에 실패했습니다"로 막힌다. LINE 공식 JWKS 엔드포인트를 지정.
spring.security.oauth2.client.provider.line.jwk-set-uri=https://api.line.me/oauth2/v2.1/certs
