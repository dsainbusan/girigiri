<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${name} + ' - 기리기리', ~{:: #content}, '', false, '', ~{:: #actionbar})}">
<body>
<div id="content" th:fragment="content" class="page">
	<div class="thumb-placeholder">이미지 준비 중</div>

	<span class="badge badge--discount" th:text="${discountRate} + '% 할인'">60% 할인</span>
	<h2 th:text="${name}" style="margin-top:var(--s-2)">크루아상 5개 세트</h2>

	<p class="price" style="margin-top:var(--s-2)">
		<span class="price__orig" th:text="${originalPrice} + '원'">12000원</span>
		<span class="price__sale" th:text="${discountedPrice} + '원'">4800원</span>
	</p>

	<div class="card" style="margin-top:var(--s-4)">
		<p class="u-sub">남은 수량: <strong th:text="${remainingQuantity}">3</strong>개</p>
		<p class="u-sub">픽업 시간: <strong th:text="${pickupTime}">오늘 21:00 ~ 21:30</strong></p>
	</div>

	<p style="margin-top:var(--s-4)" th:text="${description}">상품 설명</p>
</div>

<div id="actionbar" th:fragment="actionbar" class="bottom-cta">
	<a href="#" class="btn btn--block">예약하기</a>
</div>
</body>
</html>
