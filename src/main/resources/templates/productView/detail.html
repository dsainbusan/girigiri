<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${product.name} + ' - 기리기리', ~{:: #content}, '', false, '', ~{:: #actionbar})}">
<body>
<div id="content" th:fragment="content">
	<div th:style="'height:var(--hero-h-lg);background:' + ${thumbColor} + ';display:flex;align-items:center;justify-content:center;font-size:52px'"
	     th:text="${thumbEmoji}">🥐</div>

	<div class="page" style="padding-bottom:92px">
		<span th:if="${store != null and store.category != null}" class="badge badge--success" th:text="${store.category}">베이커리</span>
		<h1 style="margin-top:8px" th:text="${product.name}">오늘의 모둠빵 세트</h1>

		<div class="price" style="margin-top:8px">
			<span class="badge badge--discount" th:text="'-' + ${discountRate} + '%'">-51%</span>
			<span class="price__orig" th:text="${product.originalPrice} + '원'">12,000원</span>
			<span class="price__sale" th:text="${product.discountedPrice} + '원'">5,900원</span>
		</div>

		<a th:if="${store != null}" th:href="@{/user/stores/{id}(id=${store.id})}" class="store-card" style="margin-top:14px;padding:10px">
			<span class="store-card__thumb" th:if="${store.imageUrl == null}" style="width:44px;height:44px;background:var(--c-accent);font-size:16px"
			      th:text="${store.storeName.substring(0,1)}">빵</span>
			<span class="store-card__thumb" th:if="${store.imageUrl != null}" style="width:44px;height:44px">
				<img th:src="${store.imageUrl}" th:alt="${store.storeName}">
			</span>
			<span class="store-card__body" style="gap:2px">
				<span class="store-card__name" style="font-size:13px" th:text="${store.storeName}">광안리 베이커리</span>
				<span class="u-mut" style="font-size:11px" th:text="'★' + ${avgRating} + ' (' + ${reviewCount} + ')'">★4.6 (12)</span>
			</span>
			<span style="margin-left:auto;color:var(--c-text-mut)">›</span>
		</a>

		<!-- 수정됨 — info-row/info-row__ico가 컨슈머 CSS(components.css 등)에 정의돼 있지 않아
		     아이콘과 텍스트가 flex로 안 묶이고 줄바꿈됐다. 이미 있는 u-row(flex+gap) 유틸로
		     아이콘·라벨·값이 한 줄에 오게 고쳤다. -->
		<div style="margin-top:6px">
			<div class="u-row">
				<span>🕘</span>
				<span style="font-size:13px"><b>픽업 가능 시간</b> <span class="u-sub" th:text="${#strings.isEmpty(pickupLabel)} ? '매장 영업시간 참고' : ${pickupLabel}">마감까지 2시간</span></span>
			</div>
			<div class="u-row" style="margin-top:6px">
				<svg class="icon"><use href="#i-box"/></svg>
				<span style="font-size:13px"><b>남은 수량</b> <span class="u-sub" th:text="${product.remainingQuantity} + '개'">3개</span></span>
			</div>
		</div>

		<!--/* 강노은: 품절(재고 0)이면 수량 선택 자체가 의미 없어서 안내 문구로 대체하고,
		     아래 actionbar의 "예약하기"도 비활성화한다. */-->
		<div class="u-row" style="justify-content:space-between;margin-top:14px"
		     th:if="${product.remainingQuantity != null and product.remainingQuantity > 0}">
			<b style="font-size:14px">수량</b>
			<div class="stepper" id="qty-stepper">
				<span class="stepper__btn" id="qty-minus">−</span>
				<span class="stepper__val" id="qty-val">1</span>
				<span class="stepper__btn" id="qty-plus">+</span>
			</div>
		</div>
		<p class="u-sub" style="margin-top:14px;font-size:13px"
		   th:unless="${product.remainingQuantity != null and product.remainingQuantity > 0}">
			품절된 상품이에요.
		</p>

		<div class="banner" style="margin-top:14px" th:if="${savedAmount} > 0">
			<svg class="icon" style="width:16px;height:16px"><use href="#i-money"/></svg>
			<div class="u-grow">
				<div class="banner__title" th:text="'이 상품으로 ' + ${#numbers.formatInteger(savedAmount, 0, 'COMMA')} + '원 절약해요'">이 상품으로 6,100원 절약해요</div>
			</div>
		</div>

		<p class="u-sub" style="margin-top:14px;font-size:12px;line-height:1.6" th:text="${product.description}">상품 설명</p>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		(function () {
			var remaining = /*[[${product.remainingQuantity}]]*/ 1;
			var qtyVal = document.getElementById('qty-val');
			var qtyInput = document.getElementById('reserve-quantity');
			var minusBtn = document.getElementById('qty-minus');
			var plusBtn = document.getElementById('qty-plus');
			var qty = 1;

			// 강노은: 품절이면 수량 스테퍼 자체가 화면에 없다(위 th:if 참고) — null 가드.
			if (!qtyVal || !minusBtn || !plusBtn) { return; }

			function render() {
				qtyVal.textContent = qty;
				if (qtyInput) qtyInput.value = qty;
			}

			minusBtn.addEventListener('click', function () {
				if (qty > 1) { qty--; render(); }
			});
			plusBtn.addEventListener('click', function () {
				if (qty < remaining) { qty++; render(); }
			});
		})();
		/*]]>*/
	</script>
</div>

<div id="actionbar" th:fragment="actionbar" class="bottom-cta">
	<div class="bottom-cta__price">
		<small>총 결제 금액</small>
		<strong th:text="${product.discountedPrice} + '원'">5,900원</strong>
	</div>
	<!--/* 강노은: 품절(재고 0)이면 "예약하기" 자체를 비활성화한다 — 서버(ReservationService)도
	     OutOfStockException으로 막아주긴 하지만, 눌러보기 전에 화면에서 바로 알 수 있어야 한다. */-->
	<form th:if="${product.remainingQuantity != null and product.remainingQuantity > 0}"
	      th:action="@{/reservation/checkout}" method="get" style="margin-left:auto">
		<input type="hidden" name="productId" th:value="${product.id}">
		<input type="hidden" name="quantity" id="reserve-quantity" value="1">
		<button type="submit" class="btn">예약하기</button>
	</form>
	<!-- 추가됨 (2026-09-22, UI/UX 감사) — 품절이면 여기서 그냥 이탈했다. 같은 가게의 다른
	     마감세일로 바로 넘어갈 수 있게 링크로 바꾼다(가게 정보가 없는 예외적인 경우에만 비활성 버튼). -->
	<a th:if="${(product.remainingQuantity == null or product.remainingQuantity <= 0) and store != null}"
	   th:href="@{/user/stores/{id}(id=${store.id})}" class="btn" style="margin-left:auto">이 가게 다른 마감세일 보기</a>
	<button th:if="${(product.remainingQuantity == null or product.remainingQuantity <= 0) and store == null}"
	        type="button" class="btn btn--ghost" disabled style="margin-left:auto;cursor:not-allowed">품절</button>
</div>
</body>
</html>
