<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('코드로 쿠폰 받기', ~{:: #content}, '', false, '', null)}">
<body>
<!--/*
	프로모션 쿠폰 코드 입력 화면 — 2026-09-07 신규 (송채현).
	코드는 슈퍼어드민이 /superadmin/coupons에서 만든 캠페인 코드다. 캠페인당 회원 1명에게 1장만 발급된다.
*/-->
<div id="content" th:fragment="content" class="page">

	<p class="u-danger" th:if="${param.error == 'notfound'}" style="margin-bottom: var(--s-4)">존재하지 않는 코드예요.</p>
	<p class="u-danger" th:if="${param.error == 'cannot'}" style="margin-bottom: var(--s-4)">이미 받았거나 지금은 받을 수 없는 쿠폰이에요.</p>

	<form th:action="@{/coupons/claim}" method="post">
		<div class="field">
			<label class="field__label" for="code">쿠폰 코드 <span class="u-accent">*</span></label>
			<input class="input" type="text" id="code" name="code" placeholder="예: AUTUMN2026" required maxlength="30" style="text-transform: uppercase">
		</div>

		<button type="submit" class="btn btn--block" style="margin-top: var(--s-6)">쿠폰 받기</button>
	</form>
</div>
</body>
</html>
