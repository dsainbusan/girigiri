<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

	<!--
		공통 상단 헤더. badge는 선택값(예: ADMIN 모드 표시)이지만, Thymeleaf 이름 지정 파라미터
		호출 시 시그니처에 선언된 파라미터는 모두 명시해야 하므로 안 쓸 때도 badge=''로 넘긴다.
		사용: <header th:replace="~{fragments/layout :: header(title='기리기리', badge='')}"></header>
		      <header th:replace="~{fragments/layout :: header(title='사장님 대시보드', badge='관리자 모드')}"></header>
	-->
	<header th:fragment="header(title, badge)" class="app-header">
		<span class="app-header-title" th:text="${title}">기리기리</span>
		<span th:if="${badge}" class="badge badge-admin" th:text="${badge}">관리자 모드</span>
	</header>

	<!-- 공통 하단 네비게이션. 사용: <nav th:replace="~{fragments/layout :: nav(active='home')}"></nav> -->
	<nav th:fragment="nav(active)" class="app-nav">
		<a th:href="@{/}" class="app-nav-item" th:classappend="${active == 'home'} ? 'active'">홈</a>
		<a th:href="@{/mypage}" class="app-nav-item" th:classappend="${active == 'mypage'} ? 'active'">마이페이지</a>
	</nav>

</body>
</html>
