<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('픽업 확인', ~{:: #content}, 'pickup', true, '점주 모드', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/reservation.css}">

	<!-- 1. 인증 방식 전환 탭 (2026-09-25 UI/UX 개편) — QR 카메라 스캔과 직접 입력을 명확히 분리 -->
	<div class="pickup-tabs" role="tablist" aria-label="픽업 인증 방식">
		<button type="button" role="tab" id="tab-scan" class="pickup-tab is-active" data-target="scan-panel" aria-selected="true">
			📷 QR 카메라 스캔
		</button>
		<button type="button" role="tab" id="tab-manual" class="pickup-tab" data-target="manual-panel" aria-selected="false">
			⌨️ 코드 직접 입력
		</button>
	</div>

	<!-- 2. QR 카메라 스캔 패널 -->
	<div id="scan-panel" class="tab-panel">
		<div class="scanner-card">
			<div class="scanner-viewport" id="scanner-viewport">
				<div id="qr-reader" style="display:none;"></div>

				<!-- 카메라 대기 상태 (기본) -->
				<div class="scanner-idle" id="scanner-idle">
					<div class="scanner-idle__icon">
						<svg class="icon"><use href="#i-camera"/></svg>
					</div>
					<h3 class="scanner-idle__title">손님의 픽업 QR을 스캔하세요</h3>
					<p class="scanner-idle__desc">카메라를 켜서 예약 상세 화면의 QR 코드를 사각형 프레임에 맞춰주세요.</p>
					<button type="button" id="scan-toggle-btn" class="btn btn--primary scanner-idle__btn">
						카메라 켜기
					</button>
				</div>

				<!-- 스캔 진행 중 뷰파인더 오버레이 -->
				<div class="scanner-overlay" id="scanner-overlay" style="display:none;">
					<div class="scanner-badge">
						<span class="pulse-dot"></span> QR 코드를 사각형에 비춰주세요
					</div>
					<div class="scanner-reticle">
						<span class="reticle-corner reticle-corner--tl"></span>
						<span class="reticle-corner reticle-corner--tr"></span>
						<span class="reticle-corner reticle-corner--bl"></span>
						<span class="reticle-corner reticle-corner--br"></span>
						<div class="scanner-laser"></div>
					</div>
					<button type="button" id="scan-stop-btn" class="scanner-stop-btn" aria-label="스캔 중지">
						<svg class="icon" style="width:14px;height:14px;"><use href="#i-close"/></svg>
						스캔 중지
					</button>
				</div>
			</div>

			<!-- 상태 알림 (로딩/경고/단순안내) -->
			<p id="scan-status" class="scan-status"></p>

			<!-- 스캔 인식 후 검증 카드 (한 건씩 눈으로 확인 후 담기) -->
			<div id="scan-confirm-card" class="pickup-verify-card" style="display:none;">
				<div class="pickup-verify-header">
					<span class="pickup-verify-badge">스캔 확인</span>
					<span class="pickup-verify-code" id="verify-code">PICK-0000</span>
				</div>
				<div class="pickup-verify-body">
					<h4 class="pickup-verify-product" id="verify-product">상품명</h4>
					<div class="pickup-verify-meta">
						<span id="verify-qty">1개</span>
						<span>·</span>
						<span id="verify-price">0원</span>
					</div>
					<p class="pickup-verify-store" id="verify-store">매장명</p>
				</div>
				<div class="pickup-verify-actions" id="scan-confirm-actions">
					<button type="button" id="scan-confirm-add-btn" class="btn btn--primary" style="flex:1;">
						✓ 대기 목록에 담기
					</button>
					<button type="button" id="scan-confirm-retry-btn" class="btn btn--outline" style="flex:1;">
						다시 스캔
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 3. 코드 직접 입력 패널 -->
	<div id="manual-panel" class="tab-panel" style="display:none;">
		<div class="manual-input-card">
			<div class="manual-input-header">
				<h3 class="manual-input-title">손님이 코드를 불러주셨나요?</h3>
				<p class="manual-input-desc">주문 상세 화면의 픽업 코드를 입력하시면 바로 목록에 담깁니다.</p>
			</div>
			<div class="manual-field-group">
				<input type="text" id="manual-code-input" placeholder="예: PICK-1001"
				       class="input manual-code-input" autocomplete="off" autocapitalize="characters" maxlength="30">
				<button type="button" id="manual-add-btn" class="btn btn--primary manual-submit-btn">확인</button>
			</div>
			<p id="manual-status" class="scan-status" style="margin-top:var(--s-3);"></p>
		</div>
	</div>

	<!-- 4. 확인된 픽업 대기 목록 (장바구니 큐) -->
	<div class="pickup-empty-card" id="cart-empty-state">
		<div class="pickup-empty-icon">
			<svg class="icon"><use href="#i-box"/></svg>
		</div>
		<p class="pickup-empty-title">확인된 픽업 대기 목록이 비어있어요</p>
		<p class="pickup-empty-desc">QR을 스캔하거나 픽업 코드를 입력하면 여기에 대기 목록으로 쌓입니다.</p>
	</div>

	<div class="pickup-queue-card" id="cart-card" style="display:none;">
		<div class="pickup-queue-header">
			<div class="pickup-queue-title">
				<span>확인된 예약</span>
				<span class="pickup-queue-badge" id="cart-count">0</span>
			</div>
			<button type="button" id="cart-clear-btn" class="btn-text-danger">전체 비우기</button>
		</div>

		<ul id="cart-list" class="pickup-queue-list"></ul>

		<div class="pickup-queue-summary">
			<span class="summary-label">총 픽업 합계</span>
			<span class="summary-value" id="cart-total-price">0원</span>
		</div>
	</div>

	<!-- 5. 일괄 처리 메인 액션 버튼 -->
	<div style="margin-top:var(--s-4);">
		<button type="button" id="batch-submit-btn" class="btn btn--primary btn--block pickup-submit-btn" disabled>
			확인된 예약 모두 픽업 처리하기
		</button>
	</div>

	<!-- 6. 일괄 처리 결과 알림 카드 -->
	<div class="pickup-result-card" id="batch-result-card" style="display:none; margin-top:var(--s-3);">
		<div class="pickup-result-header">
			<div class="pickup-result-icon" id="batch-result-icon">✅</div>
			<h3 id="batch-result-title" class="pickup-result-title"></h3>
		</div>
		<ul id="batch-result-list" class="pickup-result-list"></ul>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
	<script th:inline="javascript">
		(function () {
			// 탭 전환 엘리먼트
			let tabs = document.querySelectorAll('.pickup-tab');
			let scanPanel = document.getElementById('scan-panel');
			let manualPanel = document.getElementById('manual-panel');

			// 스캐너 엘리먼트
			let toggleBtn = document.getElementById('scan-toggle-btn');
			let stopBtn = document.getElementById('scan-stop-btn');
			let readerDiv = document.getElementById('qr-reader');
			let scannerIdle = document.getElementById('scanner-idle');
			let scannerOverlay = document.getElementById('scanner-overlay');
			let statusP = document.getElementById('scan-status');
			let confirmCard = document.getElementById('scan-confirm-card');
			let confirmActions = document.getElementById('scan-confirm-actions');
			let confirmAddBtn = document.getElementById('scan-confirm-add-btn');
			let confirmRetryBtn = document.getElementById('scan-confirm-retry-btn');
			let verifyCode = document.getElementById('verify-code');
			let verifyProduct = document.getElementById('verify-product');
			let verifyQty = document.getElementById('verify-qty');
			let verifyPrice = document.getElementById('verify-price');
			let verifyStore = document.getElementById('verify-store');

			// 수동 입력 엘리먼트
			let manualInput = document.getElementById('manual-code-input');
			let manualAddBtn = document.getElementById('manual-add-btn');
			let manualStatusP = document.getElementById('manual-status');

			// 대기 목록 엘리먼트
			let cartEmptyState = document.getElementById('cart-empty-state');
			let cartCard = document.getElementById('cart-card');
			let cartList = document.getElementById('cart-list');
			let cartCountEl = document.getElementById('cart-count');
			let cartTotalPrice = document.getElementById('cart-total-price');
			let cartClearBtn = document.getElementById('cart-clear-btn');

			// 일괄 제출 및 결과
			let batchSubmitBtn = document.getElementById('batch-submit-btn');
			let batchResultCard = document.getElementById('batch-result-card');
			let batchResultIcon = document.getElementById('batch-result-icon');
			let batchResultTitle = document.getElementById('batch-result-title');
			let batchResultList = document.getElementById('batch-result-list');

			let html5QrCode = null;
			let scanning = false;
			let paused = false;
			let cart = [];   // { pickupCode, productName, quantity, storeName, totalPrice }
			let pendingLookup = null;
			let lastScannedCode = null;
			let lastScannedAt = 0;

			// 탭 전환 핸들러
			tabs.forEach(function (tab) {
				tab.addEventListener('click', function () {
					tabs.forEach(function (t) {
						t.classList.remove('is-active');
						t.setAttribute('aria-selected', 'false');
					});
					tab.classList.add('is-active');
					tab.setAttribute('aria-selected', 'true');

					let target = tab.getAttribute('data-target');
					if (target === 'scan-panel') {
						scanPanel.style.display = 'block';
						manualPanel.style.display = 'none';
					} else {
						scanPanel.style.display = 'none';
						manualPanel.style.display = 'block';
						if (scanning) {
							stopScanning();
						}
						manualInput.focus();
					}
				});
			});

			/** 상태 피드백 표시 */
			function showStatus(text, type, targetEl) {
				let el = targetEl || statusP;
				el.style.display = 'block';
				el.textContent = text;
				el.className = 'scan-status status-' + (type || 'loading');
			}

			function hideStatus(targetEl) {
				let el = targetEl || statusP;
				el.style.display = 'none';
			}

			function escapeHtml(text) {
				let div = document.createElement('div');
				div.textContent = text;
				return div.innerHTML;
			}

			function renderCart() {
				cartList.innerHTML = '';
				cart.forEach(function (item) {
					let li = document.createElement('li');
					li.className = 'pickup-queue-item';

					let infoDiv = document.createElement('div');
					infoDiv.className = 'queue-item-info';

					let titleRow = document.createElement('div');
					titleRow.className = 'queue-item-title-row';

					let nameSpan = document.createElement('span');
					nameSpan.className = 'queue-item-name';
					nameSpan.textContent = item.productName;

					let qtySpan = document.createElement('span');
					qtySpan.className = 'queue-item-qty';
					qtySpan.textContent = '× ' + item.quantity + '개';

					titleRow.appendChild(nameSpan);
					titleRow.appendChild(qtySpan);

					let subRow = document.createElement('div');
					subRow.className = 'queue-item-sub-row';

					let codeSpan = document.createElement('span');
					codeSpan.className = 'queue-item-code';
					codeSpan.textContent = item.pickupCode;

					let dotSpan = document.createElement('span');
					dotSpan.textContent = '·';

					let priceSpan = document.createElement('span');
					priceSpan.className = 'queue-item-price';
					priceSpan.textContent = (item.totalPrice ? item.totalPrice.toLocaleString() + '원' : '0원');

					subRow.appendChild(codeSpan);
					subRow.appendChild(dotSpan);
					subRow.appendChild(priceSpan);

					infoDiv.appendChild(titleRow);
					infoDiv.appendChild(subRow);

					let removeBtn = document.createElement('button');
					removeBtn.type = 'button';
					removeBtn.className = 'queue-item-remove-btn';
					removeBtn.title = '대기 목록에서 제외';
					removeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg>';
					removeBtn.addEventListener('click', function () {
						cart = cart.filter(function (c) { return c.pickupCode !== item.pickupCode; });
						renderCart();
					});

					li.appendChild(infoDiv);
					li.appendChild(removeBtn);
					cartList.appendChild(li);
				});

				cartCountEl.textContent = cart.length;
				let totalAmount = cart.reduce(function (sum, it) { return sum + (it.totalPrice || 0); }, 0);
				cartTotalPrice.textContent = totalAmount.toLocaleString() + '원';

				if (cart.length > 0) {
					cartCard.style.display = 'block';
					cartEmptyState.style.display = 'none';
					batchSubmitBtn.disabled = false;
					batchSubmitBtn.textContent = '확인된 ' + cart.length + '건 픽업 처리하기 (' + totalAmount.toLocaleString() + '원)';
				} else {
					cartCard.style.display = 'none';
					cartEmptyState.style.display = 'block';
					batchSubmitBtn.disabled = true;
					batchSubmitBtn.textContent = '확인된 예약 모두 픽업 처리하기';
				}
			}

			if (cartClearBtn) {
				cartClearBtn.addEventListener('click', function () {
					cart = [];
					renderCart();
				});
			}

			/** 수동 입력 코드 확인 처리 */
			function addToCartIfValid(code) {
				code = (code || '').trim().toUpperCase();
				if (!code) {
					return;
				}
				if (cart.some(function (item) { return item.pickupCode === code; })) {
					showStatus('이미 확인한 코드예요: ' + code, 'warn', manualStatusP);
					return;
				}

				showStatus('코드 확인 중... (' + code + ')', 'loading', manualStatusP);

				fetch('/reservation/pickup/lookup?pickupCode=' + encodeURIComponent(code))
					.then(function (res) { return res.json(); })
					.then(function (data) {
						if (data.ok) {
							cart.push({
								pickupCode: code,
								productName: data.productName,
								quantity: data.quantity,
								storeName: data.storeName,
								totalPrice: data.totalPrice
							});
							renderCart();
							showStatus('✅ ' + data.productName + ' (' + data.quantity + '개) 목록에 추가되었어요.', 'ok', manualStatusP);
							manualInput.value = '';
							manualInput.focus();
						} else {
							showStatus('⚠️ ' + data.message + ' (' + code + ')', 'warn', manualStatusP);
						}
					})
					.catch(function () {
						showStatus('코드 확인에 실패했어요. 다시 시도해주세요. (' + code + ')', 'warn', manualStatusP);
					});
			}

			function stopScanning() {
				pendingLookup = null;
				confirmCard.style.display = 'none';
				confirmActions.style.display = 'none';
				paused = false;
				if (!html5QrCode || !scanning) {
					scannerIdle.style.display = 'flex';
					readerDiv.style.display = 'none';
					scannerOverlay.style.display = 'none';
					return;
				}
				scanning = false;
				html5QrCode.stop()
					.catch(function () { /* 이미 멈춰있어도 UI 정리는 계속 진행 */ })
					.then(function () {
						readerDiv.style.display = 'none';
						scannerOverlay.style.display = 'none';
						scannerIdle.style.display = 'flex';
						toggleBtn.textContent = '카메라 켜기';
					});
			}

			function pauseScanning() {
				if (html5QrCode && scanning && typeof html5QrCode.pause === 'function') {
					try {
						html5QrCode.pause(true);
						paused = true;
					} catch (e) { /* 무시 */ }
				}
			}

			function resumeScanning() {
				if (html5QrCode && scanning && paused && typeof html5QrCode.resume === 'function') {
					try {
						html5QrCode.resume();
					} catch (e) { /* 무시 */ }
				}
				paused = false;
			}

			function onScanSuccess(decodedText) {
				let now = Date.now();
				if (decodedText === lastScannedCode && (now - lastScannedAt) < 3000) {
					return;
				}
				lastScannedCode = decodedText;
				lastScannedAt = now;

				pauseScanning();

				if (cart.some(function (item) { return item.pickupCode === decodedText; })) {
					showStatus('이미 확인한 코드예요: ' + decodedText, 'warn');
					resumeScanning();
					return;
				}

				showStatus('코드 확인 중... (' + decodedText + ')', 'loading');

				fetch('/reservation/pickup/lookup?pickupCode=' + encodeURIComponent(decodedText))
					.then(function (res) { return res.json(); })
					.then(function (data) {
						if (data.ok) {
							pendingLookup = {
								pickupCode: decodedText,
								productName: data.productName,
								quantity: data.quantity,
								storeName: data.storeName,
								totalPrice: data.totalPrice
							};
							hideStatus();

							verifyCode.textContent = decodedText;
							verifyProduct.textContent = data.productName;
							verifyQty.textContent = '× ' + data.quantity + '개';
							verifyPrice.textContent = (data.totalPrice ? data.totalPrice.toLocaleString() + '원' : '0원');
							verifyStore.textContent = data.storeName;

							confirmCard.style.display = 'block';
							confirmActions.style.display = 'flex';
						} else {
							showStatus('⚠️ ' + data.message + ' (' + decodedText + ')', 'warn');
							resumeScanning();
						}
					})
					.catch(function () {
						showStatus('코드 확인에 실패했어요. 다시 시도해주세요. (' + decodedText + ')', 'warn');
						resumeScanning();
					});
			}

			function startScanning() {
				if (typeof Html5Qrcode === 'undefined') {
					window.girigiriAlert('QR 스캔 기능을 불러오지 못했어요 (인터넷 연결 확인). 코드를 직접 입력해주세요.');
					return;
				}
				scannerIdle.style.display = 'none';
				readerDiv.style.display = 'block';
				scannerOverlay.style.display = 'flex';
				hideStatus();
				confirmCard.style.display = 'none';
				confirmActions.style.display = 'none';

				html5QrCode = new Html5Qrcode('qr-reader');
				html5QrCode.start(
					{ facingMode: 'environment' },
					{ fps: 10, qrbox: { width: 220, height: 220 } },
					onScanSuccess
				).then(function () {
					scanning = true;
					toggleBtn.textContent = '스캔 중지';
				}).catch(function (err) {
					readerDiv.style.display = 'none';
					scannerOverlay.style.display = 'none';
					scannerIdle.style.display = 'flex';
					console.error('QR 스캔 카메라 시작 실패:', err);
					let reason = (err && err.name) ? err.name : String(err);
					window.girigiriAlert('카메라를 사용할 수 없어요. 원인 코드: ' + reason + '. 코드를 직접 입력해주세요.');
				});
			}

			toggleBtn.addEventListener('click', function () {
				if (scanning) {
					stopScanning();
				} else {
					startScanning();
				}
			});

			if (stopBtn) {
				stopBtn.addEventListener('click', function () {
					stopScanning();
				});
			}

			confirmAddBtn.addEventListener('click', function () {
				if (!pendingLookup) {
					return;
				}
				cart.push(pendingLookup);
				pendingLookup = null;
				renderCart();
				confirmCard.style.display = 'none';
				confirmActions.style.display = 'none';
				hideStatus();
				resumeScanning();
			});

			confirmRetryBtn.addEventListener('click', function () {
				pendingLookup = null;
				confirmCard.style.display = 'none';
				confirmActions.style.display = 'none';
				hideStatus();
				resumeScanning();
			});

			manualAddBtn.addEventListener('click', function () {
				addToCartIfValid(manualInput.value);
			});

			manualInput.addEventListener('keydown', function (e) {
				if (e.key === 'Enter') {
					e.preventDefault();
					manualAddBtn.click();
				}
			});

			batchSubmitBtn.addEventListener('click', function () {
				if (cart.length === 0) {
					return;
				}
				stopScanning();
				batchSubmitBtn.disabled = true;
				batchSubmitBtn.textContent = '처리 중...';
				batchResultCard.style.display = 'none';

				let params = new URLSearchParams();
				cart.forEach(function (item) { params.append('pickupCodes', item.pickupCode); });

				fetch('/reservation/pickup/batch', {
					method: 'POST',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: params.toString()
				})
					.then(function (res) { return res.json(); })
					.then(function (results) {
						let succeeded = results.filter(function (r) { return r.ok; });
						let failed = results.filter(function (r) { return !r.ok; });

						batchResultCard.style.display = 'block';
						if (failed.length === 0) {
							batchResultIcon.textContent = '🎉';
							batchResultTitle.textContent = succeeded.length + '건 모두 픽업 처리 완료!';
							batchResultTitle.style.color = 'var(--c-primary)';
						} else {
							batchResultIcon.textContent = '⚠️';
							batchResultTitle.textContent = succeeded.length + '건 완료 · ' + failed.length + '건 실패';
							batchResultTitle.style.color = 'var(--c-accent-strong)';
						}
						batchResultList.innerHTML = failed.map(function (r) {
							return '<li>⚠️ ' + escapeHtml(r.pickupCode) + ' — ' + escapeHtml(r.message) + '</li>';
						}).join('');

						let succeededCodes = succeeded.map(function (r) { return r.pickupCode; });
						cart = cart.filter(function (item) { return succeededCodes.indexOf(item.pickupCode) === -1; });
						renderCart();
					})
					.catch(function () {
						batchResultCard.style.display = 'block';
						batchResultIcon.textContent = '⚠️';
						batchResultTitle.textContent = '처리 중 오류가 발생했어요. 다시 시도해주세요.';
						batchResultTitle.style.color = 'var(--c-danger-strong)';
						batchResultList.innerHTML = '';
						renderCart();
					});
			});

			renderCart();
		})();
	</script>
</div>
</body>
</html>
