<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>픽업 확인 - 기리기리</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="app-container mode-admin">
		<header th:replace="~{fragments/layout :: header(title='픽업 확인', badge='관리자 모드')}"></header>

		<main class="app-content">
			<div class="card">
				<p class="card-sub">손님이 보여준 QR/픽업 코드를 입력하면 픽업완료로 처리돼요.</p>
			</div>

			<form th:action="@{/reservation/pickup}" method="post">
				<input type="text" name="pickupCode" placeholder="예: PICK-1001"
					   style="width:100%; height:44px; padding:0 12px; border:1px solid var(--color-border); border-radius:8px; margin-bottom:12px; box-sizing:border-box;">
				<button type="submit" class="btn btn-primary btn-block">픽업 완료 처리</button>
			</form>
		</main>
	</div>
</body>
</html>
