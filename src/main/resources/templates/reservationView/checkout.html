<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${name} + ' 예약 확인', ~{:: #content}, '', false, '', ~{:: #actionbar})}">
<body>
<div id="content" th:fragment="content" class="page">
	<div class="card">
		<h3 th:text="${name}">식빵 마감세트</h3>
		<p class="price" style="margin-top:var(--s-2)">
			<span class="price__orig" th:text="${originalPrice} + '원'">6000원</span>
			<span class="price__sale" th:text="${discountedPrice} + '원'">3000원</span>
		</p>
		<p class="u-sub">남은 수량: <strong th:text="${remainingQuantity}">4</strong>개</p>
	</div>

	<div class="card" style="margin-top:var(--s-3)">
		<p class="u-sub">예약 수량: <strong th:text="${quantity}">1</strong>개</p>
		<p class="u-sub">결제 예정 금액: <strong th:text="${totalPrice} + '원'">3000원</strong></p>
	</div>

	<p class="u-mut" style="font-size:var(--fs-xs);margin-top:var(--s-3)">
		* 픽업 시간은 예약 확정 후 지금으로부터 2시간 뒤로 자동 지정돼요.
		(픽업 시간을 직접 고르는 기능은 다음에 추가될 예정이에요.)
	</p>
</div>

<div id="actionbar" th:fragment="actionbar" class="bottom-cta">
	<form th:action="@{/reservation}" method="post" style="width:100%">
		<input type="hidden" name="productId" th:value="${productId}">
		<input type="hidden" name="quantity" th:value="${quantity}">
		<button type="submit" class="btn btn--block">예약 확정하기</button>
	</form>
</div>
</body>
</html>
