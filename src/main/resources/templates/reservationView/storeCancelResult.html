<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('취소 처리 완료', ~{:: #content}, '', true, '관리자 모드', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<div class="card u-center">
		<h3>취소 처리됐어요</h3>
		<p class="u-sub" style="margin-top:var(--s-2)">픽업 코드: <strong th:text="${pickupCode}">PICK-1001</strong></p>
		<p class="u-sub">사유: <strong th:text="${cancelReason}">매장 사정으로 취소됨</strong></p>
		<p class="u-sub">결제 금액은 손님에게 환불 처리됐어요.</p>
	</div>

	<a th:href="@{/reservation/store-cancel}" class="btn btn--outline btn--block" style="margin-top:var(--s-3)">다른 예약 취소 처리하기</a>
</div>
</body>
</html>
