<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('픽업 처리 완료', ~{:: #content}, '', true, '관리자 모드', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<div class="card u-center">
		<h3>픽업완료 처리됐어요</h3>
		<p class="u-bold" style="margin:var(--s-2) 0 2px;">
			<span th:text="${productName}">식빵 마감세트</span> × <span th:text="${quantity}">1</span>개
		</p>
		<p class="u-sub" style="margin-bottom:var(--s-2)">
			<span th:text="${storeName}">다이스키 베이커리</span> · <span th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">3,000</span>원
		</p>
		<p class="u-sub">픽업 코드: <strong th:text="${pickupCode}">PICK-1001</strong></p>
		<p class="u-sub">픽업 시각: <strong th:text="${pickedAt}">08월 20일 10:00</strong></p>
	</div>

	<a th:href="@{/reservation/pickup}" class="btn btn--outline btn--block" style="margin-top:var(--s-3)">다른 예약 픽업 처리하기</a>
</div>
</body>
</html>
