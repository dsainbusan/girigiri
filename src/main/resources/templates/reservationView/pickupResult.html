<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('픽업 처리 완료', ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/store.css}">

	<div class="dash-card empty-card">
		<div class="empty-card__icon" aria-hidden="true">
			<span style="font-size: 24px">✅</span>
		</div>
		<p class="empty-card__title">픽업완료 처리됐어요</p>
		<p class="empty-card__sub">
			<span th:text="${productName}">식빵 마감세트</span> × <span th:text="${quantity}">1</span>개 ·
			<span th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">3,000</span>원
		</p>
	</div>

	<div class="dash-card">
		<div class="u-row" style="justify-content: space-between; padding: 2px 0">
			<span class="u-sub">매장</span>
			<span class="u-bold" th:text="${storeName}">다이스키 베이커리</span>
		</div>
		<div class="u-row" style="justify-content: space-between; padding: 2px 0">
			<span class="u-sub">픽업 코드</span>
			<span class="u-bold" th:text="${pickupCode}">PICK-1001</span>
		</div>
		<div class="u-row" style="justify-content: space-between; padding: 2px 0">
			<span class="u-sub">픽업 시각</span>
			<span class="u-bold" th:text="${pickedAt}">08월 20일 10:00</span>
		</div>
	</div>

	<a th:href="@{/reservation/pickup}" class="btn btn--outline btn--block" style="margin-top:var(--s-3)">다른 예약 픽업 처리하기</a>
</div>
</body>
</html>
