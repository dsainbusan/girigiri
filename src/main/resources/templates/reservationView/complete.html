<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('예약 완료', ~{:: #content}, 'my', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<div class="card u-center">
		<img th:src="@{/reservation/{id}/qr-image(id=${reservationId})}"
			 width="180" height="180" alt="픽업 QR 코드">
		<p class="u-sub" style="margin-top:var(--s-2)">
			픽업 코드: <strong th:text="${pickupCode}">PICK-XXXXXXXX</strong>
		</p>
	</div>

	<div class="card" style="margin-top:var(--s-3)">
		<h3 th:text="${storeName}">다이스키 베이커리</h3>
		<p class="u-sub" th:text="${productName} + ' ' + ${quantity} + '개'">식빵 마감세트 1개</p>
		<p class="u-sub">결제 금액: <strong th:text="${totalPrice} + '원'">3000원</strong></p>
		<p class="u-sub">픽업 시간: <strong th:text="${pickupTime}">08월 20일 10:00</strong></p>
	</div>

	<a th:href="@{/reservation/{id}/receipt(id=${reservationId})}"
	   class="btn btn--outline btn--block" style="margin-top:var(--s-3)" target="_blank">영수증 PDF 보기</a>
</div>
</body>
</html>
