<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('예약 완료', ~{:: #content}, 'my', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<!-- 수정됨 (2026-10-05, 채채 테스트 — 뒤로가기가 여전히 체크아웃으로 가는 문제 재현) — 왜:
		 이 스크립트를 DOMContentLoaded 안에서 실행했더니, 화면이 다 그려지기 전(파싱 중)에 손님이
		 뒤로가기를 누르면 아직 history.pushState/popstate 리스너가 등록되기 전이라 그 첫 뒤로가기를
		 못 잡는 경우가 있었던 것으로 보인다(타이밍 문제). 그래서 DOMContentLoaded를 기다리지 않고,
		 이 블록을 #content의 맨 처음(화면에서 가장 먼저 파싱되는 자리)으로 옮겨서 최대한 빨리
		 실행되게 했다 — 이 스크립트는 DOM 요소를 전혀 안 쓰기 때문에(history API만 사용) DOM이
		 다 준비될 때까지 기다릴 이유가 애초에 없었다. -->
	<script th:inline="javascript">
	(function () {
		var productId = /*[[${productId}]]*/ 0;
		// 수정됨 (2026-10-05, 채채 테스트 — 뒤로가기를 또 누르면 체크아웃이 다시 보임) — 왜: 여기서
		// 상품 화면으로 보내도, 그 상품 화면에서 뒤로가기를 한 번 더 누르면 그 밑에 남아있던
		// 체크아웃(결제) 화면이 다시 보였다. ?fromReservation=1을 붙여서 보내면, 상품 화면
		// (productView/detail.html) 쪽 스크립트가 이 표시를 보고 거기서도 뒤로가기를 한 번 더
		// 가로채 체크아웃으로 안 가게 막아준다(해당 파일 스크립트 참고).
		var productUrl = '/user/products/' + productId + '?fromReservation=1';
		try {
			history.pushState(null, '', location.href);
			window.addEventListener('popstate', function onBack() {
				window.removeEventListener('popstate', onBack);
				window.location.replace(productUrl);
			});
		} catch (e) {
			// history API를 못 쓰는 환경이어도 화면 자체는 정상 동작해야 하므로 무시
		}
	})();
	</script>

	<div class="card u-center">
		<img th:src="@{/reservation/{id}/qr-image(id=${reservationId})}"
			 width="180" height="180" alt="픽업 QR 코드">
		<p class="u-sub" style="margin-top:var(--s-2)">
			픽업 코드: <strong th:text="${pickupCode}">PICK-XXXXXXXX</strong>
		</p>
	</div>

	<div class="card" style="margin-top:var(--s-3)">
		<h3 th:text="${storeName}">다이스키 베이커리</h3>
		<p class="u-sub" th:text="${productName} + ' ' + ${quantity} + '개'">식빵 마감세트 1개</p>
		<p class="u-sub">결제 금액: <strong th:text="${totalPrice} + '원'">3000원</strong></p>
		<p class="u-sub">예상 픽업 가능 시각: <strong th:text="${pickupTime}">08월 20일 10:00</strong></p>
	</div>

	<!-- 추가됨 (2026-08-21) — 왜: 결제만 끝났지 매장이 아직 확인(수락)하기 전이라, 지금 바로 찾아가면
		 안 된다는 걸 손님한테 명확히 알려준다. 매장이 수락하면 마이페이지 배지가 "픽업 가능"으로 바뀐다. -->
	<div class="banner banner--info" style="margin-top:var(--s-3)">
		<div>
			<p class="banner__title">매장에서 주문을 확인하고 있어요</p>
			<p class="banner__desc">매장이 확인(수락)하면 픽업하러 오실 수 있어요. 마이페이지에서 상태를 확인해주세요.</p>
		</div>
	</div>

	<a th:href="@{/reservation/{id}/receipt(id=${reservationId})}"
	   class="btn btn--outline btn--block" style="margin-top:var(--s-3)" target="_blank">영수증 PDF 보기</a>
</div>
</body>
</html>
