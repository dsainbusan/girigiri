<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>매장 취소 처리 - 기리기리</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="app-container mode-admin">
		<header th:replace="~{fragments/layout :: header(title='매장 취소 처리', badge='관리자 모드')}"></header>

		<main class="app-content">
			<div class="card">
				<p class="card-sub">재고 착오 등 매장 사정으로 예약을 취소해야 할 때 사용해요.
					손님 결제는 바로 취소(환불) 처리되고, 시간 제한 없이 언제든 가능해요.</p>
			</div>

			<form th:action="@{/reservation/store-cancel}" method="post">
				<input type="text" name="pickupCode" placeholder="예: PICK-1001"
					   style="width:100%; height:44px; padding:0 12px; border:1px solid var(--color-border); border-radius:8px; margin-bottom:12px; box-sizing:border-box;">
				<input type="text" name="reason" placeholder="취소 사유 (예: 재고 부족)"
					   style="width:100%; height:44px; padding:0 12px; border:1px solid var(--color-border); border-radius:8px; margin-bottom:12px; box-sizing:border-box;">
				<button type="submit" class="btn btn-primary btn-block">취소 처리</button>
			</form>
		</main>
	</div>
</body>
</html>
