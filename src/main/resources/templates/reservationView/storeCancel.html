<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('매장 취소 처리', ~{:: #content}, '', true, '관리자 모드', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<div class="card">
		<p class="u-sub">재고 착오 등 매장 사정으로 예약을 취소해야 할 때 사용해요.
			손님 결제는 바로 취소(환불) 처리되고, 시간 제한 없이 언제든 가능해요.</p>
	</div>

	<form th:action="@{/reservation/store-cancel}" method="post" style="margin-top:var(--s-3)">
		<input type="text" name="pickupCode" placeholder="예: PICK-1001" class="input" style="margin-bottom:var(--s-3)">
		<input type="text" name="reason" placeholder="취소 사유 (예: 재고 부족)" class="input" style="margin-bottom:var(--s-3)">
		<button type="submit" class="btn btn--block">취소 처리</button>
	</form>
</div>
</body>
</html>
