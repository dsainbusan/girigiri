<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('완료된 거래 내역', ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<!--/*
	완료된 거래 내역 (송채현 화면 · 2026-08-30 문창호가 날짜 그룹 + 날짜/시간대 필터 추가).
	- 기본: 픽업 완료(picked) 전체, 최신순, 날짜별로 묶어서 보여줌
	- 필터: 특정 날짜 / 그 날의 시간대(예: 8/26 10:00~12:00) — 편의점 POS "시간대별 조회" 감각
*/-->
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/reservation.css}">
	<link rel="stylesheet" th:href="@{/css/store.css}">

	<!-- 이 화면은 대시보드에서만 진입 → 뒤로가기를 항상 대시보드로 고정 -->
	<script th:inline="none">
	(function () {
		var backBtn = document.querySelector('.topbar__back');
		if (!backBtn) { return; }
		backBtn.removeAttribute('data-back');
		backBtn.addEventListener('click', function () { location.href = '/store/dashboard'; });
	})();
	</script>

	<!-- 필터 -->
	<div class="edit-section-card">
		<div class="edit-section-card__header">
			<div class="edit-section-card__title-group">
				<svg class="icon edit-section-card__icon"><use href="#i-search"/></svg>
				<h3 class="edit-section-card__title">날짜 · 시간대 조회</h3>
			</div>
		</div>
		<form method="get" th:action="@{/reservation/completed}">
			<div class="field">
				<label class="field__label" for="f-date">날짜</label>
				<input class="input" type="date" id="f-date" name="date" th:value="${filterDate}">
			</div>
			<div class="u-row" style="gap: var(--s-2); margin-top: var(--s-3)">
				<div class="field" style="flex:1">
					<label class="field__label" for="f-from">시작 시각</label>
					<input class="input" type="time" id="f-from" name="from" th:value="${filterFrom}">
				</div>
				<div class="field" style="flex:1">
					<label class="field__label" for="f-to">끝 시각</label>
					<input class="input" type="time" id="f-to" name="to" th:value="${filterTo}">
				</div>
			</div>
			<p class="u-sub" style="font-size: var(--fs-xs); margin-top: 4px">날짜만 골라도 되고, 시간대까지 좁혀도 돼요. (픽업 완료 시각 기준)</p>
			<div class="u-row" style="gap: var(--s-2); margin-top: var(--s-3)">
				<button type="submit" class="btn btn--block">조회</button>
				<a th:href="@{/reservation/completed}" class="btn btn--outline btn--block">전체 보기</a>
			</div>
		</form>
	</div>

	<!-- 결과 요약 -->
	<div class="orders-summary" style="margin-top: var(--s-4)">
		<div class="orders-summary__top">
			<span class="orders-summary__label" th:text="${filterActive} ? '조회 결과' : '픽업까지 끝난 거래'">픽업까지 끝난 거래</span>
			<span class="orders-summary__count">
				<span th:text="${totalCount}">3</span><span class="orders-summary__count-unit">건</span>
			</span>
		</div>
		<div class="orders-summary__meta">
			<span>합계 금액</span>
			<span class="orders-summary__em" th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'">26,400원</span>
			<span>· 노쇼·취소된 예약은 빠져 있어요</span>
		</div>
	</div>

	<div th:if="${totalCount == 0}" class="dash-card empty-card" style="margin-top: var(--s-3)">
		<div class="empty-card__icon" aria-hidden="true">
			<svg class="icon"><use href="#i-document"/></svg>
		</div>
		<p class="empty-card__title" th:text="${filterActive} ? '이 조건에 맞는 거래가 없어요.' : '아직 완료된 거래가 없어요.'">아직 완료된 거래가 없어요.</p>
	</div>

	<!-- 날짜별 그룹 -->
	<div th:each="group : ${groups}">
		<p class="order-log-date" th:text="${group.key}">08월 26일 (화)</p>

		<div class="order-log" th:each="r : ${group.value}">
			<div class="order-log__head">
				<span class="order-log__time" th:text="'픽업 ' + ${r.pickedTime}">픽업 10:35</span>
				<span class="order-log__code" th:text="${r.pickupCode}">PICK-1001</span>
			</div>

			<div class="order-log__title-row">
				<span class="order-log__product" th:text="${r.productName}">식빵 마감세트</span>
				<span class="order-log__qty" th:text="${r.quantity} + '개'">1개</span>
			</div>

			<div class="order-log__price-row">
				<span class="order-log__key">결제 금액</span>
				<span class="order-log__price" th:text="${#numbers.formatInteger(r.totalPrice, 0, 'COMMA')} + '원'">3,000원</span>
			</div>

			<div class="order-log__foot">
				<span class="order-log__key" th:text="'주문 ' + ${r.reservedAtDisplay}">주문 08월 21일 15:00</span>
			</div>
		</div>
	</div>

	<!-- 페이지네이션 (2026-09-28) — 전체 예약 화면과 같은 이유. 날짜/시간대 필터를 걸어둔 채로
	     페이지를 넘겨도 조건이 유지되도록 링크에 필터값을 같이 실어 보낸다. -->
	<div class="pagination" th:if="${totalPages > 1}">
		<a th:classappend="${page <= 0} ? ' is-disabled'"
		   th:href="@{/reservation/completed(page=${page - 1}, date=${filterDate}, from=${filterFrom}, to=${filterTo})}">&lsaquo;</a>
		<a th:each="p : ${#numbers.sequence(pageWindowStart, pageWindowEnd)}"
		   th:classappend="${p == page} ? ' is-active'" th:text="${p + 1}"
		   th:href="@{/reservation/completed(page=${p}, date=${filterDate}, from=${filterFrom}, to=${filterTo})}"></a>
		<a th:classappend="${page >= totalPages - 1} ? ' is-disabled'"
		   th:href="@{/reservation/completed(page=${page + 1}, date=${filterDate}, from=${filterFrom}, to=${filterTo})}">&rsaquo;</a>
	</div>
</div>
</body>
</html>
