<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('내가 쓴 리뷰', ~{:: #content}, 'my', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">

	<!-- 상단바 뒤로가기: 마이페이지로 복귀 -->
	<script th:inline="none">
	(function () {
		let backBtn = document.querySelector('.topbar__back');
		if (!backBtn) { return; }
		backBtn.removeAttribute('data-back');
		backBtn.addEventListener('click', function () {
			if (document.referrer && document.referrer.includes('/mypage')) {
				history.back();
			} else {
				location.href = '/mypage';
			}
		});
	})();
	</script>

	<!-- 강노은 (2026-10-05): 리뷰 수정/삭제 직후 1회성 안내 — 실시간 알림 토스트와 같은 모양으로
	     화면 맨 위에 떴다가 3초 뒤 사라진다(data-auto-dismiss, app.js). -->
	<div th:if="${reviewMessage != null}" class="girigiri-toast" data-auto-dismiss="3000">
		<svg class="icon" style="width:16px;height:16px"><use href="#i-check-circle"/></svg>
		<span th:text="${reviewMessage}">리뷰가 수정되었습니다.</span>
	</div>

	<!-- 리뷰가 있을 때만 상단 카운트 표시 -->
	<div class="u-row" style="justify-content:space-between; margin-bottom:var(--s-2);" th:if="${!#lists.isEmpty(reviews)}">
		<span class="u-sub" style="font-size:13px">픽업완료한 구매마다 리뷰를 남길 수 있어요</span>
		<span class="u-bold" style="font-size:13px; color:var(--c-primary);" th:text="'총 ' + ${#lists.size(reviews)} + '개'">총 0개</span>
	</div>

	<div style="display:flex;flex-direction:column;gap:0;margin-top:14px">
		<div th:each="r : ${reviews}" class="list-row" style="align-items:flex-start">
			<div class="list-row__body">
				<a th:href="@{/user/stores/{id}(id=${r.storeId})}" style="text-decoration:none;color:inherit">
					<div class="u-row" style="justify-content:space-between">
						<b style="font-size:14px" th:text="${r.storeName}">가게명</b>
						<span class="u-mut" style="font-size:11px">
							<span th:text="${r.createdAtLabel}">3일 전</span>
							<span th:if="${r.edited}" title="작성 후 내용이 수정된 리뷰예요"> · 수정됨</span>
						</span>
					</div>
					<div class="u-row" style="gap:1px;margin-top:2px">
						<svg class="icon" th:each="i : ${#numbers.sequence(1,5)}" th:classappend="${i > r.rating} ? ' icon--dim'" style="width:13px;height:13px;color:var(--c-accent)"><use href="#i-star"/></svg>
					</div>
					<!-- 강노은: 가게 상세 리뷰 탭과 동일하게 사진 → 본문 순서로 맞춘다. -->
					<img th:if="${r.imageUrl != null and !#strings.isEmpty(r.imageUrl)}" th:src="${r.imageUrl}"
					     alt="리뷰 사진" loading="lazy" onerror="this.style.display='none'"
					     style="margin-top:6px;width:100%;max-width:220px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md)">
					<p style="font-size:13px;margin-top:6px" th:text="${r.content}">리뷰 내용</p>
				</a>
				<div class="u-row" style="gap:6px;margin-top:var(--s-2);justify-content:flex-end">
					<!--/* 강노은: 이전엔 가게 상세로 돌려보내 거기서 수정하게 했는데, 이 페이지에서 바로
					     고칠 수 있게 인라인 수정 폼(아래)을 토글하는 방식으로 바꿨다. */-->
					<button type="button" class="btn btn--outline"
					        th:attr="id=${'my-review-edit-btn-' + r.id},data-toggle-target=${'my-review-edit-' + r.id}"
					        style="padding:4px 12px;font-size:12px;line-height:1">수정</button>
					<form th:action="@{/user/stores/{id}/reviews/{reviewId}/delete(id=${r.storeId}, reviewId=${r.id})}"
					      method="post" data-confirm="리뷰를 삭제할까요?" style="display:contents">
						<!--/* 강노은: 처리 후 가게 상세로 안 보내고 이 페이지로 돌아오게. */-->
						<input type="hidden" name="returnTo" value="/user/reviews/my">
						<button type="submit" class="btn btn--outline"
						        style="padding:4px 12px;font-size:12px;line-height:1;color:var(--c-danger);border-color:var(--c-danger)">삭제</button>
					</form>
				</div>

				<!--/* 강노은 (2026-10-01): 인라인 수정 폼 — 별점/내용/사진 입력 구조는 그대로 두고,
				     제출 대상만 reviewId로 지정하는 전용 수정 엔드포인트로 바꿨다(/reviews/{reviewId}/edit)
				     — "매장당 리뷰 1건" 제한이 없어지면서 (storeId, userId)만으로는 어느 리뷰를 고치는
				     건지 더 이상 특정할 수 없어서다. 라디오/hidden id에 r.id를 붙여 리뷰마다 겹치지 않게 한다. */-->
				<div class="card" style="margin-top:10px"
				     th:attr="id=${'my-review-edit-' + r.id},data-reopen-btn=${'my-review-edit-btn-' + r.id}" hidden>
					<form th:action="@{/user/stores/{storeId}/reviews/{reviewId}/edit(storeId=${r.storeId}, reviewId=${r.id})}" method="post" enctype="multipart/form-data"
					      data-confirm="리뷰를 수정할까요?">
						<!--/* 강노은: 처리 후 가게 상세로 안 보내고 이 페이지로 돌아오게. */-->
						<input type="hidden" name="returnTo" value="/user/reviews/my">
						<div class="star-input">
							<input type="radio" name="rating" value="5" th:id="${'my-star5-' + r.id}" th:checked="${r.rating} == 5"><label th:for="${'my-star5-' + r.id}">★</label>
							<input type="radio" name="rating" value="4" th:id="${'my-star4-' + r.id}" th:checked="${r.rating} == 4"><label th:for="${'my-star4-' + r.id}">★</label>
							<input type="radio" name="rating" value="3" th:id="${'my-star3-' + r.id}" th:checked="${r.rating} == 3"><label th:for="${'my-star3-' + r.id}">★</label>
							<input type="radio" name="rating" value="2" th:id="${'my-star2-' + r.id}" th:checked="${r.rating} == 2"><label th:for="${'my-star2-' + r.id}">★</label>
							<input type="radio" name="rating" value="1" th:id="${'my-star1-' + r.id}" th:checked="${r.rating} == 1"><label th:for="${'my-star1-' + r.id}">★</label>
						</div>
						<textarea name="content" class="input" style="margin-top:10px;min-height:70px;resize:vertical"
						          placeholder="가게는 어떠셨나요?" th:text="${r.content}"></textarea>
						<div class="review-upload" style="margin-top:8px" data-photo-dropzone
						     role="button" tabindex="0" aria-label="리뷰 사진 선택 (드래그 앤 드롭 가능)">
							<input type="file" name="imagePhoto" class="review-upload__input"
							       accept="image/jpeg,image/png,image/webp,image/gif" data-photo-input tabindex="-1">
							<input type="hidden" name="removeImage" value="false" data-photo-remove-flag>
							<div class="review-upload__idle" data-photo-idle
							     th:hidden="${r.imageUrl != null and !#strings.isEmpty(r.imageUrl)}">
								<span class="review-upload__badge" aria-hidden="true">📤</span>
								<p class="review-upload__text">사진을 끌어다 놓으세요</p>
								<span class="review-upload__choose">파일 선택</span>
							</div>
							<div class="review-upload__preview" data-photo-preview
							     th:hidden="${r.imageUrl == null or #strings.isEmpty(r.imageUrl)}">
								<img data-photo-preview-img th:src="${r.imageUrl}" class="review-upload__preview-img" alt="현재 등록된 리뷰 사진">
								<span class="review-upload__filename" data-photo-filename>현재 등록된 사진</span>
								<button type="button" class="review-upload__remove" data-photo-remove aria-label="사진 제거"><svg class="icon" style="width:13px;height:13px"><use href="#i-close"/></svg> 제거</button>
							</div>
						</div>
						<p class="review-upload-hint">jpg · png · webp · gif, 5MB 이하 · 새 사진을 고르면 기존 사진 대신 저장돼요</p>
						<!--/* 강노은 (2026-10-05): u-grow만 있으면 "닫기"는 콘텐츠 너비로 남아서 1:1이 아니었다 — 둘 다 flex-basis 0으로. */-->
						<div class="u-row" style="gap:8px;margin-top:10px">
							<button type="submit" class="btn" style="flex:1 1 0">리뷰 수정하기</button>
							<button type="button" class="btn btn--outline" style="flex:1 1 0" data-close-panel>닫기</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- 리뷰가 없을 때 빈 화면 카드 (출처 모를 '홈' 버튼 제거 및 정돈된 UI/UX) -->
		<div th:if="${#lists.isEmpty(reviews)}" class="card" style="text-align:center; padding:48px 20px; border-radius:var(--r-xl); background:var(--c-surface); border:1px solid var(--c-line-weak);">
			<div style="width:56px; height:56px; border-radius:50%; background:#FEF3C7; color:#D97706; display:inline-flex; align-items:center; justify-content:center; margin-bottom:var(--s-3);">
				<svg class="icon" style="width:28px; height:28px;"><use href="#i-star"/></svg>
			</div>
			<h3 style="font-size:var(--fs-md); font-weight:var(--fw-bold); margin-bottom:6px;">아직 작성한 리뷰가 없어요</h3>
			<p class="u-sub" style="font-size:var(--fs-xs); line-height:1.5; margin-bottom:var(--s-4);">다녀온 가게에 따뜻한 첫 리뷰를 남겨보세요!</p>
			<div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
				<a th:href="@{/reservation/my(tab='picked')}" class="btn btn--primary" style="display:inline-flex; align-items:center; gap:6px; padding:10px 22px; border-radius:var(--r-full); font-size:var(--fs-xs); font-weight:var(--fw-bold);">
					<svg class="icon" style="width:14px; height:14px;"><use href="#i-document"/></svg>
					<span>픽업 내역에서 리뷰 작성하기</span>
				</a>
				<a th:href="@{/app}" style="font-size:var(--fs-xs); color:var(--c-text-mut); text-decoration:none; padding:4px 8px; margin-top:2px;">
					마감 할인 가게 둘러보기 &rsaquo;
				</a>
			</div>
		</div>
	</div>

</div>
</body>
</html>
