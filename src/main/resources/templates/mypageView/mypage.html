<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('마이페이지', ~{:: #content}, ${session.viewMode == 'OWNER_MODE' ? 'my-owner' : 'my'}, false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/chat.css}">
	<link rel="stylesheet" th:href="@{/css/mypage.css}">

	<!--/*
	  마이페이지 메인 화면
	  담당: 문창호 (WBS 6.1 절약 가계부 · 마이페이지)

	  변경됨 (2026-09-22) — 왜: 대시보드(점주 모드)에서 "마이" 탭을 눌러도 이 화면 하나를 그대로
	  보여주는데, 하단 탭바가 항상 유저용으로 뜨고 찜한 가게·가계부처럼 점주 업무와 무관한 소비자
	  메뉴가 섞여 있어 헷갈린다는 지적으로, session.viewMode(ViewModeSyncInterceptor가 /mypage만은
	  건드리지 않아 여기선 실제 값을 볼 수 있다)를 기준으로 두 가지를 바꾼다:
	  (1) 하단 탭바를 유저용/점주용으로 맞춰서 보여주고,
	  (2) 점주 모드에서는 소비자 전용 메뉴(가계부 배너·예약 내역·찜한 가게·내가 쓴 리뷰)를 숨긴다
	      — "내 매장 신뢰도" 카드처럼 이미 점주 전용인 것과 알림 설정·고객지원·회원정보수정·환경설정처럼
	      공통인 것은 그대로 둔다.
	*/-->

	<!-- 1. 프로필 헤더 카드 (구조 개선: 정보 영역과 프로필 수정 버튼 분리) -->
	<div class="card" style="padding: var(--s-4); border-radius: var(--r-xl);">
		<div style="display: flex; align-items: center; gap: var(--s-3);">
			<!-- 아바타 원형 (네이비 배경 + 닉네임 첫 글자) -->
			<div style="width: 56px; height: 56px; border-radius: 50%; background: var(--c-primary); color: var(--c-primary-on); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: var(--fw-black); flex-shrink: 0;">
				<span th:text="${user != null and user.nickname != null ? #strings.substring(user.nickname, 0, 1) : 'G'}">송</span>
			</div>

			<!-- 닉네임 및 동네 / 절약 N일째 정보 -->
			<div class="u-grow" style="min-width: 0;">
				<div class="u-row" style="gap: var(--s-2); flex-wrap: wrap; align-items: center;">
					<h2 style="font-size: var(--fs-lg); font-weight: var(--fw-bold);" th:text="${user != null ? user.nickname : '로그인이 필요합니다'}">송보미</h2>
					<span th:if="${user != null and user.representativeBadge != null and T(net.dsa.girigiri.domain.Badge).findByCode(user.representativeBadge).isPresent()}"
					      class="badge" style="font-size: 10px; font-weight: var(--fw-bold); background: var(--c-badge-rep); color: var(--c-badge-rep-on); border: 1px solid var(--c-badge-rep-border);"
					      th:text="${T(net.dsa.girigiri.domain.Badge).findByCode(user.representativeBadge).get().icon} + ' ' + ${T(net.dsa.girigiri.domain.Badge).findByCode(user.representativeBadge).get().name}">
						🦸 골목길 구조대
					</span>
					<span th:if="${user != null and user.role == 'OWNER'}" class="badge badge--success" style="font-size: 10px;">사장님</span>
					<span th:if="${user != null and user.role == 'ADMIN'}" class="badge badge--accent" style="font-size: 10px;">운영자</span>
				</div>
				<p style="font-size: var(--fs-xs); color: var(--c-text-mut); margin-top: 4px;">
					<span th:text="${user != null and user.region != null ? user.region : '동네 미설정'}">광안동</span>
					<!-- "절약 N일째"는 소비자 실적 표현이라 점주 모드에선 "가입 N일째"로 표기 -->
					<span th:text="${session.viewMode == 'OWNER_MODE'} ? ' · 가입 ' : ' · 절약 '"> · 절약 </span><span th:text="${daysJoined} ?: '1'">47</span><span>일째</span>
				</p>
			</div>
		</div>

		<!-- 프로필 수정 전용 버튼 (레퍼런스 구조: 카드 내 명확한 CTA 버튼 배치) -->
		<a th:href="@{/mypage/edit}" class="btn btn--block btn--outline" style="margin-top: var(--s-3); padding: 9px 0; font-size: var(--fs-sm); font-weight: var(--fw-bold); border-color: var(--c-line); color: var(--c-text); background: var(--c-bg); border-radius: var(--r-md); text-align: center; text-decoration: none;">
			프로필 수정
		</a>
	</div>

	<!-- 2. 이번 달 절약 카드 (네이비 배너) — 점주 모드에서는 숨김 -->
	<a th:if="${session.viewMode != 'OWNER_MODE'}" th:href="@{/user/ledger}" style="background: var(--c-primary); color: var(--c-primary-on); border-radius: var(--r-lg); padding: var(--s-4) var(--s-5); margin-top: var(--s-3); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(1, 42, 140, 0.15); text-decoration: none;">
		<div>
			<div style="font-size: var(--fs-xs); opacity: 0.9; font-weight: var(--fw-medium);">이번 달 절약</div>
			<div style="font-size: 24px; font-weight: var(--fw-black); margin-top: 2px;">
				<span th:text="${#numbers.formatInteger(monthlySavings ?: 0, 0, 'COMMA')}">0</span><span>원</span>
			</div>
		</div>
		<span style="font-size: var(--fs-xs); font-weight: var(--fw-bold); display: inline-flex; align-items: center; gap: 2px;">가계부 &rsaquo;</span>
	</a>


	<!-- 3. 그룹 1: 나의 활동 (소비자 모드 전용) -->
	<div th:if="${session.viewMode != 'OWNER_MODE'}" class="card" style="padding: 0; border-radius: var(--r-xl); margin-top: var(--s-3); overflow: hidden;">
		<div class="mypage-group-title">나의 활동</div>
		<!-- 예약 내역 -->
		<a th:href="@{/reservation/my}" class="list-menu-item">
			<span class="list-menu-item__icon"><svg class="icon"><use href="#i-document"/></svg></span>
			<span class="list-menu-item__title">예약 내역</span>
			<span class="list-menu-item__arrow">&rsaquo;</span>
		</a>

		<!-- 찜한 가게 -->
		<a th:href="@{/user/likes}" class="list-menu-item">
			<span class="list-menu-item__icon"><svg class="icon"><use href="#i-heart"/></svg></span>
			<span class="list-menu-item__title">찜한 가게</span>
			<span class="list-menu-item__arrow">&rsaquo;</span>
		</a>

		<!-- 내가 쓴 리뷰 -->
		<a th:href="@{/user/reviews/my}" class="list-menu-item" style="border-bottom: none;">
			<span class="list-menu-item__icon"><svg class="icon"><use href="#i-star"/></svg></span>
			<span class="list-menu-item__title">내가 쓴 리뷰</span>
			<span class="list-menu-item__arrow">&rsaquo;</span>
		</a>
	</div>

	<!-- 4. 그룹 2: 고객 지원 -->
	<div class="card" style="padding: 0; border-radius: var(--r-xl); margin-top: var(--s-3); overflow: hidden;">
		<div class="mypage-group-title">고객 지원</div>
		<!-- 1:1 챗봇 상담 -->
		<a href="javascript:void(0)" id="btn-open-chatbot-row" class="list-menu-item">
			<span class="list-menu-item__icon"><svg class="icon"><use href="#i-chat"/></svg></span>
			<span class="list-menu-item__title">1:1 챗봇 상담</span>
			<span class="list-menu-item__arrow">&rsaquo;</span>
		</a>

		<!-- 문의 게시판 · FAQ -->
		<a th:href="@{/user/support}" class="list-menu-item" style="border-bottom: none;">
			<span class="list-menu-item__icon"><svg class="icon"><use href="#i-document"/></svg></span>
			<span class="list-menu-item__title">문의 게시판 · FAQ</span>
			<span class="list-menu-item__arrow">&rsaquo;</span>
		</a>
	</div>

	<!-- 5. 그룹 3: 설정 -->
	<div class="card" style="padding: 0; border-radius: var(--r-xl); margin-top: var(--s-3); overflow: hidden;">
		<div class="mypage-group-title">설정</div>
		<!-- 환경설정 (알림·언어·약관·매장알림 관리) -->
		<a th:href="@{/user/settings}" class="list-menu-item" style="border-bottom: none;">
			<span class="list-menu-item__icon"><svg class="icon"><use href="#i-settings"/></svg></span>
			<span class="list-menu-item__title">환경설정</span>
			<span class="list-menu-item__arrow">&rsaquo;</span>
		</a>
	</div>

	<!-- 6. 그룹 4: 계정 -->
	<div class="card" style="padding: 0; border-radius: var(--r-xl); margin-top: var(--s-3); margin-bottom: var(--s-5); overflow: hidden;">
		<div class="mypage-group-title">계정</div>
		<!-- 점주 모드 전환 (OWNER 계정에만 노출) -->
		<form th:if="${session.role == 'OWNER'}" th:action="@{/auth/mode}" method="post" style="margin: 0;">
			<input type="hidden" name="target" th:value="${session.viewMode == 'OWNER_MODE'} ? 'user' : 'owner'" />
			<button type="submit" class="list-menu-item" style="width: 100%; background: none; font-family: inherit; cursor: pointer; text-align: left;">
				<span class="list-menu-item__icon"><svg class="icon"><use href="#i-storefront"/></svg></span>
				<span class="list-menu-item__title" th:text="${session.viewMode == 'OWNER_MODE'} ? '일반 모드로 전환' : '점주 모드로 전환'">점주 모드로 전환</span>
				<span class="list-menu-item__arrow">&rsaquo;</span>
			</button>
		</form>

		<!-- 로그아웃 (빨간 톤 아이콘 + 텍스트, 레퍼런스 스타일) -->
		<form th:if="${user != null}" th:action="@{/auth/logout}" method="post" style="margin: 0;">
			<button type="submit" class="list-menu-item list-menu-item--danger" style="width: 100%; border-bottom: none; background: none; font-family: inherit; cursor: pointer; text-align: left;">
				<span class="list-menu-item__icon"><svg class="icon"><use href="#i-logout"/></svg></span>
				<span class="list-menu-item__title">로그아웃</span>
				<span class="list-menu-item__arrow" style="color: var(--c-danger);">&rsaquo;</span>
			</button>
		</form>
	</div>

	<!-- 6. 고객 지원 챗봇 위젯 (담당: 송채현, WBS 6.5) -->
	<!--/*
	  로그인한 사용자에게만 노출된다(REQ-F-120) — 이 마이페이지 화면 자체가 비로그인 시
	  /auth/loginForm으로 리다이렉트되므로(MypageController.mypage 참고) 별도 로그인 체크는
	  화면 쪽엔 필요 없다(서버 API는 세션을 한 번 더 확인한다 — ChatController 참고).
	  대화 내역은 서버에 저장하지 않고 이 화면의 JS 변수(chatHistory)에만 담아두며, "새 대화
	  시작" 버튼을 누르면 이 배열만 비운다(REQ-F-125). role=OWNER면 사장님용, 그 외엔 손님용
	  시스템 프롬프트로 서버(ChatService)가 알아서 답한다 — 화면에서 따로 구분해서 보낼 필요 없음.
	*/-->
	<!-- 챗봇 플로팅 버튼 — 마이페이지 화면 우측 하단에 항상 떠 있는 채팅 열기 버튼.
	     위 메뉴 리스트의 "고객 지원" 항목(문의 게시판, WBS 6.0 강노은 담당)과는 별개다 —
	     챗봇은 이 버튼에서만 열리도록 분리함. -->
	<button type="button" id="chat-fab-btn" class="chat-fab" title="고객 지원 챗봇 열기"><svg class="icon"><use href="#i-chat"/></svg></button>

	<div id="chat-panel" class="chat-panel" style="display: none;">
		<div class="chat-panel__header">
			<span class="chat-panel__title">고객 지원 챗봇</span>
			<div class="chat-panel__header-actions">
				<button type="button" id="chat-reset-btn" class="chat-panel__icon-btn" title="새 대화 시작">↺</button>
				<button type="button" id="chat-close-btn" class="chat-panel__icon-btn" title="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
			</div>
		</div>
		<div id="chat-messages" class="chat-panel__messages">
			<div class="chat-bubble chat-bubble--bot">안녕하세요! 예약, 픽업, 결제·환불 관련해서 궁금한 점을 물어보세요.</div>
		</div>
		<!-- 추가됨 (2026-09-15, 담당: 송채현, WBS "상담원 연결/에스컬레이션 버튼(1:1 문의하기 연결)")
		     — 표 항목명은 "상담원 연결"이지만 괄호 안에 적힌 것처럼 실제로 붙이는 건 실시간 상담원이
		     아니라 기존 "고객 지원" 1:1 문의 게시판(강노은 담당, /user/support)이다. 버튼 이름을
		     "상담원"이라고 하면 실시간으로 사람이 바로 답해줄 것처럼 오해할 수 있어서, 실제 동작
		     그대로 "1:1 문의하기"라고 이름 붙였다 — 새 상담 채널을 만든 게 아님. 아이콘만 있으면
		     뭔지 안 보여서(글자 없는 🙋는 호버해야만 title 툴팁이 뜨는데, 모바일엔 호버가 없다)
		     글자가 바로 보이는 링크로 뒀다. -->
		<a th:href="@{/user/support}" class="chat-escalate-link">🙋 1:1 문의하기</a>
		<!-- 추가됨 (2026-09-15, 담당: 송채현, WBS "빠른 질문(퀵 리플라이) 버튼 노출") — 자주 묻는
		     질문을 바로 눌러서 보낼 수 있게. 손님용/사장님용 질문을 다르게 보여준다(챗봇 프롬프트
		     분기와 같은 기준: user.role == 'OWNER'). 실제 전송은 아래 채팅 폼과 똑같은 로직을
		     탄다(JS의 chat-quick-reply 클릭 핸들러 참고) — 새로운 전송 경로를 만든 게 아님. -->
		<div id="chat-quick-replies" class="chat-quick-replies">
			<button type="button" class="chat-quick-reply" th:if="${user == null or user.role != 'OWNER'}" data-question="예약 취소는 언제까지 가능해요?">예약 취소 기한</button>
			<button type="button" class="chat-quick-reply" th:if="${user == null or user.role != 'OWNER'}" data-question="픽업은 어떻게 하나요?">픽업 방법</button>
			<button type="button" class="chat-quick-reply" th:if="${user == null or user.role != 'OWNER'}" data-question="환불은 어떻게 되나요?">환불 규정</button>
			<button type="button" class="chat-quick-reply" th:if="${user == null or user.role != 'OWNER'}" data-question="영수증은 어디서 봐요?">영수증 확인</button>
			<button type="button" class="chat-quick-reply" th:if="${user != null and user.role == 'OWNER'}" data-question="재고는 어떻게 등록해요?">재고 등록</button>
			<button type="button" class="chat-quick-reply" th:if="${user != null and user.role == 'OWNER'}" data-question="노쇼 처리는 어떻게 되나요?">노쇼 처리</button>
			<button type="button" class="chat-quick-reply" th:if="${user != null and user.role == 'OWNER'}" data-question="정산은 언제 되나요?">정산 시기</button>
			<button type="button" class="chat-quick-reply" th:if="${user != null and user.role == 'OWNER'}" data-question="매출 리포트는 어디서 봐요?">매출 리포트</button>
		</div>
		<form id="chat-form" class="chat-panel__input-row">
			<input type="text" id="chat-input" class="chat-panel__input" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="500">
			<button type="submit" id="chat-send-btn" class="chat-panel__send-btn">전송</button>
		</form>
	</div>

	<script>
		(function () {
			var chatHistory = [];
			var panel = document.getElementById('chat-panel');
			var fabBtn = document.getElementById('chat-fab-btn');
			var closeBtn = document.getElementById('chat-close-btn');
			var resetBtn = document.getElementById('chat-reset-btn');
			var messagesEl = document.getElementById('chat-messages');
			var form = document.getElementById('chat-form');
			var input = document.getElementById('chat-input');
			var sendBtn = document.getElementById('chat-send-btn');

			if (!panel || !fabBtn) { return; }

			// 추가됨 (2026-08-27) — 왜: 답변 기다리는 중에도 입력창/전송 버튼이 계속 눌려서, 사용자가
			// 답변 오기 전에 연달아 여러 메시지를 보내면 응답이 뒤섞이거나 순서가 꼬일 수 있었다.
			// 요청을 보내는 동안엔 입력을 막아서 한 번에 하나씩만 주고받도록 한다.
			function setSending(isSending) {
				input.disabled = isSending;
				sendBtn.disabled = isSending;
				sendBtn.textContent = isSending ? '전송중' : '전송';
			}

			function appendMessage(who, text) {
				var bubble = document.createElement('div');
				bubble.className = who === 'user' ? 'chat-bubble chat-bubble--user' : 'chat-bubble chat-bubble--bot';
				bubble.textContent = text;
				messagesEl.appendChild(bubble);
				messagesEl.scrollTop = messagesEl.scrollHeight;
				return bubble;
			}

			// 추가됨 (2026-09-15, WBS "응답 대기 중 로딩 표시(말풍선 ... 애니메이션)") — 정적인 "..."
			// 텍스트 대신 점 3개가 통통 튀는 CSS 애니메이션을 넣는다. 응답이 오면 아래 fetch 로직이
			// 그대로 loadingBubble.textContent를 덮어써서 이 마크업이 자연스럽게 답변 텍스트로 바뀐다.
			function appendLoadingBubble() {
				var bubble = document.createElement('div');
				bubble.className = 'chat-bubble chat-bubble--bot';
				bubble.innerHTML = '<span class="chat-typing"><span></span><span></span><span></span></span>';
				messagesEl.appendChild(bubble);
				messagesEl.scrollTop = messagesEl.scrollHeight;
				return bubble;
			}

			function openPanel() {
				panel.style.display = 'flex';
				input.focus();
			}
			fabBtn.addEventListener('click', openPanel);

			var chatbotRow = document.getElementById('btn-open-chatbot-row');
			if (chatbotRow) {
				chatbotRow.addEventListener('click', openPanel);
			}

			closeBtn.addEventListener('click', function () {
				panel.style.display = 'none';
			});

			// "새 대화 시작" (REQ-F-125) — 서버엔 저장된 게 없어서 프론트가 들고 있는 history만 비우면 된다.
			resetBtn.addEventListener('click', function () {
				chatHistory = [];
				messagesEl.innerHTML = '';
				appendMessage('bot', '안녕하세요! 예약, 픽업, 결제·환불 관련해서 궁금한 점을 물어보세요.');
			});

			// 추가됨 (2026-09-15, WBS "빠른 질문(퀵 리플라이) 버튼 노출") — 버튼을 누르면 그 질문을
			// 입력창에 채우고 채팅 폼을 그대로 제출한다. 실제 전송/로딩/에러 처리는 전부 아래 form의
			// submit 핸들러를 그대로 타므로 별도 전송 로직을 새로 만들지 않는다.
			var quickReplyButtons = document.querySelectorAll('.chat-quick-reply');
			quickReplyButtons.forEach(function (btn) {
				btn.addEventListener('click', function () {
					if (sendBtn.disabled) { return; } // 이미 답변 기다리는 중이면 무시
					input.value = btn.getAttribute('data-question');
					form.requestSubmit();
				});
			});

			form.addEventListener('submit', async function (e) {
				e.preventDefault();
				if (sendBtn.disabled) { return; } // 이미 응답 기다리는 중이면 무시 (중복 제출 방지)
				var text = input.value.trim();
				if (!text) {
					// (WBS "빈 메시지 전송 방지") — 서버(ChatService)도 한 번 더 막아주지만, 프론트에서
					// 아예 안 보내는 게 더 빠르고, alert로 명확하게 안내한다.
					window.girigiriAlert('메시지를 입력해주세요.');
					return;
				}

				appendMessage('user', text);
				input.value = '';
				var loadingBubble = appendLoadingBubble();
				setSending(true);

				try {
					var res = await fetch('/mypage/chat/message', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ message: text, history: chatHistory })
					});

					if (res.status === 401) {
						loadingBubble.textContent = '로그인이 필요해요.';
						return;
					}

					var data = await res.json();
					if (data.success) {
						loadingBubble.textContent = data.reply;
						chatHistory.push({ role: 'user', content: text });
						chatHistory.push({ role: 'assistant', content: data.reply });
					} else {
						loadingBubble.textContent = data.errorMessage || '답변을 가져오지 못했어요. 다시 시도해주세요.';
					}
				} catch (err) {
					loadingBubble.textContent = '답변을 가져오지 못했어요. 잠시 후 다시 시도해주세요.';
				} finally {
					setSending(false);
					input.focus();
				}
			});
		})();
	</script>

	<!--/* 추가됨 (2026-09-24) — /mypage는 하단 탭으로 들어오는 화면이라(위 layout() 호출에 active='my'
	     넘기는 것 참고) 홈·상품상세·알림함 등 어디서든 들어올 수 있어 history.back()이 매번 다른 곳으로
	     튈 수 있다. dashboard.html(사장님 하단 탭)과 동일한 이유로 뒤로가기를 홈으로 고정한다 —
	     app.js의 기본 data-back 위임보다 먼저 떼어낸다. */-->
	<script th:inline="none">
		(function () {
			var back = document.querySelector('.topbar__back[data-back]');
			if (!back) { return; }
			back.removeAttribute('data-back');
			back.addEventListener('click', function () { location.href = '/app'; });
		})();
	</script>

</div>

</body>
