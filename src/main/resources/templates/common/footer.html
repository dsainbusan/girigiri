<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--/* 하단 탭바. active: home | like | ledger | alert | my (유저) | dashboard | products | incoming | my-owner (점주)
     추가됨 (2026-09-16, UI/UX 검토) — 점주 모드 화면(dashboard/products/incoming 등)은 지금까지
     하단 탭바 자체가 없어서(active=''로 넘겨왔다), 재고관리↔예약확인처럼 자주 오가는 화면을 매번
     대시보드를 거쳐 이동해야 했다. 같은 fragment 안에서 active 값으로 유저용/점주용 탭 세트를
     나눠 그린다 — layout()의 6개 인자 시그니처(active만 넘김)는 그대로 유지해서 기존 30여개
     호출부를 건드릴 필요가 없게 했다. */-->
<nav th:fragment="bottomNav(active)" class="bottomnav">
  <!-- 아이콘 교체 (2026-09-16, 디자인 리팩토링) — 유니코드 기호(■📦🔔◐⌂♥▤ 등)를 SVG 아이콘으로.
       모든 화면에서 반복되는 자리라 레버리지가 가장 큰 교체 지점. -->
  <th:block th:if="${active == 'dashboard' or active == 'products' or active == 'incoming' or active == 'my-owner' or active == 'pickup'}">
    <a class="bottomnav__item" th:classappend="${active=='dashboard'} ? ' is-active'" th:href="@{/store/dashboard}">
      <svg class="icon bottomnav__ico"><use href="#i-dashboard"/></svg><span>대시보드</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='products'} ? ' is-active'" th:href="@{/store/products}">
      <svg class="icon bottomnav__ico"><use href="#i-box"/></svg><span>재고관리</span>
    </a>
    <a class="bottomnav__item bottomnav__item--fab" th:classappend="${active=='pickup'} ? ' is-active'" th:href="@{/reservation/pickup}" title="QR 픽업 스캔">
      <span class="bottomnav__fab-circle">
        <svg class="icon bottomnav__fab-ico"><use href="#i-camera"/></svg>
      </span>
      <span class="bottomnav__fab-label">QR 스캔</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='incoming'} ? ' is-active'" th:href="@{/reservation/incoming}">
      <svg class="icon bottomnav__ico"><use href="#i-bell"/></svg><span>예약확인</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='my-owner'} ? ' is-active'" th:href="@{/mypage}">
      <svg class="icon bottomnav__ico"><use href="#i-user"/></svg><span>마이</span>
    </a>
  </th:block>
  <th:block th:unless="${active == 'dashboard' or active == 'products' or active == 'incoming' or active == 'my-owner' or active == 'pickup'}">
    <a class="bottomnav__item" th:classappend="${active=='home'}   ? ' is-active'" th:href="@{/app}">
      <svg class="icon bottomnav__ico"><use href="#i-home"/></svg><span>홈</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='like'}   ? ' is-active'" th:href="@{/user/likes}">
      <svg class="icon bottomnav__ico"><use href="#i-heart"/></svg><span>찜</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='ledger'} ? ' is-active'" th:href="@{/user/ledger}">
      <svg class="icon bottomnav__ico"><use href="#i-ledger"/></svg><span>가계부</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='alert'}  ? ' is-active'" th:href="@{/user/alerts}">
      <svg class="icon bottomnav__ico"><use href="#i-bell"/></svg><span>알림</span>
    </a>
    <a class="bottomnav__item" th:classappend="${active=='my'}     ? ' is-active'" th:href="@{/mypage}">
      <svg class="icon bottomnav__ico"><use href="#i-user"/></svg><span>마이</span>
    </a>
  </th:block>
</nav>

</body>
</html>
