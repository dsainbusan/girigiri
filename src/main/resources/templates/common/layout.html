<!DOCTYPE html>
<!--/*
  공통 레이아웃 — 모든 페이지는 이 fragment를 감싸 쓴다. (페이지마다 새 레이아웃 만들지 말 것)

  사용법 (페이지 템플릿 예):
  <html th:replace="~{common/layout :: layout('마이페이지', ~{:: #content}, 'ledger', false, '', null)}">
    <body>
      <div id="content" th:fragment="content"> ...페이지 본문... </div>
    </body>
  </html>

  파라미터 (6개 전부 명시할 것 — 위치 인자라 생략은 되지만, badge를 빠뜨려 500 에러가 났던 전례가 있어
  팀 컨벤션으로 항상 전부 채운다)
   - title     : 상단바 제목 & <title>
   - content   : 본문 fragment (~{:: #content})
   - active    : 하단 탭 활성값
                 유저: 'home' | 'like' | 'ledger' | 'alert' | 'my'
                 점주(2026-09-16 추가): 'dashboard' | 'products' | 'incoming' | 'my-owner'
                 '' 넘기면 하단 탭바 없음(common/footer.html의 bottomNav(active) 참고)
   - dark      : 상단바 다크 여부 (사장님/운영자 모드는 true)
   - badge     : 상단바 제목 옆에 붙는 텍스트 뱃지 (예: '관리자 모드'), 없으면 ''
   - actionbar : 상세/체크아웃형 화면의 하단 고정 버튼바 fragment (~{:: #actionbar}), 없으면 null
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, active, dark, badge, actionbar)" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title th:text="${title} ?: 'ギリギリ'">ギリギリ</title>
  <!-- 2026-09-21 추가 — 왜: tokens.css의 --font-base가 1순위로 "Noto Sans KR"을 선언해뒀는데
       정작 이 폰트를 실제로 불러오는 곳이 어디에도 없어서, 모든 기기가 항상 시스템 기본 폰트로
       폴백하고 있었다(맥은 산 프란시스코, 윈도우는 맑은 고딕 등 — 기기마다 다르게 보임).
       Google Fonts에서 실제로 로드해서 선언한 폰트가 진짜로 적용되게 한다. --fw-* 토큰이 쓰는
       굵기(400/500/600/700/900)만 필요한 만큼 받는다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
</head>

      <symbol id="i-lock" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/></symbol>
      <symbol id="i-desktop" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M2.25 5.25a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3V15a3 3 0 0 1-3 3h-3v.257c0 .597.237 1.17.659 1.591l.621.622a.75.75 0 0 1-.53 1.28h-9a.75.75 0 0 1-.53-1.28l.621-.622a2.25 2.25 0 0 0 .659-1.59V18h-3a3 3 0 0 1-3-3V5.25Zm1.5 0v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5Z" clip-rule="evenodd"/></symbol>

      <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l6.5 6.5a.75.75 0 0 1 0 1.06l-6.5 6.5a.75.75 0 1 1-1.06-1.06L14.19 12 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></symbol>
    </svg>

    <!-- 공용 확인/알림 모달 (2026-09-16) — window.confirm()/alert()/prompt() 대체. 화면마다 하나씩
         만들지 않고 레이아웃에 한 번만 존재 — app.js의 girigiriConfirm/girigiriAlert/
         girigiriPromptNumber가 이 마크업을 채워서 연다(원래 checkout.html 전용이던
         .modal-overlay/.modal-box를 components.css로 승격해서 재사용). -->
    <div id="girigiri-modal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <div id="girigiri-modal-icon" class="modal-box__icon"><svg class="icon"><use href="#i-warning"/></svg></div>
        <p id="girigiri-modal-title" class="modal-box__title" hidden></p>
        <p id="girigiri-modal-desc" class="modal-box__desc"></p>
        <input id="girigiri-modal-input" class="input modal-box__field" type="number" hidden>
        <div class="modal-box__actions">
          <button type="button" id="girigiri-modal-ok" class="btn btn--block">확인</button>
          <button type="button" id="girigiri-modal-cancel" class="btn btn--outline btn--block" hidden>취소</button>
        </div>
      </div>
    </div>

    <!--/*
      강노은: 위치+알림벨 전용 상단바(topbarHome)는 "진짜 홈 화면"에서만 쓴다.
      active=='home'으로 판단하면 안 된다 — 하단 탭 강조 목적으로 다른 화면(가게 상세, 검색 결과 등)도
      active='home'을 넘기게 되면서, 그 화면들까지 제목 없는 홈 전용 상단바로 바뀌어버리는 문제가 있었다
      (직접 확인함). 그래서 HomeController만 채워주는 model attribute인 location의 존재 여부로 구분한다
      — location/unreadCount는 layout(...) 파라미터가 아니라 컨트롤러가 model에 넣어준 값을 그대로 읽는다
      (Thymeleaf fragment는 상위 model attribute에 계속 접근 가능하다).
      위와 같은 이유로 th:if와 th:replace를 같은 태그에 같이 쓰지 않는다 — 바깥 div(th:if)/안쪽 div(th:replace)로 분리.
    */-->
    <div th:if="${location != null}">
      <div th:replace="~{common/header :: topbarHome(${location}, ${unreadCount} ?: 0, ${loggedIn} ?: false)}"></div>
    </div>
    <div th:if="${location == null}">
      <div th:replace="~{common/header :: topbar(${title}, ${dark}, ${badge})}"></div>
    </div>

    <!-- 본문 -->
    <!--/* 변경됨 (2026-08-21) — 왜: 하단 액션바(actionbar)가 sticky라 내용이 짧은 화면(체크아웃 등)에서
       버튼이 화면 아래로 밀려나 안 보이는 문제가 있어서 fixed로 바꿨다(아래 .bottom-cta 참고). fixed는
       문서 흐름에서 완전히 빠지므로, 액션바가 있는 화면은 본문 하단에 그만큼 여백을 더 줘야 마지막
       내용이 버튼에 가려지지 않는다 — 그래서 actionbar가 있을 때만 app__main--has-actionbar를 붙인다. */-->
    <main class="app__main" th:classappend="${actionbar} != null ? ' app__main--has-actionbar' : ''">
      <div th:replace="${content}"></div>
    </main>

    <!-- 하단 고정 액션바 (상세/체크아웃형 화면에서만) -->
    <!--/*
      변경됨 (2026-08-21) — 왜: th:replace(우선순위: fragment inclusion)가 th:if(우선순위: conditional
      evaluation)보다 먼저 처리되어, 같은 태그에 둘 다 있으면 actionbar=null이어도 th:if가 걸러주기 전에
      th:replace가 먼저 null을 fragment spec으로 resolve하려다 TemplateInputException이 났다
      ("~{${actionbar}}"로 감싸도 안쪽 표현식이 null이면 마찬가지로 실패 — 직접 재현해서 확인함).
      th:if를 바깥 요소로, th:replace를 안쪽 요소로 분리하면 th:if가 false일 때 안쪽 요소 자체를
      아예 방문하지 않으므로 th:replace가 평가되지 않는다 (actionbar 없는 화면 전체에서 500 에러 발생).
    */-->
    <div th:if="${actionbar} != null">
      <div th:replace="${actionbar}"></div>
    </div>

    <!--/* 강노은: 위 actionbar/topbarHome과 같은 이유로 th:if(바깥)/th:replace(안쪽) 분리 —
      active=''로 넘겨도 th:if가 th:replace를 못 막아서 하단 탭바가 항상 렌더링되고 있었다
      (상품 상세에서 "예약하기" 버튼을 하단 탭바가 가려서 클릭이 막히는 문제로 발견). */-->
    <div th:if="${active != null and active != ''}">
      <div th:replace="~{common/footer :: bottomNav(${active})}"></div>
    </div>

  </div>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
