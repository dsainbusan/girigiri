<!DOCTYPE html>
<!--/*
  공통 레이아웃 — 모든 페이지는 이 fragment를 감싸 쓴다. (페이지마다 새 레이아웃 만들지 말 것)

  사용법 (페이지 템플릿 예):
  <html th:replace="~{common/layout :: layout('마이페이지', ~{:: #content}, 'ledger', false, '', null)}">
    <body>
      <div id="content" th:fragment="content"> ...페이지 본문... </div>
    </body>
  </html>

  파라미터 (6개 전부 명시할 것 — 위치 인자라 생략은 되지만, badge를 빠뜨려 500 에러가 났던 전례가 있어
  팀 컨벤션으로 항상 전부 채운다)
   - title     : 상단바 제목 & <title>
   - content   : 본문 fragment (~{:: #content})
   - active    : 하단 탭 활성값
                 유저: 'home' | 'like' | 'ledger' | 'alert' | 'my'
                 점주(2026-09-16 추가): 'dashboard' | 'products' | 'incoming' | 'my-owner'
                 '' 넘기면 하단 탭바 없음(common/footer.html의 bottomNav(active) 참고)
   - dark      : 상단바 다크 여부 (사장님/운영자 모드는 true)
   - badge     : 상단바 제목 옆에 붙는 텍스트 뱃지 (예: '관리자 모드'), 없으면 ''
   - actionbar : 상세/체크아웃형 화면의 하단 고정 버튼바 fragment (~{:: #actionbar}), 없으면 null
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, active, dark, badge, actionbar)" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title th:text="${title} ?: 'ギリギリ'">ギリギリ</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

      <symbol id="i-camera" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9a3.75 3.75 0 1 0 0 7.5A3.75 3.75 0 0 0 12 9Z"/><path fill-rule="evenodd" d="M9.344 3.071a49.52 49.52 0 0 1 5.312 0c.967.052 1.83.585 2.332 1.39l.821 1.317c.24.383.645.643 1.11.71.386.054.77.113 1.152.177 1.432.239 2.429 1.493 2.429 2.909V18a3 3 0 0 1-3 3h-15a3 3 0 0 1-3-3V9.574c0-1.416.997-2.67 2.429-2.909.382-.064.766-.123 1.151-.178a1.56 1.56 0 0 0 1.11-.71l.822-1.315a2.942 2.942 0 0 1 2.332-1.39ZM6.75 12.75a5.25 5.25 0 1 1 10.5 0 5.25 5.25 0 0 1-10.5 0Zm12-1.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" clip-rule="evenodd"/></symbol>

      <symbol id="i-home" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.841a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.061l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 1 0 1.061 1.06l8.69-8.689Z"/><path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/></symbol>

    <!--/*
      강노은: 위치+알림벨 전용 상단바(topbarHome)는 "진짜 홈 화면"에서만 쓴다.
      active=='home'으로 판단하면 안 된다 — 하단 탭 강조 목적으로 다른 화면(가게 상세, 검색 결과 등)도
      active='home'을 넘기게 되면서, 그 화면들까지 제목 없는 홈 전용 상단바로 바뀌어버리는 문제가 있었다
      (직접 확인함). 그래서 HomeController만 채워주는 model attribute인 location의 존재 여부로 구분한다
      — location/unreadCount는 layout(...) 파라미터가 아니라 컨트롤러가 model에 넣어준 값을 그대로 읽는다
      (Thymeleaf fragment는 상위 model attribute에 계속 접근 가능하다).
      위와 같은 이유로 th:if와 th:replace를 같은 태그에 같이 쓰지 않는다 — 바깥 div(th:if)/안쪽 div(th:replace)로 분리.
    */-->
    <div th:if="${location != null}">
      <div th:replace="~{common/header :: topbarHome(${location}, ${unreadCount} ?: 0)}"></div>
    </div>
    <div th:if="${location == null}">
      <div th:replace="~{common/header :: topbar(${title}, ${dark}, ${badge})}"></div>
    </div>

    <!-- 본문 -->
    <!--/* 변경됨 (2026-08-21) — 왜: 하단 액션바(actionbar)가 sticky라 내용이 짧은 화면(체크아웃 등)에서
       버튼이 화면 아래로 밀려나 안 보이는 문제가 있어서 fixed로 바꿨다(아래 .bottom-cta 참고). fixed는
       문서 흐름에서 완전히 빠지므로, 액션바가 있는 화면은 본문 하단에 그만큼 여백을 더 줘야 마지막
       내용이 버튼에 가려지지 않는다 — 그래서 actionbar가 있을 때만 app__main--has-actionbar를 붙인다. */-->
    <main class="app__main" th:classappend="${actionbar} != null ? ' app__main--has-actionbar' : ''">
      <div th:replace="${content}"></div>
    </main>

    <!-- 하단 고정 액션바 (상세/체크아웃형 화면에서만) -->
    <!--/*
      변경됨 (2026-08-21) — 왜: th:replace(우선순위: fragment inclusion)가 th:if(우선순위: conditional
      evaluation)보다 먼저 처리되어, 같은 태그에 둘 다 있으면 actionbar=null이어도 th:if가 걸러주기 전에
      th:replace가 먼저 null을 fragment spec으로 resolve하려다 TemplateInputException이 났다
      ("~{${actionbar}}"로 감싸도 안쪽 표현식이 null이면 마찬가지로 실패 — 직접 재현해서 확인함).
      th:if를 바깥 요소로, th:replace를 안쪽 요소로 분리하면 th:if가 false일 때 안쪽 요소 자체를
      아예 방문하지 않으므로 th:replace가 평가되지 않는다 (actionbar 없는 화면 전체에서 500 에러 발생).
    */-->
    <div th:if="${actionbar} != null">
      <div th:replace="${actionbar}"></div>
    </div>

    <!--/* 강노은: 위 actionbar/topbarHome과 같은 이유로 th:if(바깥)/th:replace(안쪽) 분리 —
      active=''로 넘겨도 th:if가 th:replace를 못 막아서 하단 탭바가 항상 렌더링되고 있었다
      (상품 상세에서 "예약하기" 버튼을 하단 탭바가 가려서 클릭이 막히는 문제로 발견). */-->
    <div th:if="${active != null and active != ''}">
      <div th:replace="~{common/footer :: bottomNav(${active})}"></div>
    </div>

  </div>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
