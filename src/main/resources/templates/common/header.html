<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--/* 상단바. dark=true 면 사장님/운영자용 다크 헤더. badge는 제목 옆 텍스트 뱃지(예: '관리자 모드'), 없으면 '' */-->
<header th:fragment="topbar(title, dark, badge)"
        class="topbar" th:classappend="${dark} ? ' topbar--dark' : ''">
  <button class="topbar__back" type="button" data-back aria-label="뒤로">&lsaquo;</button>
  <h1 class="topbar__title" th:text="${title}">제목</h1>
  <span th:if="${badge}" class="badge badge--accent" th:text="${badge}">관리자 모드</span>
  <span class="topbar__spacer"></span>
  <!--/*
    2026-09-16 — 유저 모드/점주 모드 전환 버튼을 여기서 대시보드(/store/dashboard)·마이페이지(/mypage)
    하단으로 옮겼다(점주 모드엔 원래 하단 탭바가 없어서 로그아웃 버튼도 거기 뒀던 것과 같은 이유 —
    모든 점주 화면 상단바를 매번 차지하는 대신, 모드별 "홈" 화면 하단에서 전환하도록). 대신 점주 모드
    상단바 우측엔 공지사항 벨을 둔다(강노은 홈 화면의 알림벨과 같은 자리 — dark=true인 점주/운영 화면
    에서만 보인다).
  */-->
  <a th:if="${dark}" th:href="@{/store/notices}" class="topbar__action" title="공지사항">📢</a>
</header>

<!--/*
  강노은: 홈 화면 전용 상단바 (위치 배지 + 알림벨). 뒤로가기 버튼이 없다 — 홈은 최상위 화면이라 불필요.
  location: 표시할 동네 텍스트. 위치 권한을 허용하면 실제 동네 이름(카카오 역지오코딩), 아니면 "내 동네" 고정 문구(HomeController#resolveLocationLabel 참고).
  unreadCount: 안 읽은 알림 개수. 0보다 크면 벨 아이콘에 빨간 점. 알림 기능 붙기 전까지는 항상 0.
*/-->
<header th:fragment="topbarHome(location, unreadCount)" class="topbar">
  <span class="u-row" style="font-size:14px;font-weight:900">
    <svg class="icon" style="width:15px;height:15px"><use href="#i-pin"/></svg><span th:text="${location}">내 동네</span>
  </span>
  <span class="topbar__spacer"></span>
  <!--/* 강노은: /notifications는 실제로 없는 경로였다(하단 탭바는 /user/alerts를 씀) — 알림함을
       만들면서 통일했다. */-->
  <!--/* id="alert-bell"/"alert-dot": home.html의 SSE 스크립트가 실시간으로 이 점을 붙였다 뗐다 한다. */-->
  <a th:href="@{/user/alerts}" class="topbar__action" id="alert-bell" style="position:relative">
    <svg class="icon"><use href="#i-bell"/></svg>
    <span th:if="${unreadCount} != null and ${unreadCount} > 0" id="alert-dot"
          style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:999px;background:var(--c-danger)"></span>
  </a>
</header>

</body>
</html>
