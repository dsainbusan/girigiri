<!DOCTYPE html>
<!--/*
  슈퍼어드민 wide 레이아웃 미리보기 (개발 참고용). /styleguide/admin 로 접속.
  common/layout-admin 을 감싸 쓰는 표준 페이지 예시 — 실제 화면(통계/회원/매장 등) 만들 때 이 구조를 복붙한다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('통계 대시보드', ~{:: #content}, 'dashboard', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <h2 class="section-title">오늘 플랫폼 지표</h2>
  <div class="stat-grid">
    <div class="stat-card">
      <span class="stat-card__label">전체 회원수</span>
      <span class="stat-card__value">12,480</span>
      <span class="stat-card__delta u-primary">+124 오늘</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">거래량</span>
      <span class="stat-card__value">3,210건</span>
      <span class="stat-card__delta u-primary">+8.2%</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">구제량</span>
      <span class="stat-card__value">1,987개</span>
      <span class="stat-card__delta u-accent">CO2 412kg 절감</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">매출</span>
      <span class="stat-card__value">₩8,420,000</span>
      <span class="stat-card__delta u-danger">-2.1%</span>
    </div>
  </div>

  <h2 class="section-title">입점 승인 대기</h2>
  <div class="card">
    <div class="list-row">
      <div class="list-row__body">
        <div class="u-bold">동네빵집 청파점</div>
        <div class="u-sub">2026-08-20 신청 · 베이커리</div>
      </div>
      <span class="badge badge--accent">대기</span>
    </div>
    <div class="list-row">
      <div class="list-row__body">
        <div class="u-bold">싱싱반찬가게</div>
        <div class="u-sub">2026-08-19 신청 · 반찬</div>
      </div>
      <span class="badge badge--success">승인</span>
    </div>
  </div>

</div>
</body>
</html>
