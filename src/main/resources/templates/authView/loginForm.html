<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('로그인', ~{:: #content}, '', false, '', null)}">
<body>
<!--/*
	변경됨 (2026-08-21) — 왜: 브랜드 소개형 단일 화면으로 재구성해달라는 요청(참고 목업)에 맞춰
	common/layout 프래그먼트(팀 공통 레이아웃) 위에 다시 그렸다. 이 프로젝트는 자체 회원가입이 없고
	소셜 로그인 자체가 곧 가입이라(CLAUDE.md 3.1) 로그인/가입 문구를 따로 나누지 않는다.
*/-->
<div id="content" th:fragment="content" class="page">

	<div class="u-center" style="margin: var(--s-6) 0 var(--s-8)">
		<div style="width:72px;height:72px;margin:0 auto var(--s-4);border-radius:var(--r-xl);background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:var(--fw-black)">ギリ</div>
		<h1 class="u-primary">기리기리</h1>
		<p class="u-bold" style="margin-top:var(--s-2)">마감 특가로 아끼는 동네 장보기</p>
		<p class="u-mut" style="margin-top:4px">오늘도 기리기리 세이브</p>
	</div>

	<p class="u-danger u-center" th:if="${param.error}" style="margin-bottom: var(--s-4)">로그인에 실패했습니다. 다시 시도해 주세요.</p>

	<a th:href="@{/oauth2/authorization/kakao}" class="btn btn--block btn--kakao">카카오로 시작하기</a>
	<a th:href="@{/oauth2/authorization/google}" class="btn btn--block btn--google" style="margin-top:var(--s-3)">구글로 시작하기</a>
	<a th:href="@{/oauth2/authorization/line}" class="btn btn--block btn--line" style="margin-top:var(--s-3)">라인으로 시작하기</a>

	<p class="u-mut u-center" style="font-size:var(--fs-xs);margin:var(--s-4) 0">가입 시 이용약관 및 개인정보처리방침에 동의하게 됩니다</p>

	<!-- 변경됨 (2026-08-21) — 왜: role 3종 개편으로 점주(OWNER)는 로그인 후 "선택"이 아니라
	     신청 + 운영자 승인으로만 전환되므로(CLAUDE.md 3.1), 안내 문구를 실제 정책에 맞게 작성. -->
	<div class="card" style="background:var(--c-primary-weak)">
		<p class="u-bold">사장님이신가요?</p>
		<p class="u-sub" style="font-size:var(--fs-sm);margin-top:4px">로그인 후 마이페이지에서 점주 신청을 하시면, 운영자 승인 후 점주 모드를 이용하실 수 있어요.</p>
	</div>

</div>
</body>
</html>
