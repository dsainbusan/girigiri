<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('로그인', ~{:: #content}, '', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<form th:action="@{/auth/login}" method="post">
		<div class="field">
			<input class="input" type="text" name="id" placeholder="아이디">
		</div>
		<div class="field" style="margin-top:var(--s-3)">
			<input class="input" type="password" name="password" placeholder="비밀번호">
		</div>
		<button type="submit" class="btn btn--block" style="margin-top:var(--s-4)">로그인</button>
	</form>
</div>
</body>
</html>
