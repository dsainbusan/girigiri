<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('이메일로 가입', ~{:: #content}, '', false, '', null)}">
<body>
<!--/*
	이메일 회원가입 화면
	담당: 문창호 (WBS 2.1 인증)
	- 소셜 계정이 없어도 이메일+비밀번호로 가입할 수 있게 하는 4번째 옵션.
	- 2단계 진행: (1) 이메일/비밀번호 입력 → 형식·중복 검증 후 인증번호 발송, 계정은 아직 안 만든다.
	  (2) 인증번호 확인 → 통과해야 그때 실제 계정을 만들고 자동 로그인시켜 /auth/signup(부가정보
	  입력)으로 보낸다. 변경됨 (2026-09-24, 코드 감사) — 예전엔 인증 없이 1단계에서 바로 계정을
	  만들어서, 인증 안 된 남의 이메일로 계정을 선점("스쿼팅")당하면 진짜 주인이 나중에 그 이메일로
	  못 가입하는 결함이 있었다. AuthService.validateEmailSignupInput/completeEmailSignup 주석 참고.
*/-->
<div id="content" th:fragment="content" class="page">

	<p class="u-danger" th:if="${param.error != null and param.error[0] == 'email'}" style="margin-bottom: var(--s-4)">이메일 형식이 올바르지 않아요.</p>
	<p class="u-danger" th:if="${param.error != null and param.error[0] == 'password'}" style="margin-bottom: var(--s-4)">비밀번호는 8자 이상이어야 해요.</p>
	<p class="u-danger" th:if="${param.error != null and param.error[0] == 'mismatch'}" style="margin-bottom: var(--s-4)">비밀번호가 서로 일치하지 않아요.</p>
	<p class="u-danger" th:if="${param.error != null and param.error[0] == 'duplicate'}" style="margin-bottom: var(--s-4)">이미 가입된 이메일이에요. 로그인해 주세요.</p>

	<form id="email-signup-form">
		<div class="field">
			<label class="field__label" for="emailLocal">이메일</label>
			<div class="u-row" style="gap:6px;align-items:center">
				<input class="input" type="text" id="emailLocal" placeholder="example" autocomplete="off" required style="flex:1;min-width:0">
				<span class="u-mut" style="flex:none">@</span>
				<select class="input" id="emailDomainSelect" style="flex:1;min-width:0">
					<option value="naver.com">naver.com</option>
					<option value="hanmail.net">hanmail.net</option>
					<option value="hotmail.com">hotmail.com</option>
					<option value="nate.com">nate.com</option>
					<option value="yahoo.co.kr">yahoo.co.kr</option>
					<option value="empas.com">empas.com</option>
					<option value="dreamwiz.com">dreamwiz.com</option>
					<option value="freechal.com">freechal.com</option>
					<option value="lycos.co.kr">lycos.co.kr</option>
					<option value="korea.com">korea.com</option>
					<option value="gmail.com">gmail.com</option>
					<option value="hanmir.com">hanmir.com</option>
					<option value="paran.com">paran.com</option>
					<option value="__custom__">직접입력</option>
				</select>
			</div>
			<input class="input" type="text" id="emailDomainCustom" placeholder="도메인을 입력하세요 (예: mycompany.com)"
			       autocomplete="off" style="display:none;margin-top:6px">
			<input type="hidden" id="email" name="email" th:value="${email}">
		</div>

		<div class="field" style="margin-top: var(--s-4)">
			<label class="field__label" for="password">비밀번호</label>
			<input class="input" type="password" id="password" name="password" placeholder="8자 이상" minlength="8" required>
		</div>

		<div class="field" style="margin-top: var(--s-4)">
			<label class="field__label" for="passwordConfirm">비밀번호 확인</label>
			<input class="input" type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 한 번 더 입력해 주세요" minlength="8" required>
		</div>

		<!-- 1단계 통과 후에만 노출 — 인증번호 확인 전까지는 계정이 없다. -->
		<div id="email-signup-otp-block" style="display:none; margin-top: var(--s-4);">
			<div id="email-signup-otp-banner" class="otp-mock-banner" style="display:none;">
				<svg class="icon otp-mock-banner__icon"><use href="#i-lock"/></svg>
				<span class="otp-mock-banner__label">발급된 인증번호</span>
				<span id="email-signup-otp-banner-code" class="otp-mock-banner__code"></span>
			</div>
			<div class="u-row" style="justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
				<label class="field__label" for="signupOtpCode">인증번호</label>
				<span id="email-signup-otp-status" class="u-mut" style="font-size: var(--fs-xs);"></span>
			</div>
			<div class="u-row" style="gap: var(--s-2); align-items: stretch;">
				<input class="input" type="text" id="signupOtpCode" inputmode="numeric" maxlength="6"
				       placeholder="인증번호 6자리" style="flex: 1;">
				<button type="button" id="btn-verify-signup-otp" class="btn btn--outline" style="flex: none;">인증 확인</button>
			</div>
			<p id="email-signup-otp-feedback" style="display:none; font-size: var(--fs-xs); margin-top: 6px;"></p>
		</div>

		<button type="submit" id="btn-email-signup" class="btn btn--block" style="margin-top: var(--s-6)">인증번호 받기</button>
	</form>

	<p class="u-center u-sub" style="font-size: var(--fs-sm); margin-top: var(--s-4)">
		이미 계정이 있으신가요? <a th:href="@{/auth/emailLogin}" class="u-primary" style="font-weight: var(--fw-bold)">로그인</a>
	</p>

	<!-- 추가됨 (2026-09-24) — 이 이메일이 이미 다른 소셜 계정에 있을 때: 새 계정을 만드는 대신 그
	     계정에 이메일+비밀번호 로그인을 "추가"할지 물어본다. AuthController#prepareEmailSignupLink 참고. -->
	<div id="email-link-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
		<div class="modal-box email-link-modal-box">
			<p class="email-link-modal-text">
				이미 <span id="email-link-modal-provider" class="u-bold">구글</span>로 가입된 이메일이에요.
			</p>
			<div class="email-link-modal-notice">
				동의하면 <b>본인 확인(재인증)</b> 후, 방금 입력한 비밀번호로 그 계정에 이메일 로그인이
				추가돼요. 앞으로 이메일+비밀번호로 로그인해도 항상 같은 계정으로 들어갑니다.
			</div>
			<div class="email-link-modal-actions">
				<button type="button" id="email-link-modal-cancel" class="email-link-modal-btn email-link-modal-btn--cancel">취소</button>
				<button type="button" id="email-link-modal-confirm" class="email-link-modal-btn email-link-modal-btn--confirm">재인증</button>
			</div>
		</div>
	</div>

	<style>
		/* 변경됨 (2026-09-28) — signup.html(휴대폰 인증)과 같은 디자인. 가로로 꽉 찬 박스에 텍스트만
		   욱여넣은 게 허전해 보인다는 피드백 — 내용 크기만큼만 차지하는 칩 형태로, 코드는 모노스페이스
		   + 자간을 줘서 실제 인증 코드처럼 보이게 했다. */
		.otp-mock-banner {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			max-width: 100%;
			background: var(--c-info-weak);
			border: 1px dashed var(--c-info-border);
			border-radius: var(--r-full);
			padding: 7px 16px 7px 12px;
			margin-bottom: 8px;
		}
		.otp-mock-banner__icon {
			width: 14px;
			height: 14px;
			flex-shrink: 0;
			color: var(--c-info-strong);
		}
		.otp-mock-banner__label {
			font-size: var(--fs-xs);
			font-weight: var(--fw-medium);
			color: var(--c-text-mut-strong);
			white-space: nowrap;
		}
		.otp-mock-banner__code {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: var(--fs-md);
			font-weight: var(--fw-black);
			letter-spacing: 2.5px;
			color: var(--c-info-strong);
		}
		.email-link-modal-box {
			max-width: 320px;
			width: 90%;
			padding: 24px 20px 16px;
			border-radius: var(--r-xl);
			background: var(--c-surface);
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			border: 1px solid var(--c-line);
			text-align: left;
		}
		.email-link-modal-text {
			font-size: var(--fs-md);
			line-height: 1.6;
			color: var(--c-text);
			margin: 0 0 12px 0;
			word-break: keep-all;
		}
		.email-link-modal-notice {
			background: var(--c-info-weak);
			border-radius: var(--r-md);
			padding: 10px 12px;
			font-size: var(--fs-xs);
			line-height: 1.5;
			color: var(--c-text);
			word-break: keep-all;
			margin-bottom: var(--s-3);
		}
		.email-link-modal-actions {
			display: flex;
			justify-content: flex-end;
			gap: 16px;
		}
		.email-link-modal-btn {
			background: none;
			border: none;
			padding: 6px 12px;
			font-size: var(--fs-md);
			font-weight: var(--fw-bold);
			cursor: pointer;
			border-radius: var(--r-md);
			color: #FF5A5A;
		}
		.email-link-modal-btn:hover {
			background: rgba(255, 90, 90, 0.08);
		}
	</style>

	<script th:inline="none">
		(function () {
			let form = document.getElementById('email-signup-form');
			let emailInput = document.getElementById('email');
			let emailLocalInput = document.getElementById('emailLocal');
			let emailDomainSelect = document.getElementById('emailDomainSelect');
			let emailDomainCustom = document.getElementById('emailDomainCustom');

			// 강노은: 이메일 도메인을 흔히 쓰는 목록에서 고르거나 "직접입력"으로 타이핑하게 분리.
			// 실제 제출/검증 로직(위 emailInput = #email)은 그대로 두고, 여기서 로컬파트+도메인을
			// 합쳐서 숨은 #email 값만 채워 넣는다 — fetch 쪽 코드를 안 건드려도 되게 하기 위함.
			function syncEmailHiddenField() {
				let local = emailLocalInput.value.trim();
				let domain = emailDomainSelect.value === '__custom__'
					? emailDomainCustom.value.trim()
					: emailDomainSelect.value;
				emailInput.value = local && domain ? (local + '@' + domain) : '';
			}
			function onDomainSelectChange() {
				let isCustom = emailDomainSelect.value === '__custom__';
				emailDomainCustom.style.display = isCustom ? 'block' : 'none';
				if (isCustom) emailDomainCustom.focus();
				syncEmailHiddenField();
			}
			emailLocalInput.addEventListener('input', syncEmailHiddenField);
			emailDomainSelect.addEventListener('change', onDomainSelectChange);
			emailDomainCustom.addEventListener('input', syncEmailHiddenField);

			// 에러로 리다이렉트됐을 때(th:value="${email}") 기존에 입력했던 이메일을 로컬파트/도메인으로
			// 다시 쪼개 채워 넣는다. 프리셋 목록에 없는 도메인이면 "직접입력"으로 전환.
			(function restorePrefilledEmail() {
				let prefilled = emailInput.value.trim();
				if (!prefilled || prefilled.indexOf('@') === -1) return;
				let parts = prefilled.split('@');
				let local = parts[0];
				let domain = parts.slice(1).join('@');
				emailLocalInput.value = local;
				let matched = false;
				for (let i = 0; i < emailDomainSelect.options.length; i++) {
					if (emailDomainSelect.options[i].value === domain) {
						emailDomainSelect.value = domain;
						matched = true;
						break;
					}
				}
				if (!matched) {
					emailDomainSelect.value = '__custom__';
					emailDomainCustom.value = domain;
					emailDomainCustom.style.display = 'block';
				}
			})();

			let passwordInput = document.getElementById('password');
			let passwordConfirmInput = document.getElementById('passwordConfirm');
			let btnSubmit = document.getElementById('btn-email-signup');
			let otpBlock = document.getElementById('email-signup-otp-block');
			let otpBanner = document.getElementById('email-signup-otp-banner');
			let otpBannerCode = document.getElementById('email-signup-otp-banner-code');
			let otpCodeInput = document.getElementById('signupOtpCode');
			let btnVerifyOtp = document.getElementById('btn-verify-signup-otp');
			let otpFeedback = document.getElementById('email-signup-otp-feedback');
			let otpStatus = document.getElementById('email-signup-otp-status');
			let otpRequested = false;
			let otpCountdownTimer = null;

			// signup.html(휴대폰 인증)과 같은 3분 카운트다운 — 서버가 이미 내려주는 expiresInSeconds를
			// 화면에서 그동안 그냥 버리고 있었다(백엔드 AuthController#emailSignupSendOtp 참고).
			function startOtpCountdown(seconds) {
				let remaining = seconds || 180;
				if (otpCountdownTimer) clearInterval(otpCountdownTimer);
				function tick() {
					if (otpStatus) {
						let m = Math.floor(remaining / 60);
						let s = String(remaining % 60).padStart(2, '0');
						otpStatus.textContent = '유효시간 ' + m + ':' + s;
					}
					remaining -= 1;
					if (remaining < 0) {
						clearInterval(otpCountdownTimer);
						otpCountdownTimer = null;
						if (otpStatus) otpStatus.textContent = '인증번호가 만료됐어요. 다시 받아주세요.';
					}
				}
				tick();
				otpCountdownTimer = setInterval(tick, 1000);
			}

			let linkModal = document.getElementById('email-link-modal');
			let linkModalProvider = document.getElementById('email-link-modal-provider');
			let linkModalCancel = document.getElementById('email-link-modal-cancel');
			let linkModalConfirm = document.getElementById('email-link-modal-confirm');

			function openEmailLinkModal(providerDisplay) {
				linkModalProvider.textContent = providerDisplay || '소셜';
				linkModal.style.display = 'flex';
			}
			linkModalCancel.addEventListener('click', function () {
				linkModal.style.display = 'none';
			});
			linkModal.addEventListener('click', function (e) {
				if (e.target === linkModal) linkModal.style.display = 'none';
			});
			linkModalConfirm.addEventListener('click', function () {
				// 전화번호 재인증(prepareLinkReauth)과 동일한 패턴 — 여기서는 아무것도 연동하지 않고,
				// 서버가 이미 세션에 stash해둔 이메일/비밀번호/대상 계정 정보를 들고 실제 소셜
				// 재로그인으로 브라우저를 보낸다. 로그인이 실제로 성공해서 대상 계정과 일치할 때만
				// OAuth2LoginSuccessHandler가 이메일 로그인을 추가한다.
				window.location.href = '/auth/emailSignup/prepare-link';
			});

			function showOtpFeedback(msg, isSuccess) {
				otpFeedback.textContent = msg;
				otpFeedback.style.color = isSuccess ? 'var(--c-success, #16a34a)' : 'var(--c-danger, #dc2626)';
				otpFeedback.style.display = 'block';
			}

			let ERROR_MESSAGES = {
				INVALID_EMAIL: '이메일 형식이 올바르지 않아요.',
				INVALID_PASSWORD: '비밀번호는 8자 이상이어야 해요.',
				PASSWORD_MISMATCH: '비밀번호가 서로 일치하지 않아요.',
				DUPLICATE: '이미 가입된 이메일이에요. 로그인해 주세요.'
			};

			form.addEventListener('submit', function (e) {
				e.preventDefault();

				btnSubmit.disabled = true;
				btnSubmit.textContent = otpRequested ? '다시 보내는 중...' : '전송 중...';

				fetch('/auth/emailSignup/send-otp', {
					method: 'POST',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: 'email=' + encodeURIComponent(emailInput.value.trim())
						+ '&password=' + encodeURIComponent(passwordInput.value)
						+ '&passwordConfirm=' + encodeURIComponent(passwordConfirmInput.value)
				})
					.then(function (res) { return res.json(); })
					.then(function (data) {
						btnSubmit.disabled = false;
						if (!data.ok) {
							btnSubmit.textContent = otpRequested ? '다시 받기' : '인증번호 받기';
							window.location.href = '/auth/emailSignup?error='
								+ (data.error === 'INVALID_EMAIL' ? 'email'
									: data.error === 'INVALID_PASSWORD' ? 'password'
									: data.error === 'PASSWORD_MISMATCH' ? 'mismatch'
									: 'duplicate')
								+ '&email=' + encodeURIComponent(emailInput.value.trim());
							return;
						}

						if (data.linked) {
							btnSubmit.textContent = '인증번호 받기';
							openEmailLinkModal(data.provider);
							return;
						}

						otpRequested = true;
						emailInput.disabled = true;
						emailLocalInput.disabled = true;
						emailDomainSelect.disabled = true;
						emailDomainCustom.disabled = true;
						passwordInput.disabled = true;
						passwordConfirmInput.disabled = true;
						btnSubmit.textContent = '인증번호 다시 받기';
						otpBlock.style.display = 'block';
						if (data.mailSent) {
							otpBanner.style.display = 'none';
						} else {
							// 발송 미설정(개발 환경 등) — 목업처럼 코드를 화면에 그대로 보여준다.
							// 변경됨 (2026-09-27) — 문구에서 "미설정" 사정을 밝히지 않고 signup.html의
							// 휴대폰 인증과 같은 톤("발급된 인증번호")으로 통일 — 시연 때 어색해 보이지 않게.
							otpBanner.style.display = 'inline-flex';
							otpBannerCode.textContent = data.mockCode;
						}
						otpCodeInput.value = '';
						otpCodeInput.disabled = false;
						otpCodeInput.focus();
						otpFeedback.style.display = 'none';
						startOtpCountdown(data.expiresInSeconds);
					})
					.catch(function () {
						btnSubmit.disabled = false;
						btnSubmit.textContent = otpRequested ? '다시 받기' : '인증번호 받기';
						showOtpFeedback('전송 중 오류가 발생했습니다. 다시 시도해 주세요.', false);
					});
			});

			btnVerifyOtp.addEventListener('click', function () {
				let code = otpCodeInput.value.trim();
				if (!code) {
					showOtpFeedback('인증번호를 입력해 주세요.', false);
					otpCodeInput.focus();
					return;
				}
				btnVerifyOtp.disabled = true;
				fetch('/auth/emailSignup/verify-otp', {
					method: 'POST',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: 'code=' + encodeURIComponent(code)
				})
					.then(function (res) { return res.json(); })
					.then(function (data) {
						btnVerifyOtp.disabled = false;
						if (data.verified) {
							if (otpCountdownTimer) { clearInterval(otpCountdownTimer); otpCountdownTimer = null; }
							if (otpStatus) otpStatus.textContent = '✓ 인증 완료';
							showOtpFeedback('✓ 인증 완료! 이동합니다...', true);
							window.location.href = data.redirectTo || '/auth/signup';
						} else if (data.reason === 'duplicate') {
							window.location.href = '/auth/emailSignup?error=duplicate&email=' + encodeURIComponent(emailInput.value.trim());
						} else {
							let reason = data.reason === 'expired' ? '인증번호가 만료됐어요. 다시 받아주세요.' : '인증번호가 일치하지 않아요.';
							showOtpFeedback(reason, false);
						}
					})
					.catch(function () {

						showOtpFeedback('확인 중 오류가 발생했습니다. 다시 시도해 주세요.', false);

		})();
