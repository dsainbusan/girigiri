<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('비밀번호 재설정', ~{:: #content}, '', false, '', null)}">
<body>
<!--/*
	비밀번호 재설정 화면
	담당: 문창호 (WBS 2.1 인증)
	- 1단계: 이메일 + 휴대폰이 일치하면(이메일 계정 한정) 본인 확인 통과 → 세션에 pwResetUserId(10분).
	- 2단계: 새 비밀번호 입력 → 저장 → 로그인 화면으로.
	- SMS 인증이 없어 "이메일+휴대폰을 아는 사람"이면 재설정 가능(보안상 약함). rate limit + 로깅으로 완화.
*/-->
<div id="content" th:fragment="content" class="page">

	<h1 style="font-size: var(--fs-xl)">비밀번호 재설정</h1>

	<!-- ===== 2단계: 새 비밀번호 입력 ===== -->
	<div th:if="${verified}">
		<p class="u-sub" style="font-size: var(--fs-sm); margin-top: var(--s-2)">본인 확인이 완료됐어요. 새 비밀번호를 입력해 주세요.</p>

		<form th:action="@{/auth/reset-password}" method="post" style="margin-top: var(--s-5)">
			<p class="u-danger" th:if="${mismatch}" style="margin-bottom: var(--s-3)">비밀번호가 서로 일치하지 않아요.</p>
			<p class="u-danger" th:if="${tooShort}" style="margin-bottom: var(--s-3)">비밀번호는 8자 이상이어야 해요.</p>

			<div class="field">
				<label class="field__label" for="newPassword">새 비밀번호</label>
				<input class="input" type="password" id="newPassword" name="newPassword" placeholder="8자 이상" minlength="8" required>
			</div>
			<div class="field" style="margin-top: var(--s-4)">
				<label class="field__label" for="newPasswordConfirm">새 비밀번호 확인</label>
				<input class="input" type="password" id="newPasswordConfirm" name="newPasswordConfirm" placeholder="한 번 더 입력" minlength="8" required>
			</div>
			<button type="submit" class="btn btn--block" style="margin-top: var(--s-5)">비밀번호 변경</button>
		</form>
	</div>

	<!-- ===== 1단계: 본인 확인 (이메일 + 휴대폰) ===== -->
	<div th:unless="${verified}">
		<p class="u-sub" style="font-size: var(--fs-sm); margin-top: var(--s-2)">
			가입한 이메일과 등록된 휴대폰 번호를 입력하면 비밀번호를 바로 새로 설정할 수 있어요.<br>
			(소셜 로그인 계정은 비밀번호가 없어요.)
		</p>

		<form th:action="@{/auth/reset-password/verify}" method="post" style="margin-top: var(--s-5)">
			<p class="u-danger" th:if="${param.expired}" style="margin-bottom: var(--s-3)">시간이 초과됐어요. 처음부터 다시 시도해 주세요.</p>
			<p class="u-danger" th:if="${rateLimited}" style="margin-bottom: var(--s-3)">시도 횟수가 많아요. 잠시 후 다시 시도해 주세요.</p>
			<p class="u-danger" th:if="${verifyError}" style="margin-bottom: var(--s-3)">이메일과 휴대폰 번호가 일치하는 계정이 없어요.</p>

			<div class="field">
				<label class="field__label" for="email">이메일</label>
				<input class="input" type="email" id="email" name="email" th:value="${email}" placeholder="example@email.com" required>
			</div>
			<div class="field" style="margin-top: var(--s-4)">
				<label class="field__label" for="phone">휴대폰 번호</label>
				<input class="input" type="tel" id="phone" name="phone" inputmode="numeric"
				       placeholder="010-1234-5678" maxlength="13" required>
			</div>
			<button type="submit" class="btn btn--block" style="margin-top: var(--s-5)">본인 확인</button>
		</form>

		<p class="u-center u-sub" style="font-size: var(--fs-sm); margin-top: var(--s-4)">
			이메일이 기억나지 않나요? <a th:href="@{/auth/find-email}" class="u-primary" style="font-weight: var(--fw-bold)">이메일 찾기</a>
		</p>

		<script th:inline="none">
			(function () {
				var p = document.getElementById('phone');
				if (!p) { return; }
				p.addEventListener('input', function () {
					var d = p.value.replace(/\D/g, '').slice(0, 11);
					p.value = d.length > 7 ? d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7)
						: d.length > 3 ? d.slice(0,3)+'-'+d.slice(3) : d;
				});
			})();
		</script>
	</div>

</div>
</body>
</html>
