<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('탈퇴 완료', ~{:: #content}, '', false, '', null)}">
<body>
<!--/*
	회원 탈퇴 완료 안내 화면
	담당: 문창호 (WBS 2.1 인증)
	- MypageController#withdraw가 계정 삭제 + 세션 무효화 후 여기로 리다이렉트한다.
	- 세션이 없는 상태로 들어오므로 WebSecurityConfig PUBLIC_URLS에 /auth/withdraw-complete 등록.
*/-->
<div id="content" th:fragment="content" class="page">

	<div class="u-center" style="margin: var(--s-8) 0 var(--s-6);">
		<div style="width: 76px; height: 76px; margin: 0 auto var(--s-4); border-radius: 50%; background: var(--c-bg); color: var(--c-text-mut); display: flex; align-items: center; justify-content: center; font-size: 38px;">
			👋
		</div>
		<h1>탈퇴가 완료됐어요</h1>
		<p class="u-bold" style="margin-top: var(--s-2); font-size: var(--fs-md);">
			그동안 기리기리를 이용해 주셔서 감사합니다.
		</p>
		<p class="u-sub" style="margin-top: var(--s-2); font-size: var(--fs-sm);">
			회원 정보는 삭제되었으며, 언제든 다시 가입하실 수 있어요.
		</p>
	</div>

	<div style="margin-top: var(--s-8);">
		<a th:href="@{/}" class="btn btn--block">홈으로</a>
	</div>

	<!--/* 탈퇴 후라 로그인 상태가 아님 — 뒤로가기는 이전(마이페이지/탈퇴 확인)이 아니라 홈으로 고정. */-->
	<script th:inline="none">
		(function () {
			var back = document.querySelector('.topbar__back[data-back]');
			if (!back) { return; }
			back.removeAttribute('data-back');
			back.addEventListener('click', function () { location.href = '/'; });
		})();
	</script>

</div>
</body>
</html>
