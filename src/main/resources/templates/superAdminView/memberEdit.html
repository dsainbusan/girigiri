<!DOCTYPE html>
<!--/*
  회원 정보 수정 (운영자용). /superadmin/members/{id}/edit 로 접속 — 목록의 "관리" 칸, 상세 화면
  헤더의 "수정" 버튼에서 진입. storeEdit.html과 같은 단순 폼 패턴(전체 필드를 운영자가 자유롭게 고침).
  닉네임/이메일/권한/활동 지역만 연다 — OAuth 연동 필드(oauthProvider/oauthId)·좌표는 관리자가 손댈
  이유가 없어 뺐고, 상태(이용중/이용정지)는 이미 목록·상세의 정지/정지해제 버튼으로 따로 처리 중이라
  여기서 안 건드린다.

  "상태를 뜻하는 버튼(배지)들 색깔만 다르고 통일해, 이모지 넣지 마" 피드백에 맞춰 한때 활동 지역 옆에
  "GPS" 버튼(카카오 지오코더 coord2Address 재사용, authView/signup.html·mypageView/edit.html과 같은
  기능)이 있었다. 그런데 여기서 GPS는 "운영자 기기"의 현재 위치라 회원 본인 위치와는 아예 무관했고,
  운영자 브라우저의 GPS/네트워크 상태에 따라 위치 확인 자체가 실패할 수도 있었다 — "슈퍼어드민은 GPS로
  바꾸지 말고 옵션(드롭다운)처럼 해주면 되지 않냐, 유저/매장 GPS가 잘 안 잡히면 어떡하냐"는 피드백으로
  GPS 버튼을 완전히 없애고 아래처럼 지역 select 드롭다운으로 바꿨다 — 이 화면(운영자용)에 한정된 변경
  이고, 회원 본인이 자기 위치로 채우는 signup.html/mypageView/edit.html의 GPS 버튼(실제 본인 기기
  위치라 의미가 있고, 실패해도 수동 입력으로 자연스럽게 폴백됨)은 그대로 둔다.

  select 옵션은 이 프로젝트에 지역 마스터 데이터가 따로 없어 시/도별 대표 구·시 목록을 템플릿에 직접
  나열했다(길어서 optgroup으로 묶음) — DB에 저장된 기존 자유입력 region 값(예: 오탈자가 섞인 값)이
  이 목록에 없을 수 있으므로, 하단 스크립트가 select에 없는 값이면 "(목록에 없음)" 라벨의 임시 옵션을
  맨 앞에 추가해 선택해 준다(값을 조용히 잃어버리지 않도록).

  "권한도 그냥 한국어로, 유저/매장 점주/어드민 이렇게" 피드백 — 권한 select 옵션 라벨을 "USER (일반
  회원)" 같은 영문+괄호 조합 대신 순수 한국어(유저/매장 점주/어드민)로 바꿨다. 같은 라벨링을
  members.html 목록, memberDetail.html 배지, storeDetail.html의 "연결된 계정" 표시에도 동일하게
  맞췄다(한 화면만 한글이고 나머지는 영문 그대로면 더 어색해서 전체 통일).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('회원 정보 수정', ~{:: #content}, 'members', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <a class="link-action mb-16" th:href="@{/superadmin/members/{id}(id=${member.id})}">&larr; 회원 상세로</a>

  <p class="form-error" th:if="${param.error}">필수 항목을 모두 올바르게 입력해 주세요.</p>

  <form th:action="@{/superadmin/members/{id}/edit(id=${member.id})}" method="post" class="form-narrow">
    <div class="field-group">
      <label class="field-group__label" for="nickname">닉네임 <span class="req">*</span></label>
      <input class="field" type="text" id="nickname" name="nickname" th:value="${member.nickname}" required maxlength="30">
    </div>

    <div class="field-group">
      <label class="field-group__label" for="email">이메일</label>
      <input class="field" type="email" id="email" name="email" th:value="${member.email}" maxlength="100">
    </div>

    <div class="field-group">
      <label class="field-group__label" for="role">권한 <span class="req">*</span></label>
      <select class="field select" id="role" name="role" required>
        <option value="USER" th:selected="${member.role == 'USER'}">유저</option>
        <option value="OWNER" th:selected="${member.role == 'OWNER'}">매장 점주</option>
        <option value="ADMIN" th:selected="${member.role == 'ADMIN'}">어드민</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-group__label" for="region">활동 지역</label>
      <select class="field select" id="region" name="region">
        <option value="">선택 안 함</option>
        <optgroup label="서울">
          <option value="서울 종로구">서울 종로구</option>
          <option value="서울 중구">서울 중구</option>
          <option value="서울 용산구">서울 용산구</option>
          <option value="서울 성동구">서울 성동구</option>
          <option value="서울 광진구">서울 광진구</option>
          <option value="서울 동대문구">서울 동대문구</option>
          <option value="서울 중랑구">서울 중랑구</option>
          <option value="서울 성북구">서울 성북구</option>
          <option value="서울 강북구">서울 강북구</option>
          <option value="서울 도봉구">서울 도봉구</option>
          <option value="서울 노원구">서울 노원구</option>
          <option value="서울 은평구">서울 은평구</option>
          <option value="서울 서대문구">서울 서대문구</option>
          <option value="서울 마포구">서울 마포구</option>
          <option value="서울 양천구">서울 양천구</option>
          <option value="서울 강서구">서울 강서구</option>
          <option value="서울 구로구">서울 구로구</option>
          <option value="서울 금천구">서울 금천구</option>
          <option value="서울 영등포구">서울 영등포구</option>
          <option value="서울 동작구">서울 동작구</option>
          <option value="서울 관악구">서울 관악구</option>
          <option value="서울 서초구">서울 서초구</option>
          <option value="서울 강남구">서울 강남구</option>
          <option value="서울 송파구">서울 송파구</option>
          <option value="서울 강동구">서울 강동구</option>
        </optgroup>
        <optgroup label="부산">
          <option value="부산 해운대구">부산 해운대구</option>
          <option value="부산 수영구">부산 수영구</option>
          <option value="부산 광안동">부산 광안동</option>
          <option value="부산 남구">부산 남구</option>
          <option value="부산 동래구">부산 동래구</option>
          <option value="부산 부산진구">부산 부산진구</option>
        </optgroup>
        <optgroup label="대구">
          <option value="대구 수성구">대구 수성구</option>
          <option value="대구 중구">대구 중구</option>
          <option value="대구 동구">대구 동구</option>
        </optgroup>
        <optgroup label="인천">
          <option value="인천 연수구">인천 연수구</option>
          <option value="인천 남동구">인천 남동구</option>
          <option value="인천 부평구">인천 부평구</option>
        </optgroup>
        <optgroup label="광주">
          <option value="광주 서구">광주 서구</option>
          <option value="광주 북구">광주 북구</option>
        </optgroup>
        <optgroup label="대전">
          <option value="대전 유성구">대전 유성구</option>
          <option value="대전 서구">대전 서구</option>
        </optgroup>
        <optgroup label="울산">
          <option value="울산 남구">울산 남구</option>
          <option value="울산 중구">울산 중구</option>
        </optgroup>
        <optgroup label="세종">
          <option value="세종">세종</option>
        </optgroup>
        <optgroup label="경기">
          <option value="경기 수원시">경기 수원시</option>
          <option value="경기 성남시">경기 성남시</option>
          <option value="경기 고양시">경기 고양시</option>
          <option value="경기 용인시">경기 용인시</option>
          <option value="경기 부천시">경기 부천시</option>
        </optgroup>
        <optgroup label="강원">
          <option value="강원 춘천시">강원 춘천시</option>
          <option value="강원 원주시">강원 원주시</option>
          <option value="강원 강릉시">강원 강릉시</option>
        </optgroup>
        <optgroup label="충북">
          <option value="충북 청주시">충북 청주시</option>
        </optgroup>
        <optgroup label="충남">
          <option value="충남 천안시">충남 천안시</option>
        </optgroup>
        <optgroup label="전북">
          <option value="전북 전주시">전북 전주시</option>
        </optgroup>
        <optgroup label="전남">
          <option value="전남 여수시">전남 여수시</option>
          <option value="전남 순천시">전남 순천시</option>
        </optgroup>
        <optgroup label="경북">
          <option value="경북 포항시">경북 포항시</option>
        </optgroup>
        <optgroup label="경남">
          <option value="경남 창원시">경남 창원시</option>
          <option value="경남 김해시">경남 김해시</option>
        </optgroup>
        <optgroup label="제주">
          <option value="제주 제주시">제주 제주시</option>
          <option value="제주 서귀포시">제주 서귀포시</option>
        </optgroup>
      </select>
    </div>

    <button type="submit" class="btn btn--primary btn--block mt-24">저장</button>
  </form>

  <script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
      var currentRegion = /*[[${member.region}]]*/ '';
      if (!currentRegion) return;
      var select = document.getElementById('region');
      var matched = false;
      for (var i = 0; i < select.options.length; i++) {
        if (select.options[i].value === currentRegion) { matched = true; break; }
      }
      if (!matched) {
        var opt = document.createElement('option');
        opt.value = currentRegion;
        opt.textContent = currentRegion + ' (목록에 없음)';
        select.insertBefore(opt, select.firstChild);
      }
      select.value = currentRegion;
    })();
    /*]]>*/
  </script>

</div>
</body>
</html>
