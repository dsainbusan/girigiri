<!DOCTYPE html>
<!--/*
  공지사항 관리. /superadmin/notices 로 접속. NoticeRepository로 실데이터 연동됨.
  행 클릭 → /superadmin/notices/{id} 상세, "+ 새 공지 작성" → /superadmin/notices/new 등록 폼.
  글이 많아질 수 있어 페이지네이션 적용(SuperAdminController#notices가 page 쿼리파라미터로 10건씩 자름).

  "게시 기간을 정하고 싶다"는 요청으로 게시 상태가 게시중/비공개 2가지에서 4가지(게시중/게시예정/
  게시종료/비공개, NoticeEntity#getDisplayStatus)로 늘었다 — 목록 배지도 4가지 다 구분해서 보여준다.

  변경됨 — 왜: "회원 관리/매장 관리처럼 표로 만들면 좋겠다"는 요청 — 카드형 .info-row 목록을
  members.html과 같은 .data-table(+colgroup 고정 폭 + row-clickable 행 전체 클릭)로 바꿨다.
  컬럼: 제목/게시 기간/상태/등록일.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('공지사항', ~{:: #content}, 'notices', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <div class="toolbar">
    <p class="result-count result-count--inline">전체 공지 <b th:text="${#lists.size(notices)}">0</b>건</p>
    <div class="toolbar__spacer"></div>
    <a class="btn btn--primary btn--sm" th:href="@{/superadmin/notices/new}"><svg class="icon"><use href="#i-pencil"/></svg>새 공지 작성</a>
  </div>

  <div class="table-wrap">
    <table class="data-table">
      <colgroup>
        <col style="width:40%"><col style="width:25%"><col style="width:15%"><col style="width:20%">
      </colgroup>
      <thead>
        <tr><th>제목</th><th>게시 기간</th><th>상태</th><th>등록일</th></tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(notices)}">
          <td colspan="4" class="table-empty">등록된 공지사항이 없습니다.</td>
        </tr>
        <tr class="row-clickable" th:each="notice : ${notices}" th:attr="data-href=@{/superadmin/notices/{id}(id=${notice.id})}">
          <td class="cell-name"><a th:href="@{/superadmin/notices/{id}(id=${notice.id})}" th:text="${notice.title}">공지 제목</a></td>
          <td>
            <span th:text="${notice.publishStartAt != null} ? ${#temporals.format(notice.publishStartAt, 'yyyy-MM-dd')} : '즉시'"></span>
            <span> ~ </span>
            <span th:text="${notice.publishEndAt != null} ? ${#temporals.format(notice.publishEndAt, 'yyyy-MM-dd')} : '무제한'"></span>
          </td>
          <td>
            <span class="badge badge--success" th:if="${notice.displayStatus == 'PUBLISHED'}">게시중</span>
            <span class="badge badge--neutral" th:if="${notice.displayStatus == 'SCHEDULED'}">게시예정</span>
            <span class="badge badge--neutral" th:if="${notice.displayStatus == 'EXPIRED'}">게시종료</span>
            <span class="badge badge--danger" th:if="${notice.displayStatus == 'HIDDEN'}">비공개</span>
          </td>
          <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2026-08-18</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:classappend="${page <= 0} ? ' is-disabled'" th:href="@{/superadmin/notices(page=${page - 1})}">&lsaquo;</a>
    <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${p == page} ? ' is-active'"
       th:text="${p + 1}" th:href="@{/superadmin/notices(page=${p})}"></a>
    <a th:classappend="${page >= totalPages - 1} ? ' is-disabled'" th:href="@{/superadmin/notices(page=${page + 1})}">&rsaquo;</a>
  </div>

  <script th:inline="none">
    document.querySelectorAll('tr.row-clickable').forEach(function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('a, button, input, form')) return;
        window.location.href = row.dataset.href;
      });
    });
  </script>

</div>
</body>
</html>
