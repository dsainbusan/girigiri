<!DOCTYPE html>
<!--/*
  공지사항 상세. /superadmin/notices/{id} 로 접속 — /superadmin/notices 목록에서 클릭 시 진입.
  수정 → /superadmin/notices/{id}/edit, 삭제는 이 화면에서 바로 POST 처리(확인창 없음 — 승인 버튼과 동일 관례).

  "게시 기간"·"게시글 내리기" 추가 — 게시 기간(publishStartAt~publishEndAt, 둘 다 없으면 "즉시·무제한")을
  등록일 아래 보여주고, 상태 배지는 4가지(게시중/게시예정/게시종료/비공개, NoticeEntity#getDisplayStatus).
  "내리기"/"다시 게시" 버튼은 수정 화면까지 안 들어가고 바로 published를 토글한다(members.html의
  정지/정지해제 버튼과 같은 패턴) — 기간이 지나 자동으로 "게시종료"가 된 글도 이 버튼으로 published
  자체를 내려서 "비공개"로 완전히 감출 수 있다.

  layoutAdmin의 title도 ${notice.title} 대신 고정 문자열 '공지사항'으로 — memberDetail.html/
  storeDetail.html과 같은 이유("상단 큰 제목이 레코드 이름으로 바뀌지 않고 섹션명으로 유지돼야 한다"는
  피드백을 동일 패턴인 여기도 같이 적용). 글 제목은 바로 아래 detail-header의 <h2>에 이미 나온다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('공지사항', ~{:: #content}, 'notices', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <a class="link-action mb-16" th:href="@{/superadmin/notices}">&larr; 공지사항 목록</a>

  <div class="detail-header detail-header--tight">
    <h2 class="detail-header__title" th:text="${notice.title}">공지 제목</h2>
    <span class="badge badge--success" th:if="${notice.displayStatus == 'PUBLISHED'}">게시중</span>
    <span class="badge badge--neutral" th:if="${notice.displayStatus == 'SCHEDULED'}">게시예정</span>
    <span class="badge badge--neutral" th:if="${notice.displayStatus == 'EXPIRED'}">게시종료</span>
    <span class="badge badge--danger" th:if="${notice.displayStatus == 'HIDDEN'}">비공개</span>
    <a class="btn btn--outline-neutral btn--sm ml-auto"
       th:href="@{/superadmin/notices/{id}/edit(id=${notice.id})}"><svg class="icon"><use href="#i-pencil"/></svg>수정</a>
    <form th:if="${notice.published}" th:action="@{/superadmin/notices/{id}/unpublish(id=${notice.id})}" method="post">
      <button class="btn btn--outline-danger btn--sm" type="submit">내리기</button>
    </form>
    <form th:unless="${notice.published}" th:action="@{/superadmin/notices/{id}/publish(id=${notice.id})}" method="post">
      <button class="btn btn--outline btn--sm" type="submit">다시 게시</button>
    </form>
    <form th:action="@{/superadmin/notices/{id}/delete(id=${notice.id})}" method="post">
      <button class="btn btn--outline btn--sm" type="submit"><svg class="icon"><use href="#i-trash"/></svg>삭제</button>
    </form>
  </div>
  <p class="meta-text mb-16">
    <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')} + ' 등록'">2026-08-18 등록</span>
    <span> · 게시 기간: </span>
    <span th:text="${notice.publishStartAt != null} ? ${#temporals.format(notice.publishStartAt, 'yyyy-MM-dd')} : '즉시'"></span>
    <span> ~ </span>
    <span th:text="${notice.publishEndAt != null} ? ${#temporals.format(notice.publishEndAt, 'yyyy-MM-dd')} : '무제한'"></span>
  </p>

  <div class="info-list">
    <div class="info-row info-row--pre" th:text="${notice.content}">공지 내용</div>
  </div>

</div>
</body>
</html>
