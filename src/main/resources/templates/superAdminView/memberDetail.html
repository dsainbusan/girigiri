<!DOCTYPE html>
<!--/*
  회원 상세. /superadmin/members/{id} 로 접속 — /superadmin/members 목록에서 행 클릭 시 진입.
  SuperAdminController#memberDetail 이 담아주는 ${member}(UserEntity 전체)를 그린다. role=OWNER면
  StoreRepository#findByOwnerId로 찾은 ${ownedStore}가 있을 때만 "연결된 매장" 카드를 추가로 보여준다.

  상태 배지 문구는 목록 화면(members.html)과 통일: 정상→이용중, 정지됨→이용정지("정상"만 보고 헷갈린다는
  피드백으로 어휘 맞춤).

  정지/정지 해제/강제 탈퇴 버튼도 목록 화면과 똑같이 여기(상세)에도 둔다 — "회원 하나 상세를 보다가 바로
  거기서 정지·탈퇴시키고 싶다"는 요청. 목록의 액션 버튼(같은 컨트롤러 엔드포인트: /suspend, /unsuspend,
  /withdraw)을 그대로 재사용하고, 강제 탈퇴는 목록과 동일하게 이미 정지된 회원만 가능(정지 상태를 한 단계
  거치게 하는 기존 규칙 유지). 세 액션 모두 처리 후 이 회원의 상세 페이지가 아니라 전체 회원 목록
  (/superadmin/members)으로 돌아간다 — 탈퇴시키면 이 회원의 상세 페이지 자체가 더는 존재하지 않기
  때문에 특히 중요하고(컨트롤러가 이미 그렇게 리다이렉트하고 있어 새로 만든 코드는 없음), 정지/정지해제도
  같은 곳으로 보내 일관되게 했다.

  "수정" 버튼(→ /superadmin/members/{id}/edit, memberEdit.html)도 추가 — storeDetail.html의
  "정보 수정" 버튼과 같은 자리(헤더 오른쪽 끝)·같은 아이콘(i-pencil) 패턴. 색은 다른 .btn--outline
  (파랑, 이용재개 등과 헷갈린다는 피드백)과 구분되게 회색 톤 .btn--outline-neutral로 뺐다.

  "← 회원 목록"은 한때 history.back()이었는데("일반 회원 탭에서 들어왔는데 뒤로가기 누르면 전체 탭으로
  간다"는 피드백으로 넣었던 것) — "매장 상세로/회원 상세로처럼 이것도 '이전'이 아니라 라벨 그대로
  회원 목록으로 가야 한다"는 요청으로 되돌렸다. 그런데 그냥 고정 링크만 두면 필터 탭(정지 회원 등)을
  잊어버려서, "탭으로도 정확히 돌아가게 해달라"는 요청으로 q/filter/page를 왕복시킨다 — members.html
  에서 상세로 넘어올 때 그 값들을 URL에 실어 보내고(SuperAdminController#memberDetail이 받아 모델에
  얹음), 여기서 그대로 다시 실어 "← 회원 목록" 링크를 만든다(history.back() 없이, 항상 예측 가능한
  URL로 왕복).

  "문의·신고 내역"(${memberActivity}, MemberActivityRowDto 리스트) 추가 — "신고자/문의자 상세에 이전에
  문의한 거 정리된 리스트도 보여달라"는 요청. 이 회원이 작성한 문의(inquiry)와 신고자인 신고(complaint)
  를 합쳐 최신순으로 보여주고, 각 행은 해당 상세(inquiryDetail/complaintDetail)로 링크된다.

  "수정 페이지랑 비슷한 사이즈로 센터 정렬" 요청 — memberEdit.html과 같은 .form-narrow(520px, margin
  auto)로 본문을 감쌌다. 뒤로가기 링크만 기존 폼 페이지들과 동일하게 밖에 남겨 왼쪽 정렬 유지.

  layoutAdmin의 title 인자를 ${member.nickname}으로 넘겼더니 상단 큰 제목(<h1 class="page-title">)과
  브라우저 탭 제목이 "회원 관리" 대신 그 회원 이름으로 바뀌어서 "왜 바뀌냐, 회원 관리로 유지해라"는
  피드백 — 다른 목록 화면들처럼 고정 문자열 '회원 관리'로 되돌렸다(레코드 이름은 바로 아래
  detail-header의 <h2>에 이미 나오므로 중복도 아님). storeDetail.html/noticeDetail.html도 같은
  패턴(${store.storeName}/${notice.title})이라 동일한 이유로 같이 고쳤다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('회원 관리', ~{:: #content}, 'members', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <a class="link-action mb-16" th:href="@{/superadmin/members(q=${q}, filter=${filter}, page=${page})}">&larr; 회원 목록</a>

  <div class="form-narrow">
  <div class="detail-header">
    <h2 class="detail-header__title" th:text="${member.nickname}">닉네임</h2>
    <span class="badge badge--neutral" th:text="${member.role == 'USER'} ? '유저' : (${member.role == 'OWNER'} ? '매장 점주' : '어드민')">유저</span>
    <span class="badge" th:classappend="${member.status == 'SUSPENDED'} ? 'badge--danger' : 'badge--success'"
          th:text="${member.status == 'SUSPENDED'} ? '이용정지' : '이용중'">이용중</span>

    <a class="btn btn--outline-neutral btn--sm ml-auto" th:href="@{/superadmin/members/{id}/edit(id=${member.id})}"><svg class="icon"><use href="#i-pencil"/></svg>수정</a>
    <th:block th:if="${member.status == 'SUSPENDED'}">
      <form th:action="@{/superadmin/members/{id}/unsuspend(id=${member.id})}" method="post">
        <button class="btn btn--outline btn--sm" type="submit">이용 재개</button>
      </form>
      <form th:action="@{/superadmin/members/{id}/withdraw(id=${member.id})}" method="post">
        <button class="btn btn--outline-danger btn--sm" type="submit">강제 탈퇴</button>
      </form>
    </th:block>
    <form th:unless="${member.status == 'SUSPENDED'}" th:action="@{/superadmin/members/{id}/suspend(id=${member.id})}" method="post">
      <button class="btn btn--outline-danger btn--sm" type="submit">이용 정지</button>
    </form>
  </div>

  <h3 class="subhead">기본 정보</h3>
  <div class="info-list">
    <div class="info-row">
      <div class="info-row__body">
        <div class="info-row__label">이메일</div>
        <div class="info-row__value" th:text="${member.email} ?: '등록된 이메일 없음'">example@example.com</div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-row__body">
        <div class="info-row__label">활동 지역</div>
        <div class="info-row__value" th:text="${member.region} ?: '미입력'">서울 중구</div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-row__body">
        <div class="info-row__label">가입 경로</div>
        <div class="info-row__value" th:text="${member.oauthProvider}">kakao</div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-row__body">
        <div class="info-row__label">가입일</div>
        <div class="info-row__value" th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-01 12:00</div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-row__body">
        <div class="info-row__label">최근 정보 수정일</div>
        <div class="info-row__value" th:text="${member.updatedAt != null} ? ${#temporals.format(member.updatedAt, 'yyyy-MM-dd HH:mm')} : '-'">-</div>
      </div>
    </div>
  </div>

  <th:block th:if="${ownedStore != null}">
    <h3 class="subhead mt-24">연결된 매장</h3>
    <div class="info-list">
      <a class="info-row" th:href="@{/superadmin/stores/{id}(id=${ownedStore.id})}">
        <div class="info-row__body">
          <div class="info-row__title" th:text="${ownedStore.storeName}">매장명</div>
          <div class="info-row__sub" th:text="${ownedStore.category} + ' · ' + ${ownedStore.address}">카테고리 · 주소</div>
        </div>
        <span class="info-row__arrow">&rsaquo;</span>
      </a>
    </div>
  </th:block>

  <h3 class="subhead mt-24">문의 · 신고 내역 <span class="text-muted text-muted--sm">(<span th:text="${memberActivity.size()}">0</span>건)</span></h3>
  <div class="info-list">
    <a class="info-row" th:each="a : ${memberActivity}" th:href="@{${a.linkUrl}}">
      <div class="info-row__body">
        <div class="info-row__title" th:text="${a.title}">제목</div>
        <div class="info-row__sub" th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd')}">2026-08-01</div>
      </div>
      <span class="badge" th:classappend="${a.label == '신고'} ? 'badge--danger' : 'badge--neutral'" th:text="${a.label}">문의</span>
      <span class="info-row__arrow">&rsaquo;</span>
    </a>
    <p class="text-muted" th:if="${#lists.isEmpty(memberActivity)}" style="padding:16px">문의·신고 내역이 없습니다.</p>
  </div>
  </div>

</div>
</body>
</html>
