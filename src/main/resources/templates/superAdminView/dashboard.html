<!DOCTYPE html>
<!--/*
  슈퍼어드민 통계 대시보드. /superadmin/dashboard 로 접속.
  TODO(송보미): "오늘 플랫폼 지표" 카드는 데모 데이터 → Repository 연동(회원수/거래량/구제량/매출
  실집계)으로 교체.
  "최근 처리 대기"는 개별 예시 1건씩 보여주던 걸 "N건 대기 중" 요약으로 바꿨다 — 입점 신청/1:1 문의/
  신고 접수 전부 SuperAdminController#dashboard가 계산한 실제 대기 건수(pendingStoreCount는 기존
  advice 재사용, pendingInquiryCount는 reports()와 동일한 계산 로직, pendingComplaintCount는
  ComplaintEntity 도입 후 새로 추가 — 이제 셋 다 실데이터라 "데모" 표시를 뗐다).

  대시보드에 달력·그래프도 넣어달라는 요청으로 두 위젯을 추가했다 — 그래프는 storeView/dashboard.html의
  판매/폐기 막대그래프와 같은 순수 CSS 방식(막대 높이 %를 컨트롤러가 미리 계산), 달력은 이번 달 42칸
  고정 격자에 가입자가 있는 날만 점으로 표시한다. 매출·거래량 등은 아직 위 TODO대로 데모라 히스토리가
  없어서, 확실히 실데이터인 "신규 가입" 하나로 두 위젯을 채웠다(허수 그래프를 만들지 않으려는 판단).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('통계 대시보드', ~{:: #content}, 'dashboard', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <h2 class="subhead">오늘 플랫폼 지표</h2>
  <div class="stat-grid">
    <div class="stat-card">
      <span class="stat-card__label">전체 회원수</span>
      <span class="stat-card__value">12,480</span>
      <span class="stat-card__delta stat-card__delta--up">+124 오늘</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">거래량</span>
      <span class="stat-card__value">3,210건</span>
      <span class="stat-card__delta stat-card__delta--up">+8.2%</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">구제량</span>
      <span class="stat-card__value">1,987개</span>
      <span class="stat-card__delta">CO2 412kg 절감</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">매출</span>
      <span class="stat-card__value">₩8,420,000</span>
      <span class="stat-card__delta stat-card__delta--down">-2.1%</span>
    </div>
  </div>

  <h2 class="subhead">최근 처리 대기</h2>

  <div class="info-list mb-16">
    <a class="info-row" th:href="@{/superadmin/stores}">
      <div class="info-row__body">
        <div class="info-row__title">입점 신청</div>
        <div class="info-row__sub" th:text="${pendingStoreCount} + '건 대기 중'">0건 대기 중</div>
      </div>
      <span class="badge" th:classappend="${pendingStoreCount > 0} ? 'badge--neutral' : 'badge--success'"
            th:text="${pendingStoreCount} + '건'">0건</span>
      <span class="info-row__arrow">&rsaquo;</span>
    </a>
  </div>

  <div class="info-list mb-16">
    <a class="info-row" th:href="@{/superadmin/reports}">
      <div class="info-row__body">
        <div class="info-row__title">1:1 문의</div>
        <div class="info-row__sub" th:text="${pendingInquiryCount} + '건 대기 중'">0건 대기 중</div>
      </div>
      <span class="badge" th:classappend="${pendingInquiryCount > 0} ? 'badge--neutral' : 'badge--success'"
            th:text="${pendingInquiryCount} + '건'">0건</span>
      <span class="info-row__arrow">&rsaquo;</span>
    </a>
  </div>

  <div class="info-list">
    <a class="info-row" th:href="@{/superadmin/reports}">
      <div class="info-row__body">
        <div class="info-row__title">신고 접수</div>
        <div class="info-row__sub" th:text="${pendingComplaintCount} + '건 대기 중'">0건 대기 중</div>
      </div>
      <span class="badge" th:classappend="${pendingComplaintCount > 0} ? 'badge--neutral' : 'badge--success'"
            th:text="${pendingComplaintCount} + '건'">0건</span>
      <span class="info-row__arrow">&rsaquo;</span>
    </a>
  </div>

  <h2 class="subhead mt-24">최근 7일 신규 가입</h2>
  <div class="admin-bar-chart">
    <div class="admin-bar-chart__col" th:each="d : ${weeklySignupBars}">
      <div class="admin-bar-chart__value" th:text="${d.count > 0} ? ${d.count} : ''">0</div>
      <div class="admin-bar-chart__track">
        <div class="admin-bar-chart__bar" th:style="'height:' + ${d.heightPercent} + '%'"></div>
      </div>
      <div class="admin-bar-chart__label" th:classappend="${d.isToday} ? ' is-today'" th:text="${d.dateLabel}">8/25</div>
    </div>
  </div>

  <h2 class="subhead mt-24" th:text="${calendarMonthLabel} + ' 가입 현황'">가입 현황</h2>
  <div class="admin-calendar">
    <div class="admin-calendar__grid">
      <span class="admin-calendar__dow">월</span>
      <span class="admin-calendar__dow">화</span>
      <span class="admin-calendar__dow">수</span>
      <span class="admin-calendar__dow">목</span>
      <span class="admin-calendar__dow">금</span>
      <span class="admin-calendar__dow">토</span>
      <span class="admin-calendar__dow">일</span>
      <span class="admin-calendar__day" th:each="d : ${calendarDays}"
            th:classappend="(${!d.inCurrentMonth} ? ' is-outside' : '') + (${d.isToday} ? ' is-today' : '')">
        <span th:text="${d.dayOfMonth}">1</span>
        <span class="dot" th:if="${d.signupCount > 0}"></span>
      </span>
    </div>
  </div>

</div>
</body>
</html>
