<!DOCTYPE html>
<!--/*
  새 공지 작성. /superadmin/notices/new 로 접속. 저장하면 published=true(즉시 게시)로 등록된다.
  게시 시작일/종료일(둘 다 선택, 비우면 즉시·무제한)을 지정할 수 있다 — "게시 기간을 정하고 싶다"는
  요청. 종료일이 시작일보다 빠르면 컨트롤러가 저장을 막는다(?error=period).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('새 공지 작성', ~{:: #content}, 'notices', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <a class="link-action mb-16" th:href="@{/superadmin/notices}">&larr; 공지사항 목록</a>

  <p class="form-error" th:if="${param.error == 'period'}">종료일은 시작일보다 빠를 수 없어요.</p>
  <p class="form-error" th:if="${param.error != null and param.error != 'period'}">제목과 내용을 모두 입력해 주세요.</p>

  <form th:action="@{/superadmin/notices/new}" method="post" class="form-narrow">
    <div class="field-group">
      <label class="field-group__label" for="title">제목 <span class="req">*</span></label>
      <input class="field" type="text" id="title" name="title" required maxlength="100" placeholder="공지 제목을 입력해 주세요">
    </div>

    <div class="field-group">
      <label class="field-group__label" for="content">내용 <span class="req">*</span></label>
      <textarea class="field" id="content" name="content" required maxlength="2000"
                placeholder="공지 내용을 입력해 주세요"></textarea>
    </div>

    <div class="field-group">
      <label class="field-group__label">게시 기간 <span class="text-muted text-muted--sm">(선택, 비우면 즉시·무제한)</span></label>
      <div class="flex-row">
        <input class="field" type="date" name="publishStartAt" style="flex:1">
        <span class="text-muted">~</span>
        <input class="field" type="date" name="publishEndAt" style="flex:1">
      </div>
    </div>

    <button type="submit" class="btn btn--primary btn--block mt-24">등록</button>
  </form>

</div>
</body>
</html>
