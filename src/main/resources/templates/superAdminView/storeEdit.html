<!DOCTYPE html>
<!--/*
  매장 정보 수정 (운영자용, 전체 필드). /superadmin/stores/{id}/edit 로 접속.
  storeView/edit.html(점주 본인용)은 상호명/사업자번호/주소를 승인 심사 근거라는 이유로 읽기전용으로
  막아두지만, 운영자는 그 제한 없이 전부 고칠 수 있어야 해서(오탈자·정보 오류 정정 포함) 별도 화면으로
  만든다. approvalStatus는 여기서 안 건드린다 — "입점 승인 대기" 액션이 생기면 그쪽에서 처리할 것.
  위치(latitude/longitude)는 storeView/edit.html과 동일하게 카카오맵 Geocoder로 주소→좌표 변환한다.

  주의: 아래 폼 필드들의 id(storeName/businessNumber/category/address/geocodeBtn/geocodeStatus/
  locationPreviewMap/latitude/longitude/phone/operatingHours)는 하단 <script>의 카카오 지오코더가
  document.getElementById로 직접 찾는 값이라 디자인 개편 중에도 그대로 유지했다 — id를 바꾸면 지도
  미리보기가 조용히 깨진다.

  "주소 검색" 버튼(다음 우편번호 서비스, api 키 불필요·무료) 추가 — 주소를 직접 타이핑하지 않고
  실제 주소 DB에서 골라 넣게 해달라는 요청. 검색해서 고르면 주소를 채우고, 그 자리에서 바로 기존
  카카오 지오코더 버튼(geocodeBtn)을 프로그램적으로 클릭시켜 좌표까지 한 번에 확인한다(주소 검색 →
  좌표 확인을 매번 두 번 누르지 않게).
  new daum.Postcode({...}).open()(팝업 창)은 브라우저 팝업 차단에 걸리는 걸 확인해서, 대신 .embed()로
  페이지 안 오버레이 레이어(#postcodeOverlay)에 그려 넣는 방식을 쓴다 — 팝업 차단과 무관하게 항상 뜬다.
  주소 검색 스크립트는 카카오맵 kakao.maps.load(...) 콜백 밖에 독립적으로 둔다 — 안에 두면 카카오
  SDK가 실패/지연될 때(외부망 이슈로 실제로 한 번 겪음) 무관한 주소 검색 기능까지 같이 죽는다.

  "상태를 뜻하는 버튼(배지)들 색깔만 다르고 통일해, 이모지 넣지 마" 피드백 — 버튼 라벨의 🔍/📍/✕
  이모지를 다 뺐다. geocodeStatus도 ✅/⚠️가 붙은 긴 문장 하나로 때우던 걸, 다른 배지들과 똑같은 짧은
  라벨(badge/badge--success/badge--danger/badge--neutral)로 바꾸고, 확인된 주소 같은 부가 설명은
  별도 줄(#geocodeDetail, 이모지 없는 평문)로 뺐다 — setGeoStatus() 함수가 배지 텍스트/색을 같이
  세팅한다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout-admin :: layoutAdmin('매장 정보 수정', ~{:: #content}, 'stores', '슈퍼어드민')}">
<body>
<div id="content" th:fragment="content">

  <a class="link-action mb-16" th:href="@{/superadmin/stores/{id}(id=${store.id})}">&larr; 매장 상세로</a>

  <p class="form-error" th:if="${param.error}">필수 항목을 모두 올바르게 입력해 주세요.</p>

  <form th:action="@{/superadmin/stores/{id}/edit(id=${store.id})}" method="post" id="storeEditForm" class="form-narrow">
    <div class="field-group">
      <label class="field-group__label" for="storeName">상호명 (매장명) <span class="req">*</span></label>
      <input class="field" type="text" id="storeName" name="storeName" th:value="${store.storeName}" required maxlength="50">
    </div>

    <div class="field-group">
      <label class="field-group__label" for="businessNumber">사업자 등록번호</label>
      <input class="field" type="text" id="businessNumber" name="businessNumber" th:value="${store.businessNumber}" maxlength="30">
    </div>

    <div class="field-group">
      <label class="field-group__label" for="category">매장 업종 (카테고리) <span class="req">*</span></label>
      <select class="field select" id="category" name="category" required>
        <option value="">카테고리를 선택해 주세요</option>
        <option value="베이커리" th:selected="${store.category == '베이커리'}">베이커리</option>
        <option value="카페/디저트" th:selected="${store.category == '카페/디저트'}">카페 / 디저트</option>
        <option value="반찬" th:selected="${store.category == '반찬'}">반찬</option>
        <option value="도시락/샐러드" th:selected="${store.category == '도시락/샐러드'}">도시락 / 샐러드</option>
        <option value="마트/식료품" th:selected="${store.category == '마트/식료품'}">마트 / 식료품</option>
        <option value="일반음식점" th:selected="${store.category == '일반음식점'}">일반음식점</option>
        <option value="기타" th:selected="${store.category == '기타'}">기타</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-group__label" for="address">매장 주소 <span class="req">*</span></label>
      <div class="flex-row">
        <input class="field" type="text" id="address" name="address" th:value="${store.address}" required maxlength="200" style="flex:1"
               placeholder="주소 검색으로 채우거나 직접 입력">
        <button type="button" id="addressSearchBtn" class="btn btn--outline-neutral btn--sm" style="flex:none">주소 검색</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-group__label">지도 위치 확인</label>
      <p class="form-hint mb-8">
        주소를 바꿨다면, 저장 전에 좌표도 새로 확인해 주세요.
      </p>
      <button type="button" id="geocodeBtn" class="btn btn--outline btn--sm">주소로 위치 확인</button>
      <span id="geocodeStatus" class="badge" th:classappend="${store.latitude != null} ? ' badge--success' : ' badge--neutral'"
            th:text="${store.latitude != null} ? '위치 확인됨' : '위치 미확인'" style="margin-top:8px"></span>
      <p id="geocodeDetail" class="form-hint mt-6">아래 지도 핀 위치가 맞는지 확인해 주세요.</p>
      <div id="locationPreviewMap"
           th:styleappend="${store.latitude != null} ? 'display:block' : 'display:none'"></div>
    </div>
    <input type="hidden" id="latitude" name="latitude" th:value="${store.latitude}">
    <input type="hidden" id="longitude" name="longitude" th:value="${store.longitude}">

    <div class="field-group">
      <label class="field-group__label" for="phone">매장 대표 전화번호 <span class="req">*</span></label>
      <input class="field" type="tel" id="phone" name="phone" th:value="${store.phone}"
             placeholder="예: 051-123-4567 또는 010-1234-5678" required maxlength="30">
    </div>

    <div class="field-group">
      <label class="field-group__label" for="operatingHours">영업시간 및 마감세일 예상 시간</label>
      <input class="field" type="text" id="operatingHours" name="operatingHours" th:value="${store.operatingHours}"
             placeholder="예: 09:00 ~ 21:00 (마감 세일 19:00~)" maxlength="100">
    </div>

    <button type="submit" class="btn btn--primary btn--block mt-24">저장</button>
  </form>

  <div id="postcodeOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center">
    <div style="background:var(--white);border-radius:8px;overflow:hidden;width:90%;max-width:420px">
      <div style="display:flex;justify-content:flex-end;padding:4px 4px 0">
        <button type="button" id="postcodeCloseBtn" class="btn btn--ghost btn--sm">닫기</button>
      </div>
      <div id="postcodeLayer" style="width:100%;height:450px"></div>
    </div>
  </div>

  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    /* 카카오맵 SDK와 무관하게 독립적으로 동작해야 한다 — 지도 SDK가 실패/지연되더라도 주소 검색은
       그대로 되어야 하므로, 아래 kakao.maps.load(...) 블록 안에 넣지 않고 별도로 뺐다. */
    var postcodeOverlay = document.getElementById('postcodeOverlay');
    var postcodeLayer = document.getElementById('postcodeLayer');
    var postcode = new daum.Postcode({
      oncomplete: function (data) {
        var addr = data.roadAddress || data.jibunAddress;
        var addressInput = document.getElementById('address');
        addressInput.value = addr;
        postcodeOverlay.style.display = 'none';
        addressInput.focus();
        // 주소 검색 직후 좌표까지 바로 확인되도록 기존 지오코더 버튼을 이어서 눌러준다
        // (카카오맵 SDK가 로드됐을 때만 실제로 동작 — 실패했으면 이 클릭은 조용히 무시됨).
        var geocodeBtn = document.getElementById('geocodeBtn');
        if (geocodeBtn) geocodeBtn.click();
      },
      width: '100%',
      height: '100%'
    });

    document.getElementById('addressSearchBtn').addEventListener('click', function () {
      postcodeOverlay.style.display = 'flex';
      postcodeLayer.innerHTML = '';
      postcode.embed(postcodeLayer);
    });
    document.getElementById('postcodeCloseBtn').addEventListener('click', function () {
      postcodeOverlay.style.display = 'none';
    });
  </script>

  <script th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapJsKey} + '&libraries=services&autoload=false'}"></script>
  <script th:inline="javascript">
    kakao.maps.load(function () {
      var geocoder = new kakao.maps.services.Geocoder();
      var statusEl = document.getElementById('geocodeStatus');
      var detailEl = document.getElementById('geocodeDetail');
      var mapEl = document.getElementById('locationPreviewMap');
      var map = null;
      var marker = null;

      // 다른 화면의 상태 배지와 같은 방식(색만 다르고 모양은 통일, 이모지 없음).
      function setGeoStatus(text, variant, detail) {
        statusEl.textContent = text;
        statusEl.className = 'badge badge--' + variant;
        detailEl.textContent = detail || '';
      }

      function showPreview(lat, lng) {
        var position = new kakao.maps.LatLng(lat, lng);
        mapEl.style.display = 'block';

        if (!map) {
          map = new kakao.maps.Map(mapEl, { center: position, level: 4 });
          marker = new kakao.maps.Marker({ position: position, map: map });
        } else {
          map.setCenter(position);
          marker.setPosition(position);
          map.relayout();
        }
      }

      var initialLat = document.getElementById('latitude').value;
      var initialLng = document.getElementById('longitude').value;
      if (initialLat && initialLng) {
        showPreview(Number(initialLat), Number(initialLng));
      }

      document.getElementById('geocodeBtn').addEventListener('click', function () {
        var address = document.getElementById('address').value.trim();
        if (!address) {
          setGeoStatus('주소 입력 필요', 'danger');
          return;
        }
        setGeoStatus('확인 중', 'neutral');

        geocoder.addressSearch(address, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            var lat = result[0].y;
            var lng = result[0].x;
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            setGeoStatus('위치 확인됨', 'success', '확인된 위치: ' + result[0].address_name + ' — 아래 지도 핀이 맞는지 확인해 주세요.');
            showPreview(Number(lat), Number(lng));
          } else {
            document.getElementById('latitude').value = '';
            document.getElementById('longitude').value = '';
            mapEl.style.display = 'none';
            setGeoStatus('주소를 찾지 못함', 'danger', '주소를 더 자세히 입력해 보세요 (저장은 가능하지만 지도엔 안 뜰 수 있어요).');
          }
        });
      });
    });
  </script>

</div>
</body>
</html>
