<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('검색 결과', ~{:: #content}, 'home', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">

	<form th:action="@{/user/search}" method="get" class="search" style="margin-bottom:var(--s-3)">
		<span>🔍</span>
		<input type="text" name="q" th:value="${keyword}" placeholder="베이커리, 반찬, 도시락 검색"
		       style="border:none;background:transparent;outline:none;width:100%;font-size:var(--fs-md);color:var(--c-text)">
		<input type="hidden" name="sort" th:value="${sort}">
		<input type="hidden" name="price" th:value="${price}">
		<input type="hidden" name="pickup" th:value="${pickup}">
		<input type="hidden" name="lat" th:value="${lat}">
		<input type="hidden" name="lng" th:value="${lng}">
	</form>

	<!--/* 강노은: 위치 권한이 차단돼 있으면 어디서 풀 수 있는지 안내한다 — 아래 "거리순" 클릭 스크립트 참고. */-->
	<div id="geo-blocked-banner" class="banner banner--info" style="margin-bottom:var(--s-3);display:none;align-items:flex-start">
		<span style="font-size:16px">📍</span>
		<div class="u-grow">
			<div class="banner__title">위치 권한이 꺼져 있어요</div>
			<div class="banner__desc" id="geo-blocked-desc"></div>
		</div>
		<button type="button" id="geo-blocked-dismiss" aria-label="닫기"
		        style="background:none;border:none;cursor:pointer;color:var(--c-text-mut);font-size:14px;line-height:1;padding:2px">✕</button>
	</div>

	<div class="u-row" style="justify-content:space-between">
		<div class="u-row" style="gap:6px;flex-wrap:wrap">
			<a class="chip" th:classappend="${sort == null or sort == 'discount'} ? ' is-active'"
			   th:href="@{/user/search(q=${keyword}, sort='discount', price=${price}, pickup=${pickup}, lat=${lat}, lng=${lng})}">할인율순</a>
			<a class="chip" th:classappend="${sort == 'price'} ? ' is-active'"
			   th:href="@{/user/search(q=${keyword}, sort='price', price=${price}, pickup=${pickup}, lat=${lat}, lng=${lng})}">가격낮은순</a>
			<a class="chip" th:classappend="${sort == 'closing'} ? ' is-active'"
			   th:href="@{/user/search(q=${keyword}, sort='closing', price=${price}, pickup=${pickup}, lat=${lat}, lng=${lng})}">마감임박순</a>
			<!--/* 강노은: 좌표가 아직 없으면 클릭 시 JS가 위치 권한을 먼저 확인/요청하고(girigiriRequestLocation,
			     app.js), 받은 좌표를 붙여서 다시 이 링크로 이동한다 — data-has-coords로 두 케이스를 구분한다. */-->
			<a class="chip" id="sort-distance-chip" th:classappend="${sort == 'distance'} ? ' is-active'"
			   th:attr="data-has-coords=${lat != null and lng != null}"
			   th:href="@{/user/search(q=${keyword}, sort='distance', price=${price}, pickup=${pickup}, lat=${lat}, lng=${lng})}">거리순</a>
			<button type="button" class="chip" id="filter-toggle-btn"
			        th:classappend="${(price != null and !#strings.isEmpty(price)) or (pickup != null and !#strings.isEmpty(pickup))} ? ' is-active'">필터 ▾</button>
		</div>
		<span class="u-mut" style="font-size:12px" th:text="${resultCount} + '개 결과'">18개 결과</span>
	</div>

	<div class="card" id="filter-panel" style="display:none;margin-top:var(--s-3)">
		<div class="field" style="margin-bottom:16px">
			<label class="field__label">가격대</label>
			<div class="u-row" style="gap:8px;flex-wrap:wrap">
				<a class="chip" th:classappend="${price == 'under5000'} ? ' is-active'"
				   th:href="@{/user/search(q=${keyword}, sort=${sort}, price='under5000', pickup=${pickup}, lat=${lat}, lng=${lng})}">5천원 이하</a>
				<a class="chip" th:classappend="${price == '5000to10000'} ? ' is-active'"
				   th:href="@{/user/search(q=${keyword}, sort=${sort}, price='5000to10000', pickup=${pickup}, lat=${lat}, lng=${lng})}">5천~1만원</a>
				<a class="chip" th:classappend="${price == 'over10000'} ? ' is-active'"
				   th:href="@{/user/search(q=${keyword}, sort=${sort}, price='over10000', pickup=${pickup}, lat=${lat}, lng=${lng})}">1만원 이상</a>
			</div>
		</div>
		<div class="field">
			<!--/* 강노은: StoreEntity.lastPickupTime/prepTimeMinutes(송채현이 예약 로직용으로 추가한 필드)를
			     재사용해 판단한다 — 매장이 아직 마지막 픽업시간을 설정 안 했으면 "저녁/마감임박" 버킷에서는
			     제외된다(SearchService.matchesPickupBucket 참고). */-->
			<label class="field__label">픽업 가능 시간</label>
			<div class="u-row" style="gap:8px;flex-wrap:wrap">
				<a class="chip" th:classappend="${pickup == 'now'} ? ' is-active'"
				   th:href="@{/user/search(q=${keyword}, sort=${sort}, price=${price}, pickup='now', lat=${lat}, lng=${lng})}">지금 바로</a>
				<a class="chip" th:classappend="${pickup == 'evening'} ? ' is-active'"
				   th:href="@{/user/search(q=${keyword}, sort=${sort}, price=${price}, pickup='evening', lat=${lat}, lng=${lng})}">저녁 18~21시</a>
				<a class="chip" th:classappend="${pickup == 'late'} ? ' is-active'"
				   th:href="@{/user/search(q=${keyword}, sort=${sort}, price=${price}, pickup='late', lat=${lat}, lng=${lng})}">마감임박 21시~</a>
			</div>
		</div>
		<a th:href="@{/user/search(q=${keyword})}" class="btn btn--outline btn--block" style="color:var(--c-text-sub);margin-top:16px">필터 초기화</a>
	</div>

	<div style="display:flex;flex-direction:column;gap:12px;margin-top:var(--s-3)">
		<div th:each="card : ${results}">
			<div th:replace="~{common/components :: storeCard(${card}, false)}"></div>
		</div>
		<p th:if="${#lists.isEmpty(results)}" class="u-sub">검색 결과가 없어요.</p>
	</div>

	<script>
		(function () {
			var btn = document.getElementById('filter-toggle-btn');
			var panel = document.getElementById('filter-panel');
			if (!btn || !panel) return;
			btn.addEventListener('click', function () {
				panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
			});
		})();

		/* 강노은: "거리순" 클릭 시 좌표가 없으면 위치 권한부터 물어보고, 받은 좌표를 붙여 다시 이동한다.
		   이미 좌표가 URL에 있으면(다른 정렬/필터로 이동했다가 돌아온 경우) 그냥 링크대로 이동한다.
		   차단돼 있으면 alert() 대신 배너로 "어디서 풀 수 있는지"까지 안내한다 — 예전엔 "브라우저
		   설정에서 허용해주세요"라고만 떠서 정작 어디로 가야 하는지 몰라 불편하다는 피드백을 받았다. */
		(function () {
			var chip = document.getElementById('sort-distance-chip');
			if (!chip) return;

			var banner = document.getElementById('geo-blocked-banner');
			var descEl = document.getElementById('geo-blocked-desc');
			var dismissBtn = document.getElementById('geo-blocked-dismiss');
			if (dismissBtn) {
				dismissBtn.addEventListener('click', function () { banner.style.display = 'none'; });
			}

			chip.addEventListener('click', function (e) {
				if (chip.dataset.hasCoords === 'true') return;
				e.preventDefault();
				if (banner) banner.style.display = 'none';

				var originalText = chip.textContent;
				chip.textContent = '위치 확인 중…';

				window.girigiriRequestLocation(function (pos) {
					var url = new URL(chip.href, window.location.origin);
					url.searchParams.set('lat', pos.coords.latitude);
					url.searchParams.set('lng', pos.coords.longitude);
					window.location.href = url.toString();
				}, function (reason) {
					chip.textContent = originalText;
					// 'unavailable'(GPS 응답 지연/실패)은 권한 문제가 아니라 배너 없이 버튼만 원복한다.
					if (reason !== 'denied' && reason !== 'unsupported') return;
					if (!banner) return;
					if (descEl) {
						descEl.textContent = reason === 'unsupported'
							? '이 브라우저에서는 위치 정보를 사용할 수 없어요.'
							: window.girigiriGeoHint();
					}
					banner.style.display = 'flex';
				});
			});
		})();
	</script>
</div>
</body>
</html>
