<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('매출 리포트', ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<!--/*
	매출 리포트 — WBS 3.0 확장, 문창호. /store/sales-report?period=today|thisweek|lastweek (또는 ?from=&to=)
	매출 성과(총매출·전주 대비·상품별·일별)를 Supabase(sales 테이블) 데이터로 조회한다.
	판매·폐기 리포트(/store/report, MySQL·운영/환경 지표)와는 컨트롤러·라우트·소스가 전부 다른 별개 기능.
	기간 pill(오늘/이번 주/지난 주) + 직접 선택. 주 경계는 정산 주(월~일)와 같아서 정산 확정분과 대조된다.
	화면 숫자는 SalesReportService.build() 하나에서 나온다.
*/-->
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/store.css}">

	<!-- Supabase 미설정 -->
	<div th:unless="${configured}" class="card" style="text-align: center">
		<p style="font-size: var(--fs-xl)">🔌</p>
		<p class="u-bold" style="font-size: var(--fs-md)">매출 데이터 저장소가 아직 연결 안 됐어요</p>
		<p class="u-sub" style="font-size: var(--fs-sm); margin-top: var(--s-2); line-height: 1.5">
			.env에 SUPABASE_URL / SUPABASE_SERVICE_KEY를 채우면 매출 리포트가 켜져요.
		</p>
	</div>

	<div th:if="${configured}">
		<p class="u-bold" style="font-size: var(--fs-md)" th:text="${report.storeName}">○○베이커리</p>

		<!-- 조회 기간 — 정산 상세와 동일한 pill + 직접 선택 -->
		<p class="settle-period__title">조회 기간</p>
		<p class="settle-period__current" th:text="${report.periodLabel}">2026년 9월</p>
		<div class="settle-period">
			<a th:href="@{/store/sales-report(period='today')}" class="settle-period__pill"
			   th:classappend="${report.periodKey == 'today'} ? ' is-active'">오늘</a>
			<a th:href="@{/store/sales-report(period='thisweek')}" class="settle-period__pill"
			   th:classappend="${report.periodKey == 'thisweek'} ? ' is-active'">이번 주</a>
			<a th:href="@{/store/sales-report(period='lastweek')}" class="settle-period__pill"
			   th:classappend="${report.periodKey == 'lastweek'} ? ' is-active'">지난 주</a>
			<button type="button" id="sales-range-toggle" class="settle-period__pill settle-period__pill--toggle"
			        th:classappend="${report.periodKey == 'custom'} ? ' is-active'"
			        aria-controls="sales-range-form" aria-expanded="false">📅 직접 선택</button>
		</div>
		<form method="get" th:action="@{/store/sales-report}" class="settle-range is-hidden" id="sales-range-form">
			<input type="date" name="from" th:value="${report.fromDate}" class="settle-range__date" aria-label="시작일" required>
			<span class="settle-range__tilde">~</span>
			<input type="date" name="to" th:value="${report.toDate}" class="settle-range__date" aria-label="종료일" required>
			<button type="submit" class="settle-range__btn is-active">조회</button>
		</form>

		<!-- 총매출 -->
		<div class="card" style="margin-top: var(--s-4)">
			<div class="u-row" style="justify-content: space-between; align-items: baseline">
				<span class="u-bold" style="font-size: var(--fs-sm)">총매출</span>
				<span class="u-bold u-primary" style="font-size: var(--fs-xl)"
				      th:text="${#numbers.formatInteger(report.totalSales, 0, 'COMMA')} + '원'">1,240,000원</span>
			</div>
			<div class="report-summary" style="margin-top: var(--s-2)">
				<div><span>판매 건수</span><b th:text="${report.orderCount} + '건'">42건</b></div>
				<div><span>판매 수량</span><b th:text="${report.itemCount} + '개'">88개</b></div>
				<div th:if="${report.prevTotalSales != null}">
					<span>전주(<span th:text="${#numbers.formatInteger(report.prevTotalSales, 0, 'COMMA')}">280,000</span>원) 대비</span>
					<b th:classappend="${report.deltaPercent >= 0} ? ' u-primary' : ' u-danger'"
					   th:text="${(report.deltaPercent >= 0 ? '▲ +' : '▼ ') + report.deltaPercent + '%'}">▲ +27%</b>
				</div>
			</div>
		</div>

		<!-- 빈 상태 -->
		<div th:if="${report.empty}" class="card" style="margin-top: var(--s-3); text-align: center">
			<p class="u-sub" style="font-size: var(--fs-sm)">이 기간에 매출 데이터가 없어요.</p>
		</div>

		<div th:unless="${report.empty}">
			<!-- 일별 그래프 (기간이 2일 이상일 때만) -->
			<div th:if="${report.showGraph}">
				<p class="u-bold" style="font-size: var(--fs-sm); margin-top: var(--s-4)">일별 매출</p>
				<div class="bar-chart">
					<div class="bar-chart__col" th:each="d : ${report.days}"
					     th:title="${d.label + ' · ' + #numbers.formatInteger(d.amount, 0, 'COMMA') + '원 (' + d.count + '건)'}">
						<div class="bar-chart__track">
							<div class="bar-chart__seg bar-chart__seg--sold" th:style="'height:' + ${d.barPercent} + '%'"></div>
						</div>
						<div class="bar-chart__label" th:text="${d.showLabel} ? ${d.label} : ''">1</div>
					</div>
				</div>
			</div>

			<!-- 상품별 -->
			<p class="u-bold" style="font-size: var(--fs-sm); margin-top: var(--s-4)">상품별 매출</p>
			<div class="report-table-wrap" style="margin-top: var(--s-2)">
				<table class="report-table">
					<thead>
					<tr><th style="text-align:left">상품명</th><th>카테고리</th><th>수량</th><th>매출</th><th>비중</th></tr>
					</thead>
					<tbody>
					<tr th:each="p : ${report.products}">
						<td style="text-align:left" th:text="${p.name}">크림빵</td>
						<td th:text="${p.category} ?: '-'">베이커리</td>
						<td th:text="${p.qty}">20</td>
						<td th:text="${#numbers.formatInteger(p.amount, 0, 'COMMA')}">50,000</td>
						<td th:text="${p.sharePercent} + '%'">18%</td>
					</tr>
					</tbody>
					<tfoot>
					<tr>
						<td colspan="2" style="text-align:left">합계</td>
						<td th:text="${report.itemCount}">88</td>
						<td th:text="${#numbers.formatInteger(report.totalSales, 0, 'COMMA')}">1,240,000</td>
						<td>100%</td>
					</tr>
					</tfoot>
				</table>
			</div>
		</div>

	</div>

	<script th:inline="none">
	(function () {
		var back = document.querySelector('.topbar__back[data-back]');
		if (back) {
			back.removeAttribute('data-back');
			back.addEventListener('click', function () { location.href = '/store/dashboard'; });
		}

		// "직접 선택" 토글 — 누를 때만 날짜 입력칸이 열린다 (정산 상세와 동일).
		var btn = document.getElementById('sales-range-toggle');
		var form = document.getElementById('sales-range-form');
		if (btn && form) {
			btn.addEventListener('click', function () {
				var opened = form.classList.toggle('is-hidden') === false;
				btn.setAttribute('aria-expanded', opened);
				if (opened) {
					var first = form.querySelector('input[name="from"]');
					if (first) { first.focus(); }
				}
			});
		}
	})();
	</script>
</div>
</body>
</html>
