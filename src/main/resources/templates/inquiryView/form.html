<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('문의하기', ~{:: #content}, 'home', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<a th:href="@{/user/support}" class="u-sub" style="font-size:13px;display:inline-block;margin-bottom:var(--s-3)">‹ 문의 목록으로</a>

	<p class="u-sub" th:if="${storeName != null}" style="margin-bottom:var(--s-3)"
	   th:text="${storeName} + '에 대한 문의예요.'">가게에 대한 문의예요.</p>

	<form th:action="@{/user/inquiries}" method="post" enctype="multipart/form-data">
		<input type="hidden" name="storeId" th:if="${storeId != null}" th:value="${storeId}">
		<div class="field" style="margin-bottom:var(--s-3)">
			<label class="field__label">제목</label>
			<input type="text" name="title" class="input" required maxlength="100" placeholder="문의 제목을 입력하세요">
		</div>
		<div class="field">
			<label class="field__label">내용</label>
			<textarea name="content" class="input" required maxlength="1000" style="min-height:140px;resize:vertical" placeholder="문의 내용을 입력하세요"></textarea>
		</div>
		<!--/* 강노은: 문의 사진 첨부(선택) — 리뷰에서 쓰던 드롭존을 그대로 재사용. 문의는 수정 기능이
		     없어서(등록만 가능) idle/preview 두 상태만 있으면 되고, "현재 사진" 미리보기 분기는 필요 없다. */-->
		<div class="field" style="margin-top:var(--s-3)">
			<label class="field__label">사진 (선택)</label>
			<div class="review-upload" style="margin-top:6px" data-photo-dropzone
			     role="button" tabindex="0" aria-label="문의 사진 선택 (드래그 앤 드롭 가능)">
				<input type="file" name="imagePhoto" class="review-upload__input"
				       accept="image/jpeg,image/png,image/webp,image/gif" data-photo-input tabindex="-1">
				<div class="review-upload__idle" data-photo-idle>
					<span class="review-upload__badge" aria-hidden="true">📤</span>
					<p class="review-upload__text">사진을 끌어다 놓으세요</p>
					<span class="review-upload__choose">파일 선택</span>
				</div>
				<div class="review-upload__preview" data-photo-preview hidden>
					<img data-photo-preview-img class="review-upload__preview-img" alt="선택한 문의 사진 미리보기">
					<span class="review-upload__filename" data-photo-filename></span>
					<button type="button" class="review-upload__remove" data-photo-remove aria-label="선택 취소">✕ 취소</button>
				</div>
			</div>
			<p class="review-upload-hint">jpg · png · webp · gif, 5MB 이하</p>
		</div>
		<button type="submit" class="btn btn--block" style="margin-top:var(--s-4)">등록하기</button>
	</form>
</div>
</body>
</html>
