<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('문의 목록으로', ~{:: #content}, ${session.viewMode == 'OWNER_MODE' ? 'my-owner' : 'home'}, false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<!--/* 강노은 (2026-10-05): 원래는 상단바 제목에 문의 제목(inquiry.title)을 그대로 쓰고, 그
	     아래에 "‹ 문의 목록으로" 링크를 따로 뒀었다 — 문의 제목은 바로 아래 카드에도 또 나오는데
	     상단바까지 중복으로 보여줄 필요가 없고, 뒤로가기 링크도 상단바 자체의 뒤로가기 버튼이랑
	     중복이었다. 상단바 제목을 "문의 목록으로" 고정 문구로 바꾸고(상단바 뒤로가기 버튼이 실질적
	     으로 같은 역할), 아래 링크는 지웠다. */-->
	<div class="card">
		<div class="u-row" style="justify-content:space-between;align-items:flex-start">
			<b style="font-size:16px" th:text="${inquiry.title}">문의 제목</b>
			<form th:if="${canDeleteInquiry}" th:action="@{/user/inquiries/{id}/delete(id=${inquiry.id})}" method="post"
			      data-confirm="문의를 삭제할까요? 댓글도 함께 삭제됩니다.">
				<button type="submit" class="btn btn--outline" style="padding:4px 10px;font-size:11px;color:var(--c-danger);border-color:var(--c-danger)">삭제</button>
			</form>
		</div>
		<div class="u-mut" style="font-size:12px;margin-top:4px">
			<span th:text="${authorName}">작성자</span>
			<span th:if="${storeName != null}" th:text="' · ' + ${storeName}"></span>
			<span th:text="' · ' + ${createdAtDisplay}"></span>
		</div>
		<!-- 추가됨 (2026-09-08) — "예약 상세에서 문의하기"로 접수된 문의는 관련 주문을 보여준다. -->
		<p class="u-sub" th:if="${reservationSummary != null}" style="margin-top:4px" th:text="'관련 주문: ' + ${reservationSummary}">관련 주문: 상품명 × 1개 · 픽업 코드 PICK-XXXX</p>
		<p style="margin-top:var(--s-3);font-size:14px;white-space:pre-wrap" th:text="${inquiry.content}">문의 내용</p>
		<img th:if="${inquiry.imageUrl != null and !#strings.isEmpty(inquiry.imageUrl)}" th:src="${inquiry.imageUrl}"
		     alt="문의 사진" loading="lazy" onerror="this.style.display='none'"
		     style="margin-top:var(--s-3);width:100%;max-width:280px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md)">
	</div>

	<div class="section-title" style="font-size:15px">
		댓글 <span class="section-title__count" th:text="${comments.size()}">2</span>
	</div>

	<div style="display:flex;flex-direction:column;gap:0">
		<div th:each="c : ${comments}" class="list-row" style="align-items:flex-start">
			<div class="list-row__body">
				<div class="u-row" style="justify-content:space-between">
					<b style="font-size:13px" th:text="${c.authorName}">닉네임</b>
					<span class="u-mut" style="font-size:11px" th:text="${c.createdAtLabel}">오늘</span>
				</div>
				<p style="font-size:13px;margin-top:4px" th:text="${c.content}">댓글 내용</p>
				<form th:if="${c.canDelete}" th:action="@{/user/inquiries/{id}/comments/{commentId}/delete(id=${inquiry.id}, commentId=${c.id})}"
				      method="post" data-confirm="댓글을 삭제할까요?" style="margin-top:4px">
					<button type="submit" class="btn btn--outline" style="padding:2px 8px;font-size:11px;color:var(--c-danger);border-color:var(--c-danger)">삭제</button>
				</form>
			</div>
		</div>
		<p th:if="${#lists.isEmpty(comments)}" class="u-sub">아직 댓글이 없어요.</p>
	</div>

	<form th:if="${loggedIn}" th:action="@{/user/inquiries/{id}/comments(id=${inquiry.id})}" method="post" style="margin-top:var(--s-4)">
		<textarea name="content" class="input" required maxlength="500" style="min-height:70px;resize:vertical" placeholder="댓글을 입력하세요"></textarea>
		<button type="submit" class="btn btn--block" style="margin-top:var(--s-2)">댓글 등록</button>
	</form>
	<p th:unless="${loggedIn}" class="u-sub" style="margin-top:var(--s-4)">
		<a th:href="@{/auth/loginForm}" class="u-primary" style="font-weight:700">로그인</a> 하면 댓글을 남길 수 있어요.
	</p>
</div>
</body>
</html>
