<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('기리기리', ~{:: #content}, 'home', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/home.css}">

	<!-- 스플래시 화면 (2026-09-17 추가, 2026-09-17 그래픽 보강, 2026-09-17 CTA 버튼 추가) — "앱을
	     열면 바로 데이터가 아니라 로고+설명이 잠깐 뜬다"는 요청 → "조금 세련된 그래픽이 들어가도
	     괜찮을 것 같다" → "'시작해볼까요?' 버튼이 있으면 좋겠다"로 이어진 피드백. 페이지 콘텐츠 안의
	     배너가 아니라 화면 전체를 덮는 진짜 스플래시 — 홈 화면(진입점)에 들어올 때만 뜨고, 지도/목록
	     같은 실제 데이터는 그 뒤에 그대로 있다가 스플래시가 걷히면 바로 보인다. 버튼이 생긴 이상
	     "잠깐 떴다 무조건 자동으로 사라지는" 방식은 버튼을 누를 틈도 없이 사라져서 의미가 없다 —
	     그래서 기본은 버튼 클릭으로 넘어가고, 못 보고 지나칠 경우를 대비한 자동 진행(폴백)만 넉넉하게
	     남겨뒀다. 배지 주위의 "레이더 핑" 링 애니메이션은 "마감 임박 · 긴급 구제" 컨셉(급박함/
	     실시간성)을 은유한 것. FOUC 방지를 위해 home.css 로드를 기다리지 않도록 이 안에서만 쓰는
	     스타일을 별도 style 태그로 넣는다. -->
	<style>
		#splash-screen{position:fixed;inset:0;z-index:999;overflow:hidden;background:linear-gradient(160deg, var(--c-primary) 0%, var(--c-primary-strong) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease;}
		#splash-screen::before,#splash-screen::after{content:'';position:absolute;border-radius:50%;pointer-events:none;}
		#splash-screen::before{width:260px;height:260px;top:-90px;right:-70px;background:radial-gradient(circle, rgba(249,240,227,.14) 0%, rgba(249,240,227,0) 70%);}
		#splash-screen::after{width:220px;height:220px;bottom:-70px;left:-60px;background:radial-gradient(circle, rgba(0,0,0,.12) 0%, rgba(0,0,0,0) 70%);}
		#splash-badge{position:relative;width:88px;height:88px;border-radius:50%;background:rgba(249,240,227,.16);display:flex;align-items:center;justify-content:center;margin-bottom:var(--s-4);box-shadow:0 12px 28px rgba(0,0,0,.18);animation:splash-pop .5s cubic-bezier(.34,1.56,.64,1) both;}
		#splash-badge::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(249,240,227,.35);animation:splash-ping 1.8s ease-out infinite;}
		#splash-badge svg{width:44px;height:44px;color:var(--c-primary-weak);}
		#splash-title{position:relative;color:var(--c-primary-weak);font-size:27px;font-weight:900;margin:0;letter-spacing:-0.02em;opacity:0;animation:splash-rise .5s ease .15s forwards;}
		#splash-desc{position:relative;color:rgba(249,240,227,.85);font-size:13px;margin-top:8px;opacity:0;animation:splash-rise .5s ease .3s forwards;}
		#splash-cta{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:var(--s-6);padding:13px 26px;border-radius:999px;background:var(--c-primary-weak);color:var(--c-primary-strong);font-size:var(--fs-md);font-weight:var(--fw-bold);box-shadow:0 8px 20px rgba(0,0,0,.16);opacity:0;animation:splash-rise .5s ease .45s forwards;transition:filter .15s ease;}
		#splash-cta:active{filter:brightness(.95);}
		#splash-cta svg{width:16px;height:16px;color:var(--c-primary-strong);}
		@keyframes splash-pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
		@keyframes splash-ping{0%{transform:scale(.8);opacity:.7;}100%{transform:scale(1.35);opacity:0;}}
		@keyframes splash-rise{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
	</style>
	<div id="splash-screen">
		<div id="splash-badge">
			<svg class="icon"><use href="#i-storefront"/></svg>
		</div>
		<h1 id="splash-title">기리기리</h1>
		<p id="splash-desc">동네 가게 마감 임박 음식 긴급 구제</p>
		<button type="button" id="splash-cta">
			시작해볼까요?
			<svg class="icon"><use href="#i-chevron-right"/></svg>
		</button>
	</div>
	<script th:inline="none">
	(function () {
		var splash = document.getElementById('splash-screen');
		if (!splash) { return; }
		// 뒤로가기로 다시 보였을 때 재생 방지 (2026-09-17 추가) — 왜: Spring Security가 모든 응답에
		// Cache-Control: no-store를 붙여서(로그인 후 뒤로가기로 인증된 페이지가 캐시에서 다시 보이는
		// 것을 막기 위한 보안 헤더 — 전역이라 여기서 끌 수 없다) 홈 화면이 bfcache에 안 들어가고,
		// 지도 페이지에서 다른 화면(찜 등)에 갔다가 뒤로가기를 누르면 "/"가 완전히 새로 로드되면서
		// 스플래시가 처음부터 다시 재생됐다 — 실제 앱이라면 다시 지도가 바로 보여야 하는데 매번
		// 스플래시로 되돌아가는 문제로 리포트됨. sessionStorage로 "이번 브라우저 세션에서 이미 봤는지"
		// 를 기억해서, 탭을 새로 열었을 때(콜드 스타트)만 재생하고 그 안에서의 재방문/뒤로가기는
		// 스킵한다.
		if (sessionStorage.getItem('girigiri-splash-shown')) {
			splash.remove();
			return;
		}
		sessionStorage.setItem('girigiri-splash-shown', '1');
		var dismissed = false;
		function dismissSplash() {
			if (dismissed) { return; }
			dismissed = true;
			splash.style.opacity = '0';
			setTimeout(function () { splash.remove(); }, 400);
		}
		document.getElementById('splash-cta').addEventListener('click', dismissSplash);
		setTimeout(dismissSplash, 3000);
	})();
	</script>

	<!-- 삭제됨 (2026-09-16, 디자인 리팩토링) — 왜: 상단바(topbarHome)가 이미 동네 위치를 보여주는데,
	     그 밑에 앱 이름 <h1>+태그라인 문장까지 매번 반복해서 실제 콘텐츠(지도·검색)가 그만큼 아래로
	     밀렸다. 처음 방문하는 랜딩페이지가 아니라 하루에도 여러 번 여는 홈 화면이라 자기소개가
	     필요 없다 — 지도가 위쪽에 바로 오도록 뺐다.

	     시안이었던 그린 히어로 밴드(2026-09-17)는 되돌렸다 — 원하던 건 페이지 안에 계속 남는
	     배너가 아니라, 앱을 열 때 잠깐 떴다 사라지는 스플래시 화면이었다. 아래 #splash-screen
	     참고. -->

	<!--/* TODO(강노은): 카드 리스트 붙이면서 지도 높이 등 페이지 전용 스타일은 static/css/map.css로 분리 */-->
	<div id="kakao-map" style="width:100%;height:260px;border-radius:var(--r-lg);margin-top:var(--s-4);overflow:hidden;border:1px solid var(--c-line);"></div>

	<a th:href="@{/user/search}" class="search" style="margin-top:var(--s-4)"><svg class="icon" style="width:16px;height:16px"><use href="#i-search"/></svg> <span>베이커리, 반찬, 도시락 검색</span></a>

	<!--/* 강노은: 위치 권한이 차단돼 있으면 조용히 넘어가지 않고 어디서 풀 수 있는지 안내한다
	     (아래 script 참고). 한 번 닫으면 localStorage에 남겨서 방문할 때마다 다시 뜨지 않게 한다. */-->
	<div id="geo-blocked-banner" class="banner banner--info" style="margin-top:var(--s-3);display:none;align-items:flex-start">
		<svg class="icon" style="width:16px;height:16px"><use href="#i-pin"/></svg>
		<div class="u-grow">
			<div class="banner__title">위치 권한이 꺼져 있어요</div>
			<div class="banner__desc" id="geo-blocked-desc"></div>
		</div>
		<button type="button" id="geo-blocked-dismiss" aria-label="닫기"
		        style="background:none;border:none;cursor:pointer;color:var(--c-text-mut);line-height:1;padding:2px"><svg class="icon" style="width:14px;height:14px"><use href="#i-close"/></svg></button>
	</div>

	<div class="chip-row" id="category-filter" style="margin-top:var(--s-3)">
		<button type="button" class="chip is-active" data-filter="all">전체</button>
		<button type="button" class="chip" data-filter="베이커리">베이커리</button>
		<button type="button" class="chip" data-filter="반찬">반찬</button>
		<button type="button" class="chip" data-filter="도시락">도시락</button>
		<button type="button" class="chip" data-filter="카페">카페</button>
	</div>

	<div class="banner" style="margin-top:var(--s-4)" th:if="${todayRescueCount} > 0">
		<svg class="icon" style="width:16px;height:16px"><use href="#i-globe"/></svg>
		<div class="u-grow">
			<div class="banner__title" th:text="'오늘 ' + ${todayRescueCount} + '명이 마감 음식을 구했어요'">오늘 3,940명이 마감 음식을 구했어요</div>
		</div>
	</div>

	<div class="section-title" style="padding-top:var(--s-2)">
		내 주변 마감세일 <span class="section-title__count" th:text="${storeCards.size()}">12</span>
	</div>

	<div id="store-card-list" style="display:flex;flex-direction:column;gap:var(--s-3)">
		<div th:each="card : ${storeCards}" th:attr="data-category=${card.category}">
			<div th:replace="~{common/components :: storeCard(${card}, true)}"></div>
		</div>
		<p th:if="${#lists.isEmpty(storeCards)}" class="u-sub">지금 마감세일 중인 가게가 없어요.</p>
	</div>

	<!--/* 페이지네이션 (2026-09-21) — "가게가 많아지면 스크롤도 길어진다"는 피드백. 카테고리
	     필터가 이미 클라이언트 사이드(위 스크립트)라 서버 페이지네이션 대신 같은 방식으로 맞췄다:
	     처음엔 5개만 보여주고 "더보기"를 누르면 5개씩 더 펼친다. 필터를 바꾸면 펼침 개수도 초기화된다. */-->
	<button type="button" id="store-load-more" class="btn btn--outline btn--block" style="margin-top:var(--s-3);display:none">더보기</button>

	<!--/* 강노은: 개인화 추천 섹션 (WBS 4.0 탐색·검색, 맨 마지막으로 미뤄뒀던 항목).
	     구매 이력(픽업 완료)에서 가장 많이 산 카테고리를 뽑아 추천하고, 이력이 없는 신규 유저는
	     RecommendationService가 "지금 인기있는 마감세일"로 폴백해준다 — 추천 카드가 하나도 없을
	     때만(=지금 판매 중인 마감세일 자체가 없을 때) 섹션 자체를 감춘다. */-->
	<div th:if="${!#lists.isEmpty(recommendation.cards())}">
		<div class="section-title" style="padding-top:var(--s-2)" th:text="${recommendation.title()}">
			베이커리 좋아하시는군요, 이건 어때요?
		</div>
		<div style="display:flex;flex-direction:column;gap:var(--s-3)">
			<div th:each="card : ${recommendation.cards()}">
				<div th:replace="~{common/components :: storeCard(${card}, true)}"></div>
			</div>
		</div>
	</div>

	<!--/* 강노은: "현재 위치 기준 거리순 카드 목록" — URL에 좌표가 아직 없으면 Geolocation으로
	     한 번 물어보고, 받으면 그 좌표를 붙여 페이지를 자동으로 다시 불러온다(검색 페이지의
	     "거리순" 버튼과 같은 방식이지만 여기는 메인 화면이라 버튼 없이 최초 진입 시 자동으로 시도).
	     차단돼 있으면 위 배너로 어디서 풀 수 있는지 안내한다(한 번 닫으면 다시 안 뜸) — 예전엔
	     그냥 조용히 무시했는데, "왜 거리순이 안 되는지도 모르겠고 어디서 풀어야 할지도 모르겠다"는
	     피드백을 받고 바꿨다. 안내를 봐도 여전히 HomeService가 좌표 없을 때 기존 마감임박순으로
	     폴백해주므로 화면 자체는 깨지지 않는다. */-->
	<script>
		// 강노은: /js/app.js(girigiriRequestLocation 정의)가 이 content보다 뒤(</body> 직전)에서
		// 로드되기 때문에, 여기서 바로 호출하면 아직 정의 전이라 에러난다 — DOMContentLoaded까지
		// 기다려서 app.js가 먼저 실행되게 한다.
		document.addEventListener('DOMContentLoaded', function () {
			var params = new URLSearchParams(window.location.search);
			if (params.has('lat') && params.has('lng')) return; // 이미 좌표로 들어온 상태 — 재요청 안 함

			var STORAGE_KEY = 'giriGeoHintDismissed';
			var banner = document.getElementById('geo-blocked-banner');
			var descEl = document.getElementById('geo-blocked-desc');
			var dismissBtn = document.getElementById('geo-blocked-dismiss');

			if (dismissBtn) {
				dismissBtn.addEventListener('click', function () {
					banner.style.display = 'none';
					try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) { /* 프라이빗 모드 등 — 무시 */ }
				});
			}

			window.girigiriRequestLocation(function (pos) {
				params.set('lat', pos.coords.latitude);
				params.set('lng', pos.coords.longitude);
				window.location.search = params.toString();
			}, function (reason) {
				// 'unavailable'(GPS 응답 지연/실패)은 권한 문제가 아니니 조용히 넘어간다(기존 마감임박순 유지).
				if (reason !== 'denied' && reason !== 'unsupported') return;
				if (!banner) return;
				try {
					if (localStorage.getItem(STORAGE_KEY) === '1') return; // 이미 한 번 닫았으면 다시 안 보여줌
				} catch (e) { /* localStorage 접근 불가 환경 — 매번 보여주는 쪽이 안전하니 그냥 진행 */ }
				var hint = reason === 'unsupported' ? '이 브라우저에서는 위치 정보를 사용할 수 없어요.' : window.girigiriGeoHint();
				if (descEl) descEl.textContent = '거리순 정렬을 쓰려면 위치 권한이 필요해요. ' + hint;
				banner.style.display = 'flex';
			});
		});
	</script>

	<!--/* th:replace="~{:: #content}"는 이 div 안쪽만 가져간다 — 스크립트도 반드시 여기 안에 있어야 렌더링된다. */-->
	<script th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapJsKey} + '&libraries=services,clusterer'}"></script>
	<script th:inline="javascript">
		/*<![CDATA[*/
		// StoreRepository에서 좌표가 있는 매장 전체를 뿌린다.
		var stores = /*[[${stores}]]*/ [];

		// 매장이 하나도 없을 때는 서울시청 좌표를 기본값으로 둔다.
		var FALLBACK_CENTER = { latitude: 37.5665, longitude: 126.9780 };

		kakao.maps.load(function () {
			var container = document.getElementById('kakao-map');
			var center = stores.length > 0 ? stores[0] : FALLBACK_CENTER;
			var map = new kakao.maps.Map(container, {
				center: new kakao.maps.LatLng(center.latitude, center.longitude),
				level: 4
			});

			var infoWindow = new kakao.maps.InfoWindow({ removable: true });

			// 커스텀 마커 (2026-09-16, 디자인 리팩토링 / 2026-09-17 네이비 리스킨) — 카카오맵 기본
			// 빨간 물방울 핀 그대로 쓰고 있었다("지도 API 튜토리얼 그대로"인 느낌의 흔한 원인).
			// 브랜드 컬러(--c-primary: #012A8C, 리스킨 전엔 그린 #15803D) 톤의 핀 모양 SVG를
			// data URI로 만들어 씀 — 이미지 파일을 새로 추가할 필요 없이 마커 하나로 재사용
			// (store마다 새로 안 만듦). CSS 변수를 못 쓰는 문맥(JS 문자열)이라 값이 하드코딩돼
			// 있다 — tokens.css의 --c-primary를 바꾸면 여기도 같이 맞춰야 한다.
			var markerImage = new kakao.maps.MarkerImage(
				'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
					'<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">' +
					'<path d="M18 0C8.06 0 0 8.06 0 18c0 13.5 18 26 18 26s18-12.5 18-26C36 8.06 27.94 0 18 0z" fill="#012A8C"/>' +
					'<circle cx="18" cy="18" r="7" fill="#fff"/>' +
					'</svg>'
				),
				new kakao.maps.Size(36, 44),
				{ offset: new kakao.maps.Point(18, 44) }
			);

			stores.forEach(function (store) {
				var position = new kakao.maps.LatLng(store.latitude, store.longitude);
				var marker = new kakao.maps.Marker({ position: position, map: map, image: markerImage });

				kakao.maps.event.addListener(marker, 'click', function () {
					// 강노은: 마커 클릭 시 이름/카테고리만 보여주고 끝이라 가게 상세로 넘어갈 방법이
					// 없었음 — 인포윈도우에 상세 페이지 링크를 추가한다.
					infoWindow.setContent(
						'<div style="padding:6px 10px;font-size:13px;white-space:nowrap;">'
						+ '<a href="/user/stores/' + store.id + '" style="color:inherit;text-decoration:none;">'
						+ store.storeName + (store.category ? ' · ' + store.category : '')
						+ ' <span style="color:var(--c-accent)">›</span>'
						+ '</a>'
						+ '</div>'
					);
					infoWindow.open(map, marker);
				});
			});
		});
		/*]]>*/
	</script>

	<script>
		(function () {
			var filterBar = document.getElementById('category-filter');
			var cardWrappers = document.querySelectorAll('#store-card-list > [data-category]');
			var loadMoreBtn = document.getElementById('store-load-more');
			if (cardWrappers.length === 0) return;

			var PAGE_SIZE = 5;
			var currentFilter = 'all';
			var revealed = PAGE_SIZE;

			function render() {
				var visibleCount = 0;
				cardWrappers.forEach(function (wrapper) {
					var matches = currentFilter === 'all' || wrapper.dataset.category === currentFilter;
					if (!matches) {
						wrapper.style.display = 'none';
						return;
					}
					visibleCount++;
					wrapper.style.display = visibleCount <= revealed ? '' : 'none';
				});
				if (loadMoreBtn) loadMoreBtn.style.display = visibleCount > revealed ? '' : 'none';
			}

			if (filterBar) {
				filterBar.addEventListener('click', function (event) {
					var chip = event.target.closest('.chip');
					if (!chip) return;

					filterBar.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-active'); });
					chip.classList.add('is-active');

					currentFilter = chip.dataset.filter;
					revealed = PAGE_SIZE;
					render();
				});
			}

			if (loadMoreBtn) {
				loadMoreBtn.addEventListener('click', function () {
					revealed += PAGE_SIZE;
					render();
				});
			}

			render();
		})();
	</script>

	<!--/* 강노은: 실시간 알림(SSE) 구독 — 새 알림이 생기거나 읽음 처리되면 서버가 최신 안읽음 개수를
	     밀어준다(NotificationController#stream). 로그인 안 했으면 401만 받고 끝나는 게 낭비라 아예 안 연다.
	     연결이 끊기면 EventSource가 알아서 재연결을 시도한다 — 별도 재시도 로직 안 짜도 된다. */-->
	<script th:if="${loggedIn}">
		(function () {
			if (!window.EventSource) return;
			var source = new EventSource('/user/alerts/stream');
			source.addEventListener('notification', function (e) {
				var count = parseInt(e.data, 10) || 0;
				var bell = document.getElementById('alert-bell');
				var dot = document.getElementById('alert-dot');
				if (!bell) return;
				if (count > 0 && !dot) {
					dot = document.createElement('span');
					dot.id = 'alert-dot';
					dot.style.cssText = 'position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:999px;background:var(--c-danger)';
					bell.appendChild(dot);
				} else if (count === 0 && dot) {
					dot.remove();
				}
			});
		})();
	</script>
</div>
</body>
</html>
