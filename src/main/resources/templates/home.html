<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>기리기리</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<style>
		/* TODO(강노은): 카드 리스트 붙이면서 공통 CSS로 옮길 것 */
		#kakao-map { width: 100%; height: 260px; }
	</style>
</head>
<body>
	<div class="app-container">
		<header th:replace="~{fragments/layout :: header(title='기리기리', badge='')}"></header>

		<main class="app-content">
			<h1>기리기리</h1>
			<p>동네 가게 마감 임박 음식 긴급 구제 서비스</p>

			<div id="kakao-map"></div>
		</main>

		<nav th:replace="~{fragments/layout :: nav(active='home')}"></nav>
	</div>

	<script th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapJsKey} + '&libraries=services,clusterer'}"></script>
	<script th:inline="javascript">
		/*<![CDATA[*/
		// StoreRepository에서 좌표가 있는 매장 전체를 뿌린다.
		var stores = /*[[${stores}]]*/ [];

		// 매장이 하나도 없을 때는 서울시청 좌표를 기본값으로 둔다.
		var FALLBACK_CENTER = { latitude: 37.5665, longitude: 126.9780 };

		kakao.maps.load(function () {
			var container = document.getElementById('kakao-map');
			var center = stores.length > 0 ? stores[0] : FALLBACK_CENTER;
			var map = new kakao.maps.Map(container, {
				center: new kakao.maps.LatLng(center.latitude, center.longitude),
				level: 4
			});

			var infoWindow = new kakao.maps.InfoWindow({ removable: true });

			stores.forEach(function (store) {
				var position = new kakao.maps.LatLng(store.latitude, store.longitude);
				var marker = new kakao.maps.Marker({ position: position, map: map });

				kakao.maps.event.addListener(marker, 'click', function () {
					infoWindow.setContent(
						'<div style="padding:6px 10px;font-size:13px;white-space:nowrap;">'
						+ store.storeName + (store.category ? ' · ' + store.category : '')
						+ '</div>'
					);
					infoWindow.open(map, marker);
				});
			});
		});
		/*]]>*/
	</script>
</body>
</html>
