<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>기리기리</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<style>
		/* TODO(강노은): 카드 리스트 붙이면서 공통 CSS로 옮길 것 */
		#kakao-map { width: 100%; height: 260px; }
	</style>
</head>
<body>
	<div class="app-container">
		<header th:replace="~{fragments/layout :: header(title='기리기리', badge='')}"></header>

		<main class="app-content">
			<h1>기리기리</h1>
			<p>동네 가게 마감 임박 음식 긴급 구제 서비스</p>

			<div id="kakao-map"></div>
		</main>

		<nav th:replace="~{fragments/layout :: nav(active='home')}"></nav>
	</div>

	<script th:src="@{'//dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapJsKey} + '&libraries=services,clusterer'}"></script>
	<script th:inline="javascript">
		/*<![CDATA[*/
		// TODO(강노은): StoreRepository 연동 후 실제 가게 좌표 목록으로 교체.
		// 현재는 SDK 연동 확인용 데모 좌표(서울시청)다.
		kakao.maps.load(function () {
			var container = document.getElementById('kakao-map');
			var options = {
				center: new kakao.maps.LatLng(37.5665, 126.9780),
				level: 4
			};
			var map = new kakao.maps.Map(container, options);

			var marker = new kakao.maps.Marker({
				position: options.center
			});
			marker.setMap(map);
		});
		/*]]>*/
	</script>
</body>
</html>
