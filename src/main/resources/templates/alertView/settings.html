<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('알림 설정', ~{:: #content}, 'alert', false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">

	<a th:href="@{/user/alerts}" class="u-mut" style="font-size:12px;text-decoration:none">‹ 알림함으로</a>
	<h1 style="font-size:18px;margin-top:8px">알림 설정</h1>

	<div th:if="${param.saved}" class="banner" style="margin-top:12px">
		<span class="banner__title">저장했어요</span>
	</div>

	<style>
		/* 강노은: 프로젝트에 아직 토글 스위치 컴포넌트가 없어서 이 페이지 전용으로만 둔다 —
		   체크박스 하나로 필요는 채워지고, 재사용할 다른 화면이 생기기 전까진 공용 CSS로 옮기지 않는다. */
		.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: var(--s-4) 0; }
		.toggle-row + .toggle-row { border-top: 1px solid var(--c-line-weak); }
		.toggle-row__label { font-size: 14px; font-weight: var(--fw-bold); }
		.toggle-row__desc { font-size: 12px; color: var(--c-text-mut); margin-top: 2px; }
		.toggle { position: relative; display: inline-block; width: 44px; height: 26px; flex: 0 0 auto; }
		.toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
		.toggle__track { position: absolute; inset: 0; background: var(--c-line); border-radius: 999px; transition: background .15s ease; }
		.toggle__track::before {
			content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
			background: #fff; border-radius: 50%; transition: transform .15s ease;
		}
		.toggle input:checked ~ .toggle__track { background: var(--c-primary); }
		.toggle input:checked ~ .toggle__track::before { transform: translateX(18px); }
	</style>

	<form th:action="@{/user/alerts/settings}" method="post" style="margin-top:8px">
		<div class="card card--flat" style="padding:0 var(--s-4)">
			<div class="toggle-row">
				<div>
					<div class="toggle-row__label">PUSH 알림</div>
					<div class="toggle-row__desc">예약 확정·픽업 임박·노쇼 등 전체 알림</div>
				</div>
				<label class="toggle">
					<input type="checkbox" name="pushEnabled" value="true" th:checked="${pushEnabled}">
					<span class="toggle__track"></span>
				</label>
			</div>
			<div class="toggle-row">
				<div>
					<div class="toggle-row__label">찜한 가게 알림</div>
					<div class="toggle-row__desc">찜한 가게가 마감세일을 시작하면 알려줘요</div>
				</div>
				<label class="toggle">
					<input type="checkbox" name="likeAlertEnabled" value="true" th:checked="${likeAlertEnabled}">
					<span class="toggle__track"></span>
				</label>
			</div>
		</div>
		<button type="submit" class="btn btn--block" style="margin-top:var(--s-4)">저장</button>
	</form>

</div>
</body>
</html>
