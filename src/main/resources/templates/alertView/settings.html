<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('알림 설정', ~{:: #content}, ${session.viewMode == 'OWNER_MODE' ? 'my-owner' : 'alert'}, false, '', null)}">
<body>
<div id="content" th:fragment="content" class="page">

	<h1 style="font-size:18px">알림 설정</h1>

	<!-- 강노은 (2026-10-05): 실시간 알림 토스트와 같은 모양 — 화면 맨 위에 떴다가 3초 뒤 사라진다
	     (data-auto-dismiss, app.js). -->
	<div th:if="${param.saved}" class="girigiri-toast" data-auto-dismiss="3000">
		<svg class="icon" style="width:16px;height:16px"><use href="#i-check-circle"/></svg>
		<span>저장했어요</span>
	</div>

	<style>
		/* 강노은: 토글 스위치(.switch)는 2026-09-24 components.css로 공용화됨 (WBS CSS 1단계 정리, D)
		   — 이 화면의 .toggle/.toggle__track과 settings.css의 .settings-toggle이 완전히 같은 값을
		   각자 페이지에 복붙해 두고 있어서 하나로 합쳤다. 감싸는 행(.toggle-row)은 이 화면 전용이라
		   그대로 남긴다. */
		.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: var(--s-4) 0; }
		.toggle-row + .toggle-row { border-top: 1px solid var(--c-line-weak); }
		.toggle-row__label { font-size: 14px; font-weight: var(--fw-bold); }
		.toggle-row__desc { font-size: 12px; color: var(--c-text-mut); margin-top: 2px; }
	</style>

	<form th:action="@{/user/alerts/settings}" method="post" style="margin-top:8px">
		<div class="card card--flat" style="padding:0 var(--s-4)">
			<div class="toggle-row">
				<div>
					<div class="toggle-row__label">PUSH 알림</div>
					<div class="toggle-row__desc">예약 확정·픽업 임박·노쇼 등 전체 알림</div>
				</div>
				<label class="switch">
					<input type="checkbox" name="pushEnabled" value="true" th:checked="${pushEnabled}">
					<span class="switch__track"></span>
				</label>
			</div>
			<div class="toggle-row">
				<div>
					<div class="toggle-row__label">찜한 가게 알림</div>
					<div class="toggle-row__desc">찜한 가게가 마감세일을 시작하면 알려줘요</div>
				</div>
				<label class="switch">
					<input type="checkbox" name="likeAlertEnabled" value="true" th:checked="${likeAlertEnabled}">
					<span class="switch__track"></span>
				</label>
			</div>
		</div>
		<button type="submit" class="btn btn--block" style="margin-top:var(--s-4)">저장</button>
	</form>

</div>
</body>
</html>
