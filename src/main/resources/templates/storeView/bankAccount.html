<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('계좌 등록·변경', ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<!--/*
	추가됨 (2026-10-07, 계좌 보안) — 점주가 정산 계좌를 등록/변경 "신청"하는 화면. /store/edit에서는
	더 이상 계좌를 직접 못 바꾸고 여기로 들어온다. 신청하면 바로 반영되는 게 아니라 슈퍼어드민 승인을
	기다려야 한다(BankAccountChangeService) — 그 사이엔 StoreEntity.accountStatus=UNDER_REVIEW라
	정산 지급이 보류된다.
*/-->
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/store.css}">

	<a th:href="@{/store/edit}" class="u-sub" style="font-size:13px;display:inline-block;margin-bottom:var(--s-3)">&lsaquo; 매장 정보 수정으로</a>

	<div th:if="${submitSuccess != null}" class="banner" style="margin-bottom:var(--s-3)">
		<div>
			<p class="banner__title">&#9989; 신청 접수</p>
			<p class="banner__desc" th:text="${submitSuccess}">계좌 등록·변경 신청이 접수됐어요.</p>
		</div>
	</div>

	<div class="card">
		<div class="u-row" style="justify-content:space-between;align-items:flex-start">
			<h3>현재 계좌 상태</h3>
			<span class="badge"
			      th:classappend="${store.accountStatus == 'NORMAL'} ? 'badge--success' : (${store.accountStatus == 'UNDER_REVIEW'} ? 'badge--warning' : 'badge--danger')"
			      th:text="${store.accountStatus == 'NORMAL'} ? '정상' : (${store.accountStatus == 'UNDER_REVIEW'} ? '변경 심사 중' : '미등록')">미등록</span>
		</div>
		<p class="u-sub" th:text="(${store.bankName} ?: '-') + ' · ' + (${T(net.dsa.girigiri.util.BankAccountMaskUtil).mask(store.bankAccount)} ?: '-') + ' · ' + (${store.accountHolder} ?: '-')">국민 · 110***4567 · 예금주</p>
	</div>

	<div class="card" th:if="${hasPending}" style="margin-top:var(--s-3)">
		<p class="u-sub">이미 처리 대기 중인 신청이 있어요. 운영자가 확인할 때까지 새 신청은 받을 수 없어요.</p>
	</div>

	<form th:unless="${hasPending}" th:action="@{/store/bank-account/request}" method="post"
	      enctype="multipart/form-data" style="margin-top:var(--s-3)">
		<div class="field">
			<label class="field__label">은행 <span class="u-accent">*</span></label>
			<select class="input" name="bankName" required>
				<option value="">은행 선택</option>
				<option th:each="b : ${ {'국민','신한','우리','하나','농협','기업','카카오뱅크','토스뱅크','새마을금고','부산','경남','대구','우체국'} }"
				        th:value="${b}" th:text="${b}">국민</option>
			</select>
		</div>
		<div class="field" style="margin-top:var(--s-3)">
			<label class="field__label" for="bankAccount">계좌번호 <span class="u-accent">*</span></label>
			<input class="input" type="text" id="bankAccount" name="bankAccount" required maxlength="40" placeholder="- 없이 입력">
		</div>
		<div class="field" style="margin-top:var(--s-3)">
			<label class="field__label" for="accountHolder">예금주명 <span class="u-accent">*</span></label>
			<input class="input" type="text" id="accountHolder" name="accountHolder" required maxlength="40">
		</div>
		<div class="field" style="margin-top:var(--s-3)">
			<label class="field__label" for="passbook">통장 사본 <span class="u-accent">*</span></label>
			<input class="input" type="file" id="passbook" name="passbook" accept="image/jpeg,image/png,image/webp,image/gif" required>
			<p class="u-sub" style="font-size:var(--fs-xs);margin-top:4px">예금주명이 보이는 통장 사본 또는 계좌 개설 확인서 이미지를 올려주세요.</p>
		</div>
		<button type="submit" class="btn btn--block" style="margin-top:var(--s-4)">신청하기</button>
	</form>

	<h3 class="u-sub" style="margin-top:var(--s-5);font-size:var(--fs-sm)">신청 이력</h3>
	<div th:if="${#lists.isEmpty(history)}" class="empty-state">아직 신청 이력이 없어요.</div>
	<div class="card" th:each="h : ${history}" style="margin-top:var(--s-2)">
		<div class="u-row" style="justify-content:space-between">
			<span class="u-sub" th:text="${#temporals.format(h.requestedAt, 'yyyy-MM-dd HH:mm')}">2026-10-07 10:00</span>
			<span class="badge"
			      th:classappend="${h.status == 'APPROVED'} ? 'badge--success' : (${h.status == 'REJECTED'} ? 'badge--danger' : 'badge--warning')"
			      th:text="${h.status == 'APPROVED'} ? '승인됨' : (${h.status == 'REJECTED'} ? '반려됨' : '대기중')">대기중</span>
		</div>
		<p class="u-sub" th:text="${h.newBankName} + ' · ' + ${h.newBankAccountMasked} + ' · ' + ${h.newAccountHolder}">국민 · 110***4567 · 예금주</p>
		<p th:if="${h.status == 'REJECTED'}" class="u-sub" style="color:var(--c-danger)" th:text="'반려 사유: ' + ${h.rejectReason}">반려 사유</p>
	</div>
</div>
</body>
</html>
