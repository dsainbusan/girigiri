<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${storeName}, ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<!--/*
	점주 대시보드
	담당: 문창호 (WBS 3.0 매장 운영)

	변경됨 (2026-08-21) — 왜: 사용자가 만든 목업(오늘 매출·판매/등록·픽업예약·구제율 2x2 통계 +
	판매 vs 폐기 진행률 바) 참고해서 화면 구성을 다시 잡았다. 새 CSS 클래스는 하나도 추가하지 않고
	기존 stat-grid/stat-card, card, progress, btn--outline만 재사용 — 컬러 점(dot) 정도만 인라인
	스타일로 처리했다. 배지는 "관리자 모드"가 아니라 "점주 모드"로 명명 — 이 서비스엔 플랫폼 운영자용
	진짜 "관리자(어드민)" 화면이 별도로 있어서 명칭이 겹치면 안 된다(CLAUDE.md 참고).
*/-->
<div id="content" th:fragment="content" class="page">

	<div class="u-row" style="justify-content: space-between; align-items: flex-start; margin-bottom: var(--s-4)">
		<p class="u-sub" th:text="${closingLabel}">마감 21:00</p>
		<a th:href="@{/store/edit}" class="u-sub" style="font-size: var(--fs-xs); text-decoration: underline;">매장 정보 수정</a>
	</div>

	<div class="stat-grid">
		<div class="stat-card">
			<span class="stat-card__label">오늘 매출</span>
			<span class="stat-card__value" th:text="${todaySales}">286,400원</span>
			<span class="stat-card__delta u-primary" th:text="${salesDelta}">▲ 어제 대비 +18%</span>
		</div>
		<div class="stat-card">
			<span class="stat-card__label">판매 / 등록</span>
			<span class="stat-card__value" th:text="${soldCount} + ' / ' + ${registeredCount}">18 / 24</span>
			<span class="stat-card__delta u-accent" th:text="${sellingNowCount} + '개 판매중'">6개 판매중</span>
		</div>
		<div class="stat-card">
			<span class="stat-card__label">픽업 예약</span>
			<span class="stat-card__value" th:text="${reservationCount} + '건'">5건</span>
			<span class="stat-card__delta u-mut" th:text="'대기 ' + ${reservationWaiting} + ' · 완료 ' + ${reservationDone} + ' · 취소 ' + ${reservationCancelled}">대기 2 · 완료 3 · 취소 1</span>
		</div>
		<div class="stat-card">
			<span class="stat-card__label">폐기 절감(구제율)</span>
			<span class="stat-card__value" th:text="${rescueRate} + '%'">75%</span>
			<span class="stat-card__delta u-primary" th:text="${rescueGoal}">목표 70% 달성</span>
		</div>
	</div>

	<div class="card" style="margin-top: var(--s-4)">
		<div class="u-row" style="justify-content: space-between">
			<p class="u-bold">오늘 판매 vs 폐기</p>
			<span class="u-bold u-primary" th:text="'구제율 ' + ${rescueRate} + '%'">구제율 75%</span>
		</div>
		<div class="progress" style="margin-top: var(--s-3)">
			<div class="progress__bar" th:style="'width:' + ${rescueRate} + '%'"></div>
		</div>
		<div class="u-row" style="gap: var(--s-4); margin-top: var(--s-2); font-size: var(--fs-xs)">
			<span class="u-row" style="gap: 4px">
				<span style="width:8px; height:8px; border-radius:50%; background:var(--c-primary); display:inline-block"></span>
				<span th:text="'판매 ' + ${soldCount} + '개'">판매 18개</span>
			</span>
			<span class="u-row" style="gap: 4px">
				<span style="width:8px; height:8px; border-radius:50%; background:var(--c-danger); display:inline-block"></span>
				<span th:text="'폐기 예상 ' + ${expiredCount} + '개'">폐기 예상 6개</span>
			</span>
		</div>
	</div>

	<!-- 추가됨 — 왜: 픽업 확인(/reservation/pickup)·매장 취소(/reservation/store-cancel) 화면은
	     이미 만들어져 있는데(송채현 담당), 대시보드 어디에도 이 화면으로 가는 링크가 없어서 위
	     "픽업 예약" 통계 카드에 숫자만 보이고 정작 처리하러 갈 방법이 없었다. -->
	<div class="card" style="margin-top: var(--s-3)">
		<p class="u-bold">픽업 처리</p>
		<div class="u-row" style="gap: var(--s-2); margin-top: var(--s-3)">
			<a th:href="@{/reservation/pickup}" class="btn btn--outline btn--block">QR 픽업 확인</a>
			<a th:href="@{/reservation/store-cancel}" class="btn btn--outline btn--block">매장 취소</a>
		</div>
	</div>

	<!-- 추가됨 — 왜: pull로 새로 들어온 예약 확인/수락(/reservation/incoming)·주문 마감 설정
	     (/reservation/settings) 화면(송채현 담당)도 위와 같은 이유로 대시보드에 진입점이 없었다.
	     이름은 원래 "픽업 설정"이었는데, 픽업 확인/처리/대기중 화면들이랑 이름이 겹쳐서 헷갈린다는
	     피드백으로 "주문 마감 설정"으로 바꿨다 — 실제로 이 화면이 정하는 건 "몇 시까지 주문을
	     받을지"(준비시간/마지막 픽업시간)라 이 이름이 더 정확하다. -->
	<div class="card" style="margin-top: var(--s-3)">
		<p class="u-bold">주문 · 설정</p>
		<div class="u-row" style="gap: var(--s-2); margin-top: var(--s-3)">
			<a th:href="@{/reservation/incoming}" class="btn btn--outline btn--block">들어온 예약 확인</a>
			<a th:href="@{/reservation/settings}" class="btn btn--outline btn--block">주문 마감 설정</a>
		</div>
		<a th:href="@{/reservation/completed}" class="btn btn--outline btn--block" style="margin-top: var(--s-2)">완료된 거래 내역</a>
	</div>

	<div class="card" style="margin-top: var(--s-3)">
		<p class="u-bold">리포트</p>
		<p class="u-sub" style="font-size: var(--fs-sm); margin-top: 2px">오늘 판매·폐기 현황을 문서로 내려받을 수 있습니다.</p>
		<div class="u-row" style="gap: var(--s-2); margin-top: var(--s-3)">
			<a th:href="@{/store/report/excel}" class="btn btn--outline btn--block">Excel</a>
			<a th:href="@{/store/report/pdf}" class="btn btn--outline btn--block">PDF</a>
		</div>
	</div>

	<!-- 추가됨 (2026-08-21) — 왜: 헤더의 모드 전환 토글(common/header.html)은 session.role=='OWNER'일 때만
	     보이는데, owner-apply로 매장만 등록하고 role은 아직 USER인 테스트 계정에선 안 보였다. role 승인
	     로직은 별도 담당 영역이라 롤백된 상태라, 이 화면 안에는 role 조건 없이 항상 버튼을 하나 더 둔다.
	     /auth/mode는 OWNER가 아니면 그냥 "/"로 보내니, USER 세션이어도 안전하게 동작한다. -->
	<form th:action="@{/auth/mode}" method="post" style="margin-top: var(--s-4)">
		<button type="submit" class="btn btn--outline btn--block">유저 모드로 전환</button>
	</form>

</div>
</body>
</html>
