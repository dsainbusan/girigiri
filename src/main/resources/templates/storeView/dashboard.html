<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>사장님 대시보드 - 기리기리</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="app-container mode-admin">
		<header th:replace="~{fragments/layout :: header(title=${storeName}, badge='관리자 모드')}"></header>

		<main class="app-content">
			<div class="stat-grid">
				<div class="stat-box">
					<div class="stat-value" th:text="${registeredCount}">12</div>
					<div class="stat-label">오늘 등록</div>
				</div>
				<div class="stat-box">
					<div class="stat-value" th:text="${soldCount}">8</div>
					<div class="stat-label">판매</div>
				</div>
				<div class="stat-box">
					<div class="stat-value" th:text="${expiredCount}">1</div>
					<div class="stat-label">폐기</div>
				</div>
				<div class="stat-box">
					<div class="stat-value" th:text="${rescueRate} + '%'">67%</div>
					<div class="stat-label">구제율</div>
				</div>
			</div>

			<div class="card" style="margin-top: 16px;">
				<p class="card-title">리포트</p>
				<p class="card-sub">오늘 판매·폐기 현황을 문서로 내려받을 수 있습니다.</p>
				<div class="btn-row">
					<a href="#" class="btn btn-outline btn-block">Excel</a>
					<a href="#" class="btn btn-outline btn-block">PDF</a>
				</div>
			</div>
		</main>
	</div>
</body>
</html>
