<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>사장님 대시보드 - 기리기리</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="app-container mode-admin">
		<header th:replace="~{fragments/layout :: header(title=${storeName}, badge='관리자 모드')}"></header>

		<main class="app-content">
			<!-- 추가됨 (2026-08-21) — 왜: role 라우팅 + 유저/점주 모드 분기 작업 중, 이 화면이 다른 페이지로
			     나가는 버튼이 하나도 없는 막다른 화면이었다. 이 페이지는 common/header.html(새 디자인
			     시스템)이 아니라 옛 fragments/layout.html을 쓰고 있어서 거기 추가한 토글이 안 보였다 —
			     여기서 별도로 "유저 모드로" 버튼을 추가한다. role은 그대로 두고 세션 viewMode만 바꾼다. -->
			<form th:action="@{/auth/mode}" method="post" style="margin-bottom: 16px;">
				<button type="submit" class="btn btn-outline btn-block">유저 모드로 전환</button>
			</form>

			<div class="stat-grid">
				<div class="stat-box">
					<div class="stat-value" th:text="${registeredCount}">12</div>
					<div class="stat-label">오늘 등록</div>
				</div>
				<div class="stat-box">
					<div class="stat-value" th:text="${soldCount}">8</div>
					<div class="stat-label">판매</div>
				</div>
				<div class="stat-box">
					<div class="stat-value" th:text="${expiredCount}">1</div>
					<div class="stat-label">폐기</div>
				</div>
				<div class="stat-box">
					<div class="stat-value" th:text="${rescueRate} + '%'">67%</div>
					<div class="stat-label">구제율</div>
				</div>
			</div>

			<div class="card" style="margin-top: 16px;">
				<p class="card-title">리포트</p>
				<p class="card-sub">오늘 판매·폐기 현황을 문서로 내려받을 수 있습니다.</p>
				<div class="btn-row">
					<a href="#" class="btn btn-outline btn-block">Excel</a>
					<a href="#" class="btn btn-outline btn-block">PDF</a>
				</div>
			</div>
		</main>

		<nav th:replace="~{fragments/layout :: nav(active='')}"></nav>
	</div>
</body>
</html>
