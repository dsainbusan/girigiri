<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${mode == 'edit'} ? '공지 수정' : '공지 작성', ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<!--/*
	점주 매장 공지 등록/수정 폼 (2026-09-29 신규). productForm.html과 같은 방식으로 등록/수정
	한 파일을 mode('new'|'edit')로 분기한다.
*/-->
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/store.css}">

	<p class="u-danger" th:if="${param.error != null}" style="margin-bottom: var(--s-4)">
		제목과 내용을 모두 입력해 주세요.
	</p>

	<form th:action="${mode == 'edit'} ? @{/store/announcements/{id}/edit(id=${announcement.id})} : @{/store/announcements/new}"
	      method="post" class="stack">
		<div class="field">
			<label class="field__label" for="title">제목</label>
			<input class="input" type="text" id="title" name="title" maxlength="100" required
			       th:value="${announcement != null} ? ${announcement.title} : ''" placeholder="예: 추석 연휴 휴무 안내">
		</div>
		<div class="field">
			<label class="field__label" for="content">내용</label>
			<textarea class="input js-autogrow" id="content" name="content" rows="6" maxlength="2000" required
			          placeholder="손님에게 안내할 내용을 적어주세요" th:text="${announcement != null} ? ${announcement.content} : ''"></textarea>
		</div>
		<button type="submit" class="btn btn--block" th:text="${mode == 'edit'} ? '수정 완료' : '등록'">등록</button>
	</form>

	<!-- textarea 자동 높이 조절 — storeView/reviews.html의 답글 입력창과 같은 방식. -->
	<script th:inline="none">
	(function () {
		function fit(el) {
			el.style.height = 'auto';
			el.style.height = el.scrollHeight + 'px';
		}
		document.querySelectorAll('.js-autogrow').forEach(function (el) {
			el.addEventListener('input', function () { fit(el); });
			fit(el);
		});
	})();
	</script>

	<!-- 뒤로가기는 항상 공지 목록으로 (2026-09-29) — 작성/수정 둘 다 이 화면을 공유한다. -->
	<script th:inline="none">
	(function () {
		let back = document.querySelector('.topbar__back[data-back]');
		if (!back) { return; }
		back.removeAttribute('data-back');
		back.addEventListener('click', function () { location.href = '/store/announcements'; });
	})();
	</script>
</div>
</body>
</html>
