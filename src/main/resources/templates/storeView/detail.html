<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${store.storeName} + ' - 기리기리', ~{:: #content}, 'home', false, '', null)}">
<body>
<div id="content" th:fragment="content">
	<div th:style="'height:120px;background:' + ${thumbColor} + ';display:flex;align-items:center;justify-content:center;font-size:44px'"
	     th:text="${thumbEmoji}">🥐</div>

	<div class="page">
		<div class="u-row" style="justify-content:space-between">
			<div>
				<h1 th:text="${store.storeName}">가게명</h1>
				<div class="u-sub" style="font-size:13px;margin-top:2px"
				     th:text="${store.category} + (${store.address} != null ? ' · ' + ${store.address} : '')">베이커리 · 광안동</div>
			</div>
			<button type="button" class="store-card__like" data-like-btn style="font-size:24px"
			        th:classappend="${liked} ? ' is-liked'" th:attr="data-store-id=${store.id}">&hearts;</button>
		</div>

		<div class="u-row" style="gap:6px;margin-top:8px" th:if="${reviewCount} > 0">
			<span class="star" style="font-size:14px">★★★★☆</span>
			<b style="font-size:14px" th:text="${avgRating}">4.6</b>
			<span class="u-mut" style="font-size:13px" th:text="'(' + ${reviewCount} + ')'">(128)</span>
		</div>

		<div style="margin-top:12px">
			<div class="info-row">
				<span class="info-row__ico">🕘</span>
				<div class="u-grow">
					<b style="font-size:13px">영업시간</b>
					<span class="u-sub" style="font-size:13px"
					      th:text="${store.operatingHours} + (${#strings.isEmpty(closingLabel)} ? '' : ' · ' + ${closingLabel})">07:00–21:00</span>
				</div>
			</div>
			<div class="info-row" th:if="${store.address != null}">
				<span class="info-row__ico">📍</span>
				<div class="u-grow">
					<span class="u-sub" style="font-size:13px" th:text="${store.address}">주소</span>
				</div>
			</div>
		</div>

		<div class="section-title" style="font-size:15px">
			지금 파는 마감 상품 <span class="section-title__count" th:text="${products.size()}">3</span>
		</div>

		<div style="display:flex;flex-direction:column;gap:10px">
			<a th:each="p : ${products}" th:href="@{/user/products/{id}(id=${p.id})}" class="store-card">
				<span class="store-card__thumb" th:style="'background:' + ${thumbColor}" th:text="${thumbEmoji}">빵</span>
				<span class="store-card__body">
					<span class="store-card__name" th:text="${p.name}">상품명</span>
					<span class="price" style="margin-top:4px">
						<span class="badge badge--discount" th:text="${p.discountRate}">-51%</span>
						<span class="price__orig" th:text="${p.origPrice}">12,000원</span>
						<span class="price__sale" style="font-size:15px" th:text="${p.salePrice}">5,900원</span>
					</span>
					<span class="store-card__left" th:text="${p.remainingQuantity} + '개 남음'">3개 남음</span>
				</span>
			</a>
			<p th:if="${#lists.isEmpty(products)}" class="u-sub">지금은 판매 중인 마감세일 상품이 없어요.</p>
		</div>

		<div class="u-row" style="gap:8px;margin-top:var(--s-4)">
			<a th:href="@{/user/inquiries/new(storeId=${store.id})}" class="btn btn--outline u-grow">이 가게에 문의하기</a>
			<a th:href="@{/user/support}" class="btn btn--outline u-grow">내 문의 내역</a>
		</div>

		<style>
			/* 강노은: 리뷰 별점 선택 UI. 라디오를 숨기고 label(★)을 오른쪽부터 채워서
			   :checked ~ label / :hover ~ label로 "N번째까지 채우기"를 흉내낸다. */
			.star-input { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; font-size: 26px; }
			.star-input input { position: absolute; opacity: 0; width: 0; height: 0; }
			.star-input label { color: var(--c-line); cursor: pointer; }
			.star-input input:checked ~ label,
			.star-input input:hover ~ label,
			.star-input label:hover ~ label { color: var(--c-accent); }
		</style>

		<div class="section-title" style="font-size:15px">
			리뷰 <span class="section-title__count" th:text="${reviewCount}">12</span>
		</div>

		<!--/* 강노은: myRating==0(아직 안 씀)이면 새 리뷰 폼을 바로 보여준다.
		     이미 썼으면(myRating>0) 폼은 기본 숨김 — 아래 목록에서 "내 리뷰"의 "수정" 버튼을 눌러야 펼쳐진다. */-->
		<div class="card" th:if="${loggedIn and myRating == 0}">
			<p class="field__label" style="margin-bottom:8px">리뷰 남기기</p>
			<form th:action="@{/user/stores/{id}/reviews(id=${store.id})}" method="post">
				<div class="star-input">
					<input type="radio" name="rating" value="5" id="star5"><label for="star5">★</label>
					<input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
					<input type="radio" name="rating" value="3" id="star3" checked><label for="star3">★</label>
					<input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
					<input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
				</div>
				<textarea name="content" class="input" style="margin-top:10px;min-height:70px;resize:vertical" placeholder="가게는 어떠셨나요?"></textarea>
				<button type="submit" class="btn btn--block" style="margin-top:10px">리뷰 등록하기</button>
			</form>
		</div>

		<div class="card" id="review-edit-form" th:if="${loggedIn and myRating > 0}" style="display:none">
			<p class="field__label" style="margin-bottom:8px">내 리뷰 수정하기</p>
			<form th:action="@{/user/stores/{id}/reviews(id=${store.id})}" method="post">
				<div class="star-input">
					<input type="radio" name="rating" value="5" id="estar5" th:checked="${myRating} == 5"><label for="estar5">★</label>
					<input type="radio" name="rating" value="4" id="estar4" th:checked="${myRating} == 4"><label for="estar4">★</label>
					<input type="radio" name="rating" value="3" id="estar3" th:checked="${myRating} == 3"><label for="estar3">★</label>
					<input type="radio" name="rating" value="2" id="estar2" th:checked="${myRating} == 2"><label for="estar2">★</label>
					<input type="radio" name="rating" value="1" id="estar1" th:checked="${myRating} == 1"><label for="estar1">★</label>
				</div>
				<textarea name="content" class="input" style="margin-top:10px;min-height:70px;resize:vertical"
				          placeholder="가게는 어떠셨나요?" th:text="${myContent}"></textarea>
				<button type="submit" class="btn btn--block" style="margin-top:10px">리뷰 수정하기</button>
			</form>
		</div>
		<p th:unless="${loggedIn}" class="u-sub">
			<a th:href="@{/auth/loginForm}" class="u-primary" style="font-weight:700">로그인</a> 하면 리뷰를 남길 수 있어요.
		</p>

		<div style="display:flex;flex-direction:column;gap:0;margin-top:10px">
			<div th:each="r : ${reviews}" class="list-row" style="align-items:flex-start">
				<div class="list-row__body">
					<div class="u-row" style="justify-content:space-between">
						<span class="u-row" style="gap:6px">
							<b style="font-size:13px" th:text="${r.reviewerName}">닉네임</b>
							<span th:if="${r.mine}" class="badge badge--success" style="font-size:10px">내 리뷰</span>
						</span>
						<span class="u-mut" style="font-size:11px">
							<span th:text="${r.createdAtLabel}">3일 전</span>
							<span th:if="${r.edited}" title="작성 후 내용이 수정된 리뷰예요"> · 수정됨</span>
						</span>
					</div>
					<div style="color:var(--c-accent);font-size:13px;margin-top:2px" th:text="${'★'.repeat(r.rating) + '☆'.repeat(5 - r.rating)}">★★★★☆</div>
					<p style="font-size:13px;margin-top:4px" th:text="${r.content}">리뷰 내용</p>
					<div class="u-row" style="gap:6px;margin-top:6px">
						<button th:if="${r.mine}" type="button" class="btn btn--outline" data-edit-review-btn
						        style="padding:4px 12px;font-size:12px">수정</button>
						<form th:if="${r.canDelete}" th:action="@{/user/stores/{id}/reviews/{reviewId}/delete(id=${store.id}, reviewId=${r.id})}"
						      method="post" onsubmit="return confirm('리뷰를 삭제할까요?')">
							<button type="submit" class="btn btn--outline"
							        style="padding:4px 12px;font-size:12px;color:var(--c-danger);border-color:var(--c-danger)">삭제</button>
						</form>
					</div>
				</div>
			</div>
			<p th:if="${#lists.isEmpty(reviews)}" class="u-sub">아직 리뷰가 없어요. 첫 리뷰를 남겨보세요!</p>
		</div>

		<script>
			(function () {
				var btn = document.querySelector('[data-edit-review-btn]');
				var form = document.getElementById('review-edit-form');
				if (!btn || !form) return;
				btn.addEventListener('click', function () {
					form.style.display = 'block';
					form.scrollIntoView({ behavior: 'smooth', block: 'center' });
				});
			})();
		</script>
	</div>
</div>
</body>
</html>
