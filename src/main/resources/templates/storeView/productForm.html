<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${mode == 'edit'} ? '상품 수정' : '상품 등록', ~{:: #content}, '', true, '점주 모드', null)}">
<body>
<!--/*
	점주 상품(재고) 등록/수정 폼 — WBS 3.0 (원래 김태훈 담당 → 2026-08-26 문창호 인계). 목업 단계.
	- 사진 = 진짜 파일 업로드 (enctype=multipart/form-data 필수). 미리보기는 클라이언트 JS.
	- 가격 = 원가만 입력하면 마감시간 기준으로 할인가 자동계산 (PosApiController / DiscountRateCalculator 정책 그대로).
	- 등록/수정/삭제 겸용 한 파일. mode('create'|'edit') 로 분기. 실제 POST 처리는 다음 단계에서 StoreProductController에 배선.
*/-->
<div id="content" th:fragment="content" class="page">
	<link rel="stylesheet" th:href="@{/css/store.css}">

	<p class="u-danger" th:if="${param.error}" style="margin-bottom: var(--s-4)">필수 항목을 모두 올바르게 입력해 주세요.</p>

	<form th:action="${mode == 'edit'} ? @{/store/products/{id}(id=${productId})} : @{/store/products}"
	      method="post" enctype="multipart/form-data" id="productForm">

		<!-- 초안(오늘의 구제) 수정이면 저장과 동시에 발행한다 -->
		<input th:if="${isDraft}" type="hidden" name="publishAfter" value="true">
		<!-- POS 카탈로그에서 넘어온 경우 사진 URL을 유지 (새 파일을 올리면 그게 우선) -->
		<input th:if="${form.currentImageUrl != null}" type="hidden" name="currentImageUrl" th:value="${form.currentImageUrl}">

		<!-- 1. 상품 사진 -->
		<div class="field">
			<label class="field__label" for="image">상품 사진</label>
			<label class="uploader" for="image">
				<img id="imagePreview" class="uploader__preview"
				     th:src="${form.currentImageUrl}"
				     th:classappend="${form.currentImageUrl == null} ? ' is-hidden'" alt="상품 사진 미리보기">
				<span id="uploaderHint" class="uploader__hint"
				      th:classappend="${form.currentImageUrl != null} ? ' is-hidden'">📷<br>사진 추가</span>
			</label>
			<input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp,image/gif" class="is-hidden">
			<input th:if="${mode == 'edit'}" type="hidden" name="removeImage" id="removeImage" value="false">
			<button type="button" id="imageRemoveBtn"
			        th:if="${mode == 'edit' and form.currentImageUrl != null}"
			        class="btn btn--sm btn--outline stock-item__del" style="align-self: flex-start; margin-top: 6px">사진 삭제</button>
			<p class="u-sub" style="font-size: var(--fs-xs); margin-top: 4px">
				5MB 이하 이미지 1장 (jpg·png·webp·gif, 선택). 안 올리면 카테고리 기본 이미지가 표시돼요.
			</p>
		</div>

		<!-- 2. 품목명 -->
		<div class="field" style="margin-top: var(--s-4)">
			<label class="field__label" for="name">품목명 <span class="u-accent">*</span></label>
			<input class="input" type="text" id="name" name="name" th:value="${form.name}"
			       placeholder="예: 오늘의 모둠빵 세트" required maxlength="100">
		</div>

		<!-- 3. 원가 -->
		<div class="field" style="margin-top: var(--s-4)">
			<label class="field__label" for="originalPrice">원가(정상가) <span class="u-accent">*</span></label>
			<input class="input" type="number" id="originalPrice" name="originalPrice" th:value="${form.originalPrice}"
			       placeholder="원 단위 숫자만" required min="1" inputmode="numeric">
		</div>

		<!-- 4. 수량 -->
		<div class="field" style="margin-top: var(--s-4)">
			<label class="field__label" for="quantity">수량 <span class="u-accent">*</span></label>
			<input class="input" type="number" id="quantity" name="quantity" th:value="${form.quantity}"
			       placeholder="등록할 개수" required min="1" inputmode="numeric">
			<p class="u-sub" th:if="${mode == 'edit'}" style="font-size: var(--fs-xs); margin-top: 4px">
				수량을 늘리면 남은 재고도 같이 늘어나요. 이미 예약된 수량보다 적게는 줄일 수 없어요.
			</p>
		</div>

		<!-- 5. 설명 -->
		<div class="field" style="margin-top: var(--s-4)">
			<label class="field__label" for="description">상품 설명</label>
			<textarea class="input js-autogrow" id="description" name="description" rows="2"
			          placeholder="구성, 알레르기 정보 등 (선택)" maxlength="500" th:text="${form.description}"></textarea>
		</div>

		<!-- 할인가 자동계산 안내 -->
		<div class="banner banner--info" style="margin-top: var(--s-5)">
			<span style="font-size: 16px">🏷️</span>
			<div class="u-grow">
				<div class="banner__title" style="color: var(--c-info)">할인가는 자동으로 계산돼요</div>
				<div class="banner__desc" style="color: var(--c-text-sub)">
					마감 1시간 이내 −50% · 1~3시간 −30% · 그 외 −20%. 마감이 가까울수록 더 할인됩니다.
				</div>
			</div>
		</div>

		<button type="submit" class="btn btn--block" style="margin-top: var(--s-6)"
		        th:text="${isDraft} ? '수정 후 발행' : (${mode == 'edit'} ? '저장하기' : '등록하기')">등록하기</button>
	</form>

	<form th:if="${mode == 'edit' and !isDraft}" th:action="@{/store/products/{id}/delete(id=${productId})}" method="post"
	      onsubmit="return confirm('이 상품을 삭제할까요? 되돌릴 수 없어요.')" style="margin-top: var(--s-3)">
		<button type="submit" class="btn btn--block btn--outline stock-item__del">상품 삭제</button>
	</form>
	<form th:if="${isDraft}" th:action="@{/store/products/{id}/discard(id=${productId})}" method="post"
	      onsubmit="return confirm('오늘은 이 상품을 안 올릴까요?')" style="margin-top: var(--s-3)">
		<button type="submit" class="btn btn--block btn--outline">오늘 안 함</button>
	</form>

	<script>
		(function () {
			var input = document.getElementById('image');
			var preview = document.getElementById('imagePreview');
			var hint = document.getElementById('uploaderHint');
			var removeBtn = document.getElementById('imageRemoveBtn');
			var removeFlag = document.getElementById('removeImage');

			if (input) {
				input.addEventListener('change', function () {
					var file = input.files && input.files[0];
					if (!file) return;
					preview.src = URL.createObjectURL(file);
					preview.classList.remove('is-hidden');
					hint.classList.add('is-hidden');
					if (removeFlag) removeFlag.value = 'false';   // 새로 올린 파일이 우선
					if (removeBtn) removeBtn.classList.remove('is-hidden');
				});
			}

			if (removeBtn) {
				removeBtn.addEventListener('click', function () {
					preview.src = '';
					preview.classList.add('is-hidden');
					hint.classList.remove('is-hidden');
					if (input) input.value = '';
					if (removeFlag) removeFlag.value = 'true';
					removeBtn.classList.add('is-hidden');
				});
			}

			// 설명 입력창: 내용만큼만 세로로 늘어나기 (max-height는 store.css에서 캡)
			document.querySelectorAll('.js-autogrow').forEach(function (el) {
				function fit() {
					el.style.height = 'auto';
					el.style.height = el.scrollHeight + 'px';
				}
				el.addEventListener('input', fit);
				fit();   // 수정 화면에서 기존 설명이 있을 때 초기 높이 맞추기
			});
		})();
	</script>
</div>
</body>
</html>
